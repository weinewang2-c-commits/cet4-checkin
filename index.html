e did not keep to the point.\n       B)    He was not gender sensitive.                                  D)    He spent too much time on details.\nPassage Two\nQuestions 20 to 22 are based on the passage you have just heard.\n20.    A) State your problem to the head waiter.                           C) Ask to see the manager politely but firmly.\n       B)    Demand a discount on the dishes ordered.                       D) Ask the name of the person waiting on you.\n21.    A) Your problem may not be understood correctly.\n         B) You don’t know if you are complaining at the right time.\n         C) Your complaint may not reach the person in charge.\n         D) You can’t tell how the person on the line is reacting.\n22.    A) Demand a prompt response.                                     C) Send it by express mail.\n       B) Provide all the details.                                      D) Stick to the point.\n\n                                                                       2\n\n                                               2014 年 6 月大学英语四级考试真题（三）\n\nPassage Three\nQuestions 23 to 25 are based on the passage you have just heard.\n23.   A) Fashion designer.                                                   C) City planner.\n       B)    Architect.                                                      D)    Engineer.\n24.   A) Do some volunteer work.                                             C)Work flexible hours.\n       B)    Get a well-paid part-time job.                                  D)    Go back to her previous post.\n25.   A) Few baby-sitters can be considered trustworthy.\n        B) It will add to family’s financial burden.\n        C) A baby-sitter is no replacement for a mother.\n        D) The children won’t get along with a baby-sitter.\n\nSection C\nDirections ：Inthissection, youwillheara passagethreetimes.Whenthepassageisreadforthefirsttime, youshouldlistencarefullyforitsgeneral\n                 idea. When the passage is read for the second time, you are required to fill the blanks with the exact words you have just heard.\n                 Finally, when the passage is read for the third time, you should check what you have written.\n       Almost every child, on the first day he sets foot in a school building, is smarter, more 26 , less afraid of what he doesn’t\nknow, better at finding and 27 , more confident, resourceful（机敏的）,persistent and 28 than he will ever be again in his\nschooling—or, unless he is very unusual and very lucky, for the rest of his life. Already, by paying close attention to and                      29\nthe world and people around him, and without any school-type formal instruction, he has done a task far more difficult,\ncomplicated and        30    than anything he will be asked to do in school, or than any of his teachers has done for years. He has\nsolved the 31 of language. He has discovered it—babies don’t even know that language exists—and he has found out how it\nworks and learnt to use it 32 . He has done it by exploring, by experimenting, by developing his own model of the grammar\nof language, by       33    and seeing whether it works by gradually changing it and             34    it until it does work. And while he has\nbeen doing this, he has been learning other things as well, including many of the 35 that the schools think only they can teach\nhim, and many that are more complicated than the ones they do try to teach him.\nPartⅢ                                         Reading Comprehension                                                  (40 minutes)\nSection A\nDirections ：In this section, there is a passage with ten blanks. You are required to select one word for each blank from a list of choices given in a\n                 word bank following the passage. Read the passage through carefully before making your choices. Each choice in the bank is\n                 identified by a letter. Please mark the corresponding letter for each item on Answer Sheet 2 with a single line through the centre.\n                 You may not use any of the words in the bank more than once.\n\nQuestions 36 to 45 are based on the following passage.\n            The fact is, the world has been finding less oil than it has been using for more than twenty years now. Not only has\ndemand been         36 , but the oil we have been finding is coming from places that are 37 to reach. At the same time, more of\nthis newly     38     oil is of the type that requires a greater investment to        39    . And because demand for this precious resource\nwill grow, according to some, by over 40 percent by 2025, fueling the world’s economic 40 will take a lot more energy from\nevery possible source.\n            The energy industry needs to get more from existing fields while continuing to search for new                   41 . Automakers\nmust continue to improve fuel efficiency and perfect hybrid (混合动力的）vehicles. Technological improvements are needed\nso that wind, solar and hydrogen can be more            42     parts of the energy equation. Governments need to formulate energy\npolicies that promote       43 and environmentally sound development. Consumers must be willing to pay for some of these\nsolutions, while practicing conservation efforts of their own.\n       Inaction is not an 44 . So let’s work together to balance this equation. We are taking some of the 45 needed to get\nstarted, but we need your help to go the rest of the way.\n\n                                                                         3\n\n                                              2014 年 6 月大学英语四级考试真题（三）\n\n                       A) consequently                                                                        I) feasible\n                          B) cultivate                                                                        J) growth\n                         C) declining                                                                         K) option\n                          D) derived                                                                          L) refine\n                          E) difficult                                                                       M) reserves\n                        F) discovered                                                                        N) soaring\n      G)                 economically\n                                                                                                               O) steps\n       H)                  exception\n\nSection B\nDirections ：In this section, you are going to read a passage with ten statements attached to it. Each statement contains information given in one of\n                the paragraphs. Identify the paragraph from which the information is derived. You may choose a paragraph more than once. Each\n                paragraph is marked with a letter. Answer the questions by marking the corresponding letter on Answer Sheet 2.\n                                                              I Cry, Therefore I Am\nA) In 2008, at a German zoo, a gorilla( 大 猩 猩 ） named Gana gave birth to a male infant, who died after three months.\n     Photographs of Gana, looking stricken and inconsolable (伤心欲绝的）, attracted crowds to the zoo. Sad as the scene was,\n     the humans, not Gana, were the only ones crying. The notion that animals can weep has no scientific basis. Years of\n     observations by biologists Dian Fossey, who observed gorillas, and Jane Goodall, who worked with chimpanzees( 黑 猩 猩 ) ,\n     could not prove that animals cry tears from emotion.\nB) It’s true that many animals shed tears, especially in response to pain. Tears protect the eye by keeping it moist. But crying\n     as an expression of feeling is unique to humans and has played an essential role in human evolution and the development of\n     human cultures.\nC) Within two days an infant can imitate sad and happy faces. If an infant does not cry out, it is unlikely to get the attention it\n     needs to survive. Around 3-4 months, the relationship between the human infant and its environment takes on a more\n     organized communicative role, and tearful crying begins to serve interpersonal purposes: the search for comfort and\n     pacification (抚慰). As we get older, crying becomes a tool of social interaction: grief and joy, shame and pride, fear and\n     manipulation.\nD) Tears are as universal as laughter, and grief is more complex than joy. But although we all cry, we do so in different ways.\n     Women cry more frequently and intensely than men, especially when exposed to emotional events. Like crying, depression\n     is, around the world, more commonly seen in women than in men. One explanation might be that women, who despite\n     decades of social advances still suffer from economic inequality, discrimination (歧视) and even violence, might have more\n     to cry about. Men not only cry for shorter periods than women, but they also are less inclined to explain their tears, usually\n     shed them more quietly, and tend more frequently to apologize when they cry openly. Men, like women, report crying at the\n     death of a loved one and in response to a moving religious experience. They are more likely than women to cry when their\n     core identities—as providers and protectors, as fathers and fighters—are questioned.\nE) People who score on personality tests as more sympathetic cry more than those who are more rigid or have more\n     self-control. Frequency of crying varies widely: some shed tears at any novel or movie, others only a handful of times in\n     their lives. Crying in response to stress and conflict in the home, or after emotional trauma (创伤), lasts much longer than\n     tears induced by everyday sadness—which in turn last longer than tears of delight and joy.\nF)   Sadness is our primary association with crying, but the fact is that people report feeling happier after crying. Surveys\n     estimate that 85% of women and 73% of men report feeling better after shedding tears. Surprisingly, crying is more\n     commonly associated with minor forms of depression than with major depression involving suicidal thoughts.\nG) People widely report that crying relieves tension, restores emotional balance and provides “catharsis,” a washing out of bad\n     feelings. The term “catharsis” has religious implications of removing evil and sin; it’s no surprise that religious ceremonies\n     are, around the world, one of the main settings for the release of tears.\nH) Crying is a nearly universal sign of grief, though some mourners report that, despite genuine sorrow, they cannot shed\n\n                                                                        4\n\n                                              2014 年 6 月大学英语四级考试真题（三）\n\n     tears—sometimes even for years after their loved one has gone. Unlike today, when the privacy of grief is more respected,\n     the public or ceremonial shedding of tears, at the graveside of a spouse or the funeral of a king or queen, was once\n     considered socially or even politically essential.\nI)   Crying has also served other social purposes. Rousseau wrote in his Confessions that while he considered tears the most\n     powerful expression of love, he also just liked to cry over nothing.\nJ)   The association of tears with art has ancient roots. The classic Greek tragedies of the fifth century B. C. were primarily\n     celebrations of gods. Tragedies, like poetry and music, were staged religious events. Even then it was recognized that\n     crying in response to drama brought pleasure.\nK) I have argued that there are neurobiological(神经生物方面的）associations linking the arts and mood disorders. When I\n     lecture on crying, I ask my audience to let me know, by a show of hands, which art forms most move them to tears. About\n     80% say music, followed closely by novels (74% ), but then the figures fall sharply, to 43% , for poetry, and 10 -22% for\n     paintings, sculpture and architecture.\nL) The physical act of crying is mainly one of breathing in air, which is why we choke up when we weep. This suggests to\n     language scientists that emotional crying evolved before language, perhaps explaining why tears communicate states of\n     mind and feelings that are often so difficult to express in words. Of course, from an evolutionary perspective, recognition\n     of emotion (usually through facial gesture) was essential for survival.\nM)    The earliest humans arrived several million years ago, but only 150,000 to 200,000 years ago, did cultures, language,\n     religion and the arts arise. Along the way, tears became more than a biological necessity to lubricate（润滑）the eye and\n     developed into a sign of intense emotion and a signal of social bonding. The development of self-consciousness and the\n     notion of individual identity, or ego; storytelling about the origins of the world, the creation of humanity and life after death;\n     and the ability to feel others, sadness—all were critical parts of the neurobiological changes that made us human.\nN)    More recently, we’ve learned from neuroscience that certain brain circuits （ 回 路 ） are activated( 激 活 ), rapidly and\n     unconsciously, when we see another in emotional distress. In short, our brain evolved circuits to allow us to experience\n     sympathy, which in turn made civilization, and an ethics based on sympathy, possible. So the next time you reach a tissue\n     box, or sob on a Mend’s shoulder, or shed tears at the movies, stop and reflect on why we cry and what it means to cry.\n     Because ultimately, while we love to cry, we also cry to love.\n46. Nowadays people respect the privacy of grief more than in the past.\n47. Infants cry to attract attention for survival.\n48. There is no scientific evidence as yet that animals can shed tears from emotion.\n49. Tears can perform certain communicative functions which words cannot.\n50. Our ability to experience sympathy is essential to the development of civilization.\n51. People are more inclined to cry when suffering minor forms of depression.\n52. Sometimes people cannot cry despite genuine grief.\n53. In humans, long history, tears have developed an essential role in social relationships.\n54. Men are less likely to give reasons for their tears.\n55. Crying has long been associated with art.\n\nSection C\nDirections ： There are 2 passages in this section. Each passage is followed by some questions or unfinished statements. For each of them there are\n                four choices marked A), B), C) and D). You should decide on the best choice and mark the corresponding letter on Answer\n                Sheet 2 with a single line through the centre.\nPassage One\nQuestions 56 to 60 are based on the following passage.\n       Hospitals, hoping to curb medical error, have invested heavily to put computers, smartphones and other devices into the\nhands of medical staff for instant access to patient data, drug information and case studies.\n       But like many cures, this solution has come with an unintended side effect: doctors and nurses can be focused on the\n\n                                                                       5\n\n                                           2014 年 6 月大学英语四级考试真题（三）\n\nscreen and not the patient, even during moments of critical care. A poll showed that half of medical technicians had admitted\ntexting during a procedure.\n       This phenomenon has set off an intensifying discussion at hospitals and medical schools about a problem perhaps best\ndescribed as “distracted doctoring.” In response, some hospitals have begun limiting the use of electronic devices in critical\nsettings, while schools have started reminding medical students to focus on patients instead of devices.\n       “You justify carrying devices around the hospital to do medical records, but you can surf the Internet or do Facebook, and\nsometimes Facebook is more tempting,” said Dr. Peter Papadakos at the University of Rochester Medical Center.\n       “My g u t fe e l i n g （ 本 能 的 感 觉 ）is lives are in danger,” said Dr. Papadakos. “We’re not educating people about the\nproblem, and ifs getting worse.”\n       A survey of 439 medical technicians found that 55 percent of technicians who monitor bypass machines acknowledged\nthat they had talked on cellphones during heart surgery. Half said they had texted while in surgery. The study concluded, “ Such\ndistractions have the potential to be disastrous.”\n      Medical professionals have always faced interruptions from cellphones, and multitasking is simply a fact of life for many\nmedical jobs. What has changed, say doctors, especially younger ones, is that they face increasing pressure to interact with their\ndevices.\n      The pressure stems from a mantra(信条）of modem medicine that patient care must be “data driven,” and informed by the\nlatest, instantly accessible information. By many accounts, the technology has helped reduce medical error by providing instant\naccess to patient data or prescription details.\n      Dr. Peter Carmel, president of the American Medical Association, said technology “offers great potential in health c a r e , ”\nb u t he added that doctors, first priority should be with the patient.\n56.    Why do hospitals equip their staff with computers, smartphones and other devices?\n      A) To reduce medical error.                                     C) To facilitate administration.\n      B) To cope with emergencies.                                    D) To simplify medical procedures.\n57. What does the author refer to by “distracted doctoring” ?\n      A)    The disservice done by modem devices to doctors, nurses, as well as patients.\n      B)    The tendency of medical institutions encouraging the use of modem devices.\n      C)    The problem of devices preventing doctors from focusing on their patients.\n      D)    The phenomenon of medical staff attending to personal affairs while working.\n58. What does Dr. Peter Papadakos worry about?\n      A)    Medical students are not adequately trained to use modem technology.\n      B)    Doctors’ interaction with their devices may endanger patients, lives.\n      C)    Doctors are relying too heavily on modem electronic technology.\n      D)    Pressures on the medical profession may become overwhelming.\n59. Why do doctors feel increasing pressure to use modem devices?\n      A)    Patients trust doctors who use modem technology.\n      B)    Use of modem devices adds hospitals’ revenues.\n      C)    Data is given too much importance in patient care.\n      D)    Patients’ data has to be revised from time to time.\n60. What is Peter Carmel’s advice to doctors?\n      A)    They follow closely the advances in medical science.\n      B)    They focus their attention on the patient’s condition.\n      C)    They observe hospital rules and regulations.\n      D)    They make the best use of modem devices.\nPassage Two\nQuestions 61 to 65 are based on the following passage.\n      I have closely watched my generation, known as The Millennials, for 29 years now. Joel Stein wrote an extensive piece on\n\n                                                                  6\n\n                                           2014 年 6 月大学英语四级考试真题（三）\n\nMillennials and he remains rather optimistic about our potential.\n      I hesitate to share his optimism because of paradox (矛盾的现象）we seem to exhibit, namely, that there are more avenues\nfor us to entertain ourselves than ever before, yet we are more bored than ever before.\n      Entertainment has never been more varied. We have more cable channels, television shows, and movies than ever before.\nInternet providers allow instant viewing of almost any movie or television program ever created. Social drinking and partying\nare also widely available for Millennials. Every generation develops these habits at a certain age, but Millennials seem to be\nextending this phase of life as they postpone marriage.\n     Some of this is undoubtedly due to The Great Recession. Milleimials are having a difficult time finding jobs; only 47\npercent of 16-to-24-year-olds are employed, the smallest share since government started recording data in 1948.\n     But do Millennials respond to these economic troubles by doing whatever it takes to make ends meet? Hardly. In fact, of\nthe four generations Pew Research has data for, the Milennial generation does not cite work ethic（勤奋工作）as distinctive of\nitself. Millennials want to save the world, but they sit and wait for that world-changing opportunity to be handed to them. Instead\nof working 2-3 jobs, launching a business, or doing what it takes to succeed, they retreat. Millennials may be the first generation\nto have a lower standard of living than their parents, but with this response to adversity (逆境), perhaps deservingly so.\n     Much ink has been spilled in management books discussing how to get the most out of these youths in the workplace.\nLargely, they come to the same conclusion: Millennials are entitled, over-confident, and expect too much too quickly. We\nshould not be surprised. Today’s young adults were raised by parents who made sure to boost their self-esteem at every turn,\ntelling them they could achieve whatever they set their minds to, and handing out prizes for the sixth place.\n61. What does the author of the passage think of Millennials?\n     A)    They show little interest in entertainment.\n     B)    They are not confident about their ability.\n     C)    They enjoy an easy life due to high technology.\n     D)    They may not have bright prospects for success.\n62. How do Millennials feel about their life?\n     A)    They can hardly do anything about it.                 C)      It is not as good as their parents’.\n     B)    There is little in it to get excited about.           D)      It is full of opportunities for success.\n63. In what way are Millennials different from previous generations according to Pew Research?\n     A)    They spend less time socializing.                     C)      They do not value hard work.\n     B)    They are indifferent to others.-                      D)      They are more independent.\n64. What should Millennials do according to the author?\n     A)    Remain optimistic in face of adversity.               C)      Make full use of new opportunities.\n     B)    Start a business as early as possible.                D)      Take action to change their situation.\n65. Why are Millennials over-confident about themselves?\n     A)    They have been spoiled by their parents.              C)      They are misguided by management books.\n     B)   They can always get whatever they expect.                 D)   They think they are young and energetic.\n\nPart IV                                                      Translation                                        (30 minutes)\nDirections：Forthispart, youareallowed 30minutestotranslateapassage fromChineseintoEnglish.You shouldwriteyouransweronAnswer\n              Sheet 2.\n     为了促进教育公平，中国已投入 360 亿元,用 于改善农村地区教育设施和加强中西部地区农村义务教育\n(compulsory education)。这些资金用于改善教学设施、购买书籍，使 16 万多所中小学受益。资金还用于购置音乐和\n绘画器材。现在农村和山区的儿童可以与沿海城市的儿童一样上音乐和绘画课。一些为接受更好教育而转往城市上学\n的学生如今又回到了本地农村学校就读。\n\n                                                                7\n"}, "2014-12-01": {"title": "2014年12月四级真题(第1套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2014-12/01", "text": "                                             2014 年 12 月年大学英语四级考试真题（一）\n\n                  2014 年 12 月大学英语四级考试真题（第 1 套)\nPart I                                                     Writing                                             (30 minutes)\nDirections ：For this part, you are allowed 30 minutes to write a short essay about a classmate of yours who has influenced you most\n                 in college. You should state the reasons and write at least 120 words but no more than 180 words.\n\nPart II                                Listening Comprehension                                             (30 minutes)\nSection A\nDirections ： In this section, you will hear 8 short conversations and 2 long conversations. At the end of each conversation,\n            one or more questions will be asked about what was said. Both the conversation and the questions will be\n            spoken only once. After each question there will be a pause. During the pause, you must read the four\n            choices marked A), B), C) and D), and decide which is the best answer. Then mark the corresponding letter\n            on Answer Sheet 1 with a single line through the centre.\n1.     A) The woman is fussy about the cleanness of the apartment.\n       B) He has not cleaned the apartment since his mothers visit.\n       C) He does not remember when his mother came over.\n       D) His mother often helps him to clean the apartment.\n2.    A) The bus stop is only two minutes’ walk.                C) They might as well take the next bus.\n      B) The running made him short of breath.              D) The woman is late by a couple of minutes.\n3. A) She is suffering a pain in her neck.                     C) She has to do extra work for a few days.\n      B）She is likely to replace Miss Smith.                   D) She is quite sick of working overtime.\n4. A) Change her job.                                          C) Open a flower shop.\n      B) Buy a dishwasher.                                     D) Start her own business.\n5.    A) He forgot where he had left the package             C) He wanted to deliver the package himself.\n       B) He slipped on his way to the post office.            D) He failed to do what he promised to do.\n6.     A) The speakers do not agree with each other.        C) The man pays for the tickets as a rule.\n       B) The woman does not like horror films.             D) The speakers happened to meet in the cinema.\n7.    A) The woman is just as unlucky as the man.           C) The speakers share a common view on love.\n      B) The woman is more sensitive than the man.         D) The speakers are unhappy with their marriage.\n8.    A) Preparations for a forum.                          C) Organizers of a forum.\n       B) Participants in the forum.                        D) Expectations of the forum.\nQuestions 9 to 11 are based on the conversation you have just heard.\n9.     A) France.                                           C) Russia.\n      B) Scandinavia                                       D) East Europe.\n10.    A) More women will be promoted in the workplace.\n       B) More women will overcome their inadequacies.\n      C) More women will receive higher education.\n       D) More women will work outside the family.\n\n11.    A) Try hard to protect women’s rights.\n       B) Educate men to respect women more.\n\n                                                                      1\n\n                                             2014 年 12 月年大学英语四级考试真题（一）\n\n       C) Help women acquire more professional skills.\n       D) Spend more time changing women’s attitudes.\n\nQuestions 12 to 15 are based on the conversation you have just heard.\n12. A) In a restaurant.                                              C) At the man’s office.\n      B) In a hotel lobby.                                           D) At the woman’s place.\n13.   A) He is the chief designer of the latest bike model.\n      B) He has completed an overseas market survey.\n      C) He is the Managing Director of Jayal Motors.\n       D) He has just come back from a trip to Africa.\n14.    A) To select the right model.                          C) To convince the board members.\n       B) To get a good import agent.                          D) To cut down production costs.\n15.    A) His flexibility.                                     C) His intelligence.\n       B) His vision.                                          D) His determination.\n\nSection B\nDirections ： In this section, you will hear 3 short passages. At the end of each passage, you will hear some questions. Both the\n                passage and the questions will be spoken only once. After you hear a question, you must choose the best answer from\n                the four choices marked A), B),C)and D). Then mark the corresponding letter on Answer Sheet 1 with a single line\n                through the centre.\nPassage One\nQuestions 16 to 18 are based on the passage you have just heard.\n16. A)      How being an identical twin influences one’s identity.\n       B) Why some identical twins keep their identities secret.\n       C) Why some identical twins were separated from birth.\n        D) How identical twins are born, raised and educated.\n17.   A) Their second wives were named Linda.                        C) Their first children were both daughters.\n       B)They grew up in different surroundings.                     D) They both got married when they were 39.\n18.   A) They want to find out the relationship between environment and biology.\n       B) They want to see what characteristics distinguish one from the other.\n       C) hey want to understand how twins communicate when far apart.\n        D) They want to know whether twins can feel each others pain.\n\nPassage Two\nQuestions 19 to 21 are based on the passage you have just heard.\n19.   A) It is especially attractive to children and the young.\n       B) It is the first choice of vacationers on the Continent.\n       C) It is as comfortable as living in a permanent house.\n       D) It is an inexpensive way of spending a          holiday.\n20.   A)    It has a solid plastic frame.                              C) It is very convenient     to set up.\n       B)    It consists of an inner and an outer tent.                D)    It is sold to many Continental countries.\n21.   A)    A groundsheet.                                             C) A kitchen extension.\n       B)   A gas stove.                                               D)    A spare tent.\nPassage Three\nQuestions 22 to 25 are based on the passage you have just heard.\n\n                                                                       2\n\n                                           2014 年 12 月年大学英语四级考试真题（一）\n\n22. A) It covers 179 square miles.                        C) It covers 97 square kilometers.\n    B) It is as big as New York City.                     D) It is only half the size of Spain.\n23. A) Its geographic features attracted many visitors.\n    B) Its citizens enjoyed a peaceful, comfortable life.\n    C) It imported food from foreign countries.\n    D) It was cut off from the rest of the world.\n24. A) The fast development of its neighboring countries.\n    B) The increasing investment by developed countries.\n    C) The building of roads connecting it with neighboring countries.\n    D) The establishing of diplomatic relations with France and Spain.\n25. A) They work on their farms.                          C) They raise domestic animals.\n    B) They work in the tourist industry.                 D) They make traditional handicrafts.\nSection C\nDirections ： In this section, you will hear a passage three times. When the passage is read for the first time, you should listen carefully\n                for its general idea. When the passage is read for the second time, you are required to fill in the blanks with the exact\n                words you have just heard. Finally, when the passage is read for the third time, you should check what you have written.\n      “Don’t take many English courses; they won’t help you get a decent job. ” ‘‘ Sign up for management classes, so you’ll be ready\nto join the family business when you graduate. ”\n      Sound     26      ? Many of us have heard suggestions like these      27    by parents or others close to us. Such comments often\nseem quite reasonable.\n      Why, then, should suggestions like these be taken with      28 ? The reason is they relate to decisions you should make. You are\nthe one who must     29   their consequences.\n      One of the worst reasons to follow a particular path in life is that other people want you to. Decisions that affect your life should\nbe your decisions—decisions you make after you’ve considered various         30 and chosen the path that suits you best.\n      Making your own decisions does not mean that you should        31 the suggestions of others. For instance, your parents do have\ntheir own unique experiences that may make their advice helpful, and having 32 in a great deal of your personal history, they may\nhave a clear view of your strengths and weaknesses. Still, their views are not necessarily accurate. They may still see you as a child,\n33   care and protection. Or they may see only your strengths. Or, in some unfortunate cases, they may          34 your flaws and\nshortcomings.\n      People will always be giving you advice. Ultimately, though, you have to make your own 35 .                                 .\nPart Ⅲ                                                Reading Comprehension                                     (40 minutes)\nSection A\nDirections ： In this section, there is a passage with ten blanks. You are required to select one word for each blank from a list of choices\n                given in a word bank following the passage. Read the passage through carefully before making your choices. Each\n                choice in the bank is identified by a letter. Please mark the corresponding letter for each item on Answer Sheet 2 with a\n                single line through the centre. You may not use any of the words in the bank more than once.\nQuestions 36 to 45 are based on the following passage.\n      One principle of taxation, called the benefits principle, states that people should pay taxes based on the benefits they receive from\ngovernment services. This principle tries to make public goods similar to 36 goods. It seems reasonable that a person who often goes\nto the movies pays more in 37 for movie tickets than a person who rarely goes. And 38 , a person who gets great benefit from a\npublic good should pay more for it than a person who gets little benefit.\n      The gasoline tax, for instance, is sometimes    39 using the benefits principle. In some states,     40     from the gasoline tax are\n\n                                                                    3\n\n                                           2014 年 12 月年大学英语四级考试真题（一）\n\nused to build and maintain roads. Because those who buy gasoline are the same people who use the roads, the gasoline tax might be\nviewed as a 41 way to pay for this government service.\n      The benefits principle can also be used to argue that wealthy citizens should pay higher taxes than poorer ones,       42 because\nthe wealthy benefit more from public services. Consider, for example, the benefits of police protection from       43 . Citizens with much\nto protect get greater benefit from police than those with less to protect. Therefore, according to the benefits principle, the wealthy\nshould 44 more than the poor to the cost of 45 the police force. The same argument can be used for many other public services,\nsuch as fire protection, national defense, and the court system.\n                             A) adapt                                                                 I) provided\n                           B) contribute                                                              J) revenues\n                            C) exerting                                                               K) similarly\n                           D) expenses                                                                 L) simply\n                              E) fair                                                                   M) theft\n                            F) justified                                                                N) total\n                           G）maintaining\n                                                                                                       O) wealth\n                          H) private\n\nSection B\nDirections ： In this section, you are going to read a passage with ten statements attached to it. Each statement contains information\n              given in one of the paragraphs. Identify the paragraph from which the information is derived. You may choose a\n              paragraph more than once. Each paragraph is marked with a letter. Answer the questions by marking the corresponding\n              letter on Answer Sheet 2.\n                                                          Growing Up Colored\nA) You wouldn’t know Piedmont anymore—my Piedmont, I mean—the town in West Virginia where I learned to be a colored boy.\nB) The 1950s in Piedmont was a time to remember, or at least to me. People were always proud to be from Piedmont—lying at the\n     foot of a mountain, on the banks of the mighty Potomac. We knew God gave America no more beautiful location. I never knew\n     colored people anywhere who were crazier about mountains and water, flowers and trees, fishing and hunting. For as long as\n     anyone could remember, we could outhunt, outshoot, and outswim the white boys in the valley.\nC) The social structure of Piedmont was something we knew like the back of our hands. It was an immigrant town; white Piedmont\n     was Italian and Irish, with a handful of wealthy WASPs (益格鲁撒 克逊裔的白人新教徒）on East Hampshire Street, and\n     “ethnic” neighborhoods of working-class people everywhere else, colored and white.\nD) For as long as anyone can remember, Piedmonts character has been completely bound up with the Westvaco paper mill: its\n     prosperous past and doubtful future. At first glance, the town is a typical dying mill center. Many once beautiful buildings stand\n     empty, evidencing a bygone time of spirit and pride. The big houses on East Hampshire Street are no longer proud, as they were\n     when I was a kid.\nE) Like the Italians and the Irish, most of the colored people migrated to Piedmont at the turn of the 20th century to work at the paper\n    mill, which opened in 1888. All the colored men at the paper mill worked on “the platform” —loading paper into trucks until the\n    craft unions were finally integrated in 1968. Loading is what Daddy did every working day of his life. That’s what almost every\n    colored grown-up I knew did.\nF) Colored people lived in three neighborhoods that were clearly separated. Welcome to the Colored Zone, a large stretched banner\n    could have said. And it felt good in there, like walking around your house in bare feet and underwear, or snoring (打鼾) right out\n    loud on the couch in front of the TV—enveloped by the comforts of home, the warmth of those you love.\nG) Of course, the colored world was not so much a neighborhood as a condition of existence. And though our own world was\n\n                                                                    4\n\n                                          2014 年 12 月年大学英语四级考试真题（一）\n\n     seemingly self-contained, it impacted on the white world of Piedmont in almost every direction. Certainly, the borders of our\n     world seemed to be impacted on when some white man or woman showed up where he or she did not belong, such as at the black\n     Legion Hall. Our space was violated when one of them showed up at a dance or a party. The rhythms would be off. The music\n     would sound not quite right. Everybody would leave early.\nH) Before 1955, most white people were just shadowy presences in our world, vague figures of power like remote bosses at the mill\n     or clerks at the bank. There were exceptions, of course, the white people who would come into our world in routine, everyday\n     ways we all understood. Mr. Mail Man, Mr. Insurance Man, Mr. White-and-Chocolate Milk Man, Mr. Landlord Man, Mr. Police\n     Man ：we called white people by their trade, like characters in a mystery play. Mr. Insurance Man would come by every other\n     week to collect payments on college or death policies, sometimes 50 cents or less.\nI)   “It’s no disgrace to be colored, ” the black entertainer Bert Williams famously observed early in the century, “but it is awfully\n     inconvenient.” For most of my childhood, we couldn’t eat in restaurants or sleep in hotels, we couldn’t use certain bathrooms or\n     try on clothes in stores. Mama insisted that we dress up when we went to shop. She was carefully dressed when she went to\n     clothing stores, and wore white pads called shields under her arms so her dress or blouse would show no sweat. “We’d like to try\n     this on,” she’d say carefully, uttering her words precisely and properly. “We don’t buy clothes we can’t try on, she’d say when\n     they declined, and we^ walk out in Mama’s dignified (有尊严的）manner. She preferred to shop where we h ad an account and\n     where everyone knew who she was.\nJ)   At the Cut-Rate Drug Store, no one colored was allowed to sit down at the counter or tables, with one exception： my father. I\n     don5t know for certain why Carl Dadisman, the owner, wouldn’t stop Daddy from sitting down. But I believe it was in part\n     because Daddy was so light-colored, and in part because, during his shift at the phone company, he picked up orders for food and\n     coffee for the operators. Colored people were supposed to stand at the counter, get their food to go, and leave. Even when Young\n     Doc Bess would set up the basketball team with free Cokes after one of many victories, the colored players had to stand around\n     and drink out of paper cups while the white players and cheerleaders sat down in comfortable chairs and drank out of glasses.\nK) I couldn’t have been much older than five or six as I sat with my father at the Cut-Rate one afternoon, enjoying ice cream. Mr.\n     Wilson, a stony-faced Irishman, walked by. “Hello, Mr. Wilson, ”my father said. “Hello, George.”\nL) I was genuinely puzzled. Mr. Wilson must have confused my father with somebody else, but who? There weren’t any Georges\n     among the colored people in Piedmont. ‘‘Why don’t you tell him your name, Daddy?” I asked loudly. “Your name isn’t George.”\n     “He knows my name, boy，” my father said after a long pause. “He calls all colored people George. ”\nM) I knew we wouldn’t talk about it again; even at that age, I was given to understand that there were some subjects it didn’t do to\n     worry to death about. Now that I have children, I realize that what distressed my father wasn’t so much the Mr. Wilsons of the\n     world as the painful obligation to explain the racial facts of life to someone who hadn’t quite learned them yet. Maybe Mr. Wilson\n     couldn’t hurt my father by calling him George; but I hurt him by asking to know why.\n46. The author felt as a boy that his life in a separated neighborhood was casual and cozy.\n47. There is every sign of decline at the paper mill now.\n48. One reason the author’s father could sit and eat at the drug store was that he didn’t look that dark.\n49. Piedmont was a town of immigrants from different parts of the world.\n50. In spite of the awful inconveniences caused by racial prejudice, the author’s family managed to live a life of dignity.\n51. The author later realized he had caused great distress to his father by asking why he was wrongly addressed.\n52. The author took pride in being from Piedmont because of its natural beauty.\n53. Colored people called white people by the business they did.\n54. Colored people who lived in Piedmont did heavy manual jobs at the paper mill.\n55. The colored people felt uneasy at the presence of the whites in their neighborhoods.\nSection C\nDirections： There are 2 passages in this section. Each passage is followed by some questions or unfinished statements. For each of\n\n                                                                  5\n\n                                           2014 年 12 月年大学英语四级考试真题（一）\n\nthem there are four choices marked A) 9 B), C) and D). You should decide on the best choice and mark the corresponding letter on\nAnswer Sheet 2 with a single line through the centre.\nPassage One\nQuestions 56 to 60 are based on the following passage.\n     Children are a delight. They are our future. But sadly, hiring someone to take care of them while you go to work is getting more\nexpensive by the year.\n     Earlier this month，it was reported that the cost of enrolling an infant or small kid at a childcare center rose 3% in 2012, faster than\nthe overall cost of living. There are now large strips of the country where daycare for an infant costs more than a tenth of the average\nmarried coupled income.\n     This is not necessarily a new trend, but it is a somewhat puzzling one. The price of professional childcare has been rising since the\n1980s. Yet during that time, pay for professional childcare workers has stood still. Actually caregivers make less today, in real terms,\nthan they did in 1990. Considering that labor costs are responsible for up to 80% of a daycare centers expenses, one would expect flat\nwages to have meant flat prices.\n     So who^ to blame for higher childcare costs?\n     Childcare is a carefully regulated industry. States lay down rules about how many children each employee is allowed to watch\nover, the space care centers need per child, and other minute details. And the stricter the regulations, the higher the costs. If it has to\nhire a caregiver for every two children, it can^ really achieve any economies of scale on labor to save money when other expenses go\nup. In Massachusetts, where childcare centers must hire one teacher for every three infants, the price of care averaged more than $\n16,000 per year. In Mississippi, where centers must hire one teacher for every five infants, the price of care averaged less than $ 5,000.\n     Unfortunately, I don^ have all the daycare-center regulations handy. But I wouldn’t be surprised if as the rules have become more\nelaborate, prices have risen. The tradeoff (交换) might be worth it in some cases; after all，the health and safety of children should\nprobably come before cheap service. But certainly, it doesn’t seem to be an accident that some of the cheapest daycare available is in\nthe least regulated South.\n\n   56. What problem do parents of small kids have to face?\n     A) The ever-rising childcare prices.                           C)   The balance between work and family.\n     B) The budgeting of family expenses.                          D)    The selection of a good daycare center.\n  57. What does the author feel puzzled about?\n     A) Why the prices of childcare vary greatly from state to state.\n     B) Why increased childcare prices have not led to better service.\n     C) Why childcare workers pay has not increased with the rising childcare costs.\n                                   ,\n\n     D) Why there is a severe shortage of childcare professionals in a number of states.\n  58.What prevents childcare centers from saving money?\n     A) Steady increase in labor costs.                             C)   Lack of support from the state.\n     B) Strict government regulations.                             D)    High administrative expenses.\n  59. Why is the average cost of childcare in Mississippi much lower than in Massachusetts?\n     A) The overall quality of service is not as good.\n     B) Payments for caregivers there are not as high.\n     C) Living expenses there are comparatively low.\n     D) Each teacher is allowed to care for more kids.\n  60. What is the authors view on daycare service?\n     A) Caregivers should receive regular professional training.\n     B) Less elaborate rules about childcare might lower costs.\n\n                                                                    6\n\n                                           2014 年 12 月年大学英语四级考试真题（一）\n\n     C) It is crucial to strike a balance between quality and costs.\n     D) It is better for different states to learn from each other.\nPassage Two\nQuestions 61 to 65 are based on the following passage.\n     Alex Pang’s amusing new book The Distraction Addiction addresses those of us who feel panic without a cellphone or computer.\nAnd that, he claims, is pretty much all of us. When we’re not online, where we spend four months annually, we’re engaged in the\nstressful work of trying to get online.\n     The Distraction Addiction is not framed as a self-help book. It’s a thoughtful examination of the dangers of our computing\noverdose and a historical overview of how technological advances change consciousness. A “professional futurist”, Pang urges an\napproach which he calls “contemplative (沉思的）computing. ” He asks that you pay full attention to “ how your mind and body\ninteract with computers and how your attention and creativity are influenced by technology.”\n     Pang’s first job is to free you from the common misconception that doing two things at once allows you to get more done. What\nis commonly called multitasking is, in fact, switch-tasking, and its harmful effects on productivity are well documented. Pang doesn’t\nadvocate returning to a pre-Internet world. Instead, he asks you to “take a more ecological(生态的)view of your relationships with\ntechnologies and look for ways devices or media may be making specific tasks easier or faster but at the same time making your work\nand life harder.\n     The Distraction Addiction is particularly fascinating on how technologies have changed certain fields of labor—often for the\nworse. For architects, computer-aided design has become essential but in some ways has cheapened the design process. As one\narchitect puts it, “Architecture is first and foremost about thinking... and drawing is a more productive way of thinking” than\ncomputer-aided design. Somewhat less amusing are Pang’s solutions for kicking the Internet habit. He recommends the usual\nbehavior-modification approaches, familiar to anyone who has completed a quit-smoking program. Keep logs to study your online\nprofile and decide what you can knock out, download a program like Freedom that locks you out of your browser, or take a “digital\nSabbath（安息日）”. “Unless you’re a reporter or emergency-department doctor, you^ discover that your world doesn’t fall apart when\nyou go offline.\n\n      61. Alex Pang’s new book is aimed for readers who_____________ .\n           A) find their work online too stressful\n           B) go online mainly for entertainment\n           C) are fearful about using the cellphone or computer\n           AD) can hardly tear themselves away from the Internet\n      62.What does Alex Pang try to do in his new book?\n           A) Offer advice on how to use the Internet effectively.\n           B) Warn people of the possible dangers of Internet use.\n           C) Predict the trend of future technological development.\n           D) Examine the influence of technology on the human mind.\n      63.What is the common view on multitasking?\n           A) It enables people to work more efficiently.\n           B) It is in a way quite similar to switch-tasking.\n           C) It makes people’s work and life even harder.\n           D) It distracts people’s attention from useful work.\n      64.What does the author think of computer-aided design?\n           A) It considerably cuts down the cost of building design.\n           B) It somewhat restrains architects’ productive thinking.\n           C) It is indispensable in architects’ work process.\n\n                                                                     7\n\n                                           2014 年 12 月年大学英语四级考试真题（一）\n\n           D) It can free architects from laborious drawing.\n      65.What is Alex Pang’s recommendation for Internet users?\n           A) They use the Internet as little as possible.\n           B) They keep a record of their computer use time.\n           C) They exercise self-control over their time online.\n           D) They entertain themselves online on off-days only.\n\nPart IV                                               Translation                                        (30 minutes)\nDirections ： For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You should write your answer\n              on Answer Sheet 2.\n     越来越多的中国年轻人正对旅游产生兴趣，这是近年来的新趋势。年轻游客数量的不断增加，可以归 因于他们迅速提\n高的收入和探索外部世界的好奇心。随着旅行多了，年轻人在大城市和著名景点花的时间少了，他们反而更为偏远的地方\n所吸引。有些人甚至选择长途背包旅行。最近调查显示，很多年轻人想要通过旅行体验不同的文化、丰富知识、拓宽视野。\n\n                                                                   8\n"}, "2014-12-02": {"title": "2014年12月四级真题(第2套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2014-12/02", "text": "                                  2014 年 12 月大学英语四级考试真题(二)答案与详解\n\n                         2014 年 12 月大学英语四级考试真题（第 2 套)\nPart I                                                        Writing                                       (30 minutes)\nDirections ： For this part, you are allowed 30 minutes to write a short essay about a course that has impressed you most in\n                 college. You should state the reasons and write at least 120 words but no more than 180 words.\n\nPart II                    Listening Comprehension                                                (30 minutes)\nSection A\nDirections： In this section, you will hear 8 short conversations and 2 long conversations. At the end of each conversation, one\n                   or more questions will be asked about what was said. Both the conversation and the questions will be spoken only\n                   once. After each question there will be a pause. During the pause, you must read the four choices marked A), B),\n                   C) and D), and decide which is the best answer. Then mark the corresponding letter on Answer Sheet 1 with a\n                   single line through the centre.\n1.    A) The man is not good at balancing his budget.\n      B)    She will go purchase the gift herself.\n      C)    The gift should not be too expensive.\n      D)    They are going to Jane^ house-warming party.\n2.    A) He is quite willing to give the woman a hand.\n      B)    It takes patience to go through the statistics.\n      C)    He has prepared the statistics for the woman.\n      D) The woman should take a course in statistics.\n3.    A) Page 55 is missing from the woman’s scripts.\n      B) They cannot begin their recording right away.\n      C)    The woman does not take the recording seriously.\n      D) The man wants to make some changes in the scripts.\n4.    A) The date of Carl’s wedding.                                C) A significant event in July.\n      B) The birthday of Carl’s bride.                              D) Preparations for a wedding.\n5.    A) The woman forgot to tell the man in advance.\n      B) The man was absent from the weekly meeting.\n      C)    The woman was annoyed at the man’s excuse.\n      D) The man was in charge of scheduling meetings.\n6.    A) The woman is a marvelous cook.                C) The man has to leave in half an hour.\n      B) The woman has just bought an oven.            D) The man cannot wait for his meal.\n7.    A) How she can best help the man.                C) What items sell well in the store.\n      B) Where the man got the bad news.                D) Whether the man can keep his job.\n8. A) The woman can sign up for a swimming class.\n      B) He works in the physical education department.\n      C) The woman has the potential to swim like a fish.\n      D) He would like to teach the woman how to swim.\nQuestions 9 to 11 are based on the conversation you have just heard.\n9. A) He teaches in a law school.                               C) He is a diplomat.\n      B）He loves classical music.                               D) He is a wonderful lecturer.\n10.    A) Went to see a play.                                   C) Took some photos.\n\n                                                                    1\n\n                                 2014 年 12 月大学英语四级考试真题(二)答案与详解\n\n       B) Watched a soccer game.                                  D) Attended a dance.\n11. A) She decided to get married in three years.\n    B) Her mother objected to Eric’s flying lessons.\n    C)     She insisted that Eric pursue graduate studies.\n    D) Her father said she could marry Eric right away.\nQuestions 12 to 15 are based on the conversation you have just heard.\n12. A) Editor.                                            C) Journalist.\n    B) Teacher.                                           D) Typist.\n13. A) The beautiful Amazon rainforests.                   C) Big changes in the Amazon valley.\n    B) A new railway under construction.                     D) In a local evening paper.\n14. A) In news weeklies.                                     C) In a local evening paper.\n                       5\n    B) In newspapers Sunday editions.                        D) In overseas editions of U. S. magazines.\n15. A) To be employed by a newspaper.                        C) To sell her articles to a news service.\n     B) To become a professional writer.                     D) To get her life story published soon.\nSection B\nDirections ： In this section, you will hear 3 short passages. At the end of each passage, you will hear some questions. Both the\n                  passage and the questions will be spoken only once. After you hear a question, you must choose the best answer\n                  from the four choices marked A), B),C)and D). Then mark the corresponding letter on Answer Sheet 1 with a\n                  single line through the centre.\nPassage One\nQuestions 16 to 18 are based on the passage you have just heard.\n16. A) Nodding one’s head.                                       C) Holding up the forefinger.\n      B) Waving one’s hand.                                      D) Turning the right thumb down.\n17. A) Looking away from them.                                    C) Bowing one’s head to them.\n      B) Forming a circle with fingers.                           D) Waving or pointing to them.\n18. A) Looking one’s superior in the eye.\n      B) Keeping one’s arms folded while talking.\n      C) Showing the sole of one’s foot to a guest.\n      D) Using a lot of gestures during a conversation.\n\nPassage Two\nQuestions 19 to 21 are based on the passage you have just heard.\n19. A) They had to beg for food after the harvest.                       C) They shared a small flat with their relatives.\n      B)    They grew wheat and com on a small farm.                     D)    The children walked to school on dirt roads.\n20. A) Tour Ecuador’s Andes Mountains.                                   C) Purchase a plot to build a home on.\n      B)    Earn an annual income of $2,800.                             D)    Send their children to school.\n21. A) The achievements of the Trickle Up Program.\n      B)    A new worldwide economic revolution.\n      C)    Different forms of assistance to the needy.\n      D) The life of poor people in developing countries.\nPassage Three\nQuestions 22 to 25 are based on the passage you have just heard.\n22. A) They are highly sensitive to cold.                            C) They are a living part of our body.\n    B) They are vitally important to our life.                       D)       They are a chief source of our pain.\n23. A) It has to be removed in time by a dentist.                    C) It contains many nerves and blood vessels.\n\n                                                                     2\n\n                                2014 年 12 月大学英语四级考试真题(二)答案与详解\n\n     B) It is a rare oral disease among old people.                D)    It is a sticky and colorless film on the teeth.\n24. A) It can change into acids causing damage to their outer covering.\n    B) It greatly reduces their resistance to the attacks of bacteria.\n    C) It makes their nerves and blood vessels more sensitive to acid food.\n    D) It combines with food particles to form a film on their surface.\n25. A) Food particles.                                            C) Unhealthy living habits.\n     B) Gum disease.                                              D) Chemical erosion.\n\nSection C\nDirections ： In this section, you will hear a passage three times. When the passage is read for the first time, you should listen\n               carefully for its general idea. When the passage is read for the second time, you are required to fill in the blanks with\n               the exact words you have just heard. Finally, when the passage is read for the third time, you should check what you\n               have written.\n     Stunt people (替身演员) are not movie stars, but they are the hidden heroes of many movies. They were around long before\nfilms. Even Shakespeare may have used them in fight scenes. To be good, a fight scene has to look real. Punches must 26\nenemies’ jaws. Sword fights must be fought with 27 swords. Several actors are usually in a fight scene. Their moves must be set\nup so that no one gets hurt. It is almost like planning a dance performance.\n     If a movie scene is dangerous, stunt people usually 28       the stars. You may think you see Tom Cruise running along the top\nof a train. But it is 29 his stunt double. Stunt people must 30 the stars they stand in for. Their height and build should be about\nthe same. But when close-ups are needed, the film 31 the star.\n     Some stunt people 32 in certain kinds of scenes. For instance, a stunt woman named Jan Davis does all kinds of jumps. She\nhas leapt from planes and even off the top of a waterfall. Each jump required careful planning and expert 33 .\n     Yakima Canutt was a famous cowboy stunt man. Among other stunts, he could jump from a second story window onto a\nhorse’s back. He 34 the famous trick of sliding under a moving stagecoach. Canutt also 35 a new way to make a punch look\nreal. He was the only stunt man ever to get an Oscar.\n\nPartⅢ                                          Reading Comprehension                                          (40 minutes)\nSection A\nDirections ： In this section, there is a passage with ten blanks. You are required to select one word for each blank from a list of\n               choices given in a word bank following the passage. Read the passage through carefully before making your choices.\n               Each choice in the bank is identified by a letter. Please mark the corresponding letter for each item on Answer Sheet\n               2 with a single line through the centre. You may not use any of the words in the bank more than once.\nQuestions 36 to 45 are based on the following passage.\n     As an Alaskan fisherman, Timothy June, 54, used to think that he was safe from industrial pollutants(污染物）at his home\nin Haines—a town with a population of 2,400 people and 4,000 eagles, with 8 million acres of protected wild land nearby. But in\nearly 2007, June agreed to take part in a 36 of 35 Americans from seven states. It was a biomonitoring project, in which people’s\nblood and urine (尿) were tested for 37 of chemicals—in this case, three potentially dangerous classes of compounds found in\ncommon household 38 like face cream, tin cans, and shower curtains. The results—             39 in November in a report called “Is It\nin Us?” by an environmental group—were rather worrying. Every one of the participants, 40 from an Illinois state senator to a\nMassachusetts minister, tested positive for all three classes of pollutants. And while the 41 presence of these chemicals does not\n42 indicate a health risk, the fact that typical Americans carry these chemicals at all 43 June and his fellow participants.\n      Clearly, there are chemicals in our bodies that don’t 44 there. A large, ongoing study conducted by the Centers for Disease\nControl and Prevention has found 148 chemicals in Americans of all ages. And in 2005, the Environmental Working Group found\nan   45     of 200 chemicals in the blood of 10 new-borns. “Our babies are being born pre-polluted,” says Sharyle Patton of\nCommonweal, which cosponsored “Is It in Us?” “This is going to be the next big environmental issue after climate change. ”\n\n                                                                  3\n\n                                 2014 年 12 月大学英语四级考试真题(二)答案与详解\n\n                        A) analyses                                                                  I) products\n                         B) average                                                                   J) ranging\n                         C) belong                                                                   K) released\n                      D) demonstrated                                                                L) shocked\n                         E) excess                                                                   M) simple\n                        F) extending                                                                  N) survey\n                       G) habitually\n                                                                                                      O) traces\n                       H) necessarily\n\nSection B\nDirections：In this section, you are-going to read a passage with ten statements attached to it. Each statement contains information\n               given in one of the paragraphs. Identify the paragraph from which the information is derived. You may choose a\n               paragraph more than once. Each paragraph is marked with a letter. Answer the questions by marking the\n               corresponding letter on Answer Sheet 2.\n                                   In Hard Economy for All Ages, Older Isn’t Better…It’s Brutal\nA) Young graduates are in debt, out of work and on their parents’ couches. People in their 30s and 40s can’t afford to buy homes\n     or have children. Retirees are earning near-zero interest on their savings.\nB) In the current listless (缺乏活力的）economy, every generation has a claim to having been most injured. But the Labor\n     Departments latest jobs reports and other recent data present a strong case for crowning baby boomers (二战后生育高峰期\n     出生的人）as the greatest victims of the recession and its dreadful consequences.\nC) These Americans in their 50s and early 60s—those near retirement age who do not yet have access to Medicare and Social\n     Security—have lost the most earnings power of any age group, with their household incomes 10 percent below what they\n     made when the recovery began three years ago, according to Sentier Research, a data analysis company. Their retirement\n     savings and home values fell sharply at the worst possible time: just before they needed to cash out. They are supporting both\n     aged parents and unemployed young-adult children, earning them the unlucky nickname “ Generation Squeeze. ’’\nD) New research suggests that they may die sooner, because their health, income security and mental well-being were ( 重 创 )\n     by recession at a crucial time in their lives. A recent study by economists at Wellesley College found that people who lost their\n     jobs in the few years before becoming qualified for Social Security lost up to three years from their life expectancy (预期寿\n     命),largely because they no longer had access to affordable health care.\nE) Unemployment rates for Americans nearing retirement are far lower than those for young people, who are recently out of\n     school, with fewer skills and a shorter work history. But once out of a job, older workers have a much harder time finding\n     another one. Over the last year, the average duration of unemployment for older people was 53 weeks, compared with 19\n     weeks for teenagers, according to the Labor Department’s jobs report released on Friday.\nF) The lengthy process is partly because older workers are more likely to have been laid off from industries that are downsizing,\n     like manufacturing. Compared with the rest of the population, older people are also more likely to own their own homes and\n     be less mobile than renters, who can move to new job markets.\nG) Older workers are more likely to have a disability of some sort, perhaps limiting the range of jobs that offer realistic choices.\n     They may also be less inclined, at least initially, to take jobs that pay far less than their old positions.\nH) Displaced boomers also believe they are victims of age discrimination, because employers can easily find a young, energetic\n     worker who will accept lower pay and who can potentially stick around for decades rather than a few years.\nI)   In a survey of older workers who were laid off during the recession, just one in six had found another job, and half of that\n\n                                                                    4\n\n                                   2014 年 12 月大学英语四级考试真题(二)答案与详解\n\n     group had accepted pay cuts. 14% of the re-employed said the pay in their new job was less than half what they earned in their\n     previous job. “I just say to myself：‘ Why me? What have I done to deserve this?’ ’’ said John Agati，56，whose last full-time\n     job, as a product developer, ended four years ago when his employer went out of business. That position paid $90,000, and his\n     resume lists jobs at companies like American Express, Disney and USA Networks. Since being laid off, though, he has\n     worked a series of part-time, low-wage, temporary positions, including selling shoes at Lord & Taylor and making sales calls\n     for a car company.\nJ)   The last few years have taken a toll not only on his family’s finances, but also on his feelings of self- worth. “You just get\n     sad,” Mr. Agati said. “I see people getting up in the morning, going out to their careers and going home. I just wish I was doing\n     that. Some people don’t like their jobs, or they have problems with their jobs, but at least they’re working. I just wish I was in\n     their shoes.” He said he cannot afford to go back to school, as many younger people without jobs have done. Even if he could\n     afford it, economists say it is unclear whether older workers like him benefit much from more education.\nK) “It just doesn’t make sense to offer retraining for people 55 and older,” said Daniel Hamermesh, an economics professor.\n     “\n         Discrimination by age, long-term unemployment, and the fact that they’ve now at the end of the hiring queue just don’t make\n     it sensible to invest in them.”\nL) Many displaced older workers are taking this message to heart and leaving the labor force entirely. The share of older people\n     applying for Social Security early rose quickly during the recession as people sought whatever income they could find. The\n     penalty they will pay is permanent, as retirees who take benefits at age 62 will receive as much as 30% less in each months\n     check for the rest of their lives than they would if they had waited until full retirement age (66 for those born after 1942).\nM) Those not yet qualified for Social Security are increasingly applying for another, comparable kind of income support that\n     often goes to people who expect never to work again： disability benefits. More than one in eight people in their late 50 s is\n     now on some form of federal disability insurance program, according to Professor Mark Duggan at the University of\n     Pennsylvania’s Wharton School.\nN) The very oldest Americans, of course, were battered by some of the same ill winds that tormented (折磨）those now nearing\n         retirement, but at least the most senior were cushioned by a more readily available social safety net. More important, in a\n         statistical twist, they may have actually benefited from the financial crisis in the most fundamental way: longer lives.\nO) Death rates for people over 65 have historically fallen during recessions, according to a November 2011 study by economists\n         at the University of California, Davis. Why? The researchers argue that weak job markets push more workers into accepting\n         relatively undesirable work at nursing homes, leading to better care for residents.\n\n46. Greater mobility puts younger people at an advantage in seeking new jobs.\n47. Many of the older workers laid off during the recession had to accept lower pay in their new jobs.\n48. Those who lose their jobs shortly before retirement age live a shorter-than-average life.\n49. Seniors at nursing homes could benefit from the weak job market.\n50. Age discrimination in employment makes it pointless retraining older workers.\n51. According to recent reports and data analyses, boomers suffer most from the weak economy.\n52. Unemployed boomers are at a disadvantage in job-hunting because employers tend to hire younger workers.\n53. People in their fifties and early sixties bear the heaviest family burdens.\n54. People who take benefits from Social Security before official retirement age will get much less for the rest of their lives.\n55. Older workers choice of jobs can be limited because of disability.\n                       5\n\nSection C\nDirections： There are 2 passages in this section. Each passage is followed by some questions or unfinished statements. For each\n                  of them there are four choices marked A), B ) , C) and D). You should decide on the best choice and mark the\n                  corresponding letter on Answer Sheet 2 with a single line through the centre.\n\nPassage One\n\n                                                                    5\n\n                                 2014 年 12 月大学英语四级考试真题(二)答案与详解\n\nQuestions 56 to 60 are based on the following passage.\n     New Yorkers are gradually getting used to more pedaling (骑车的) passengers on those shining blue Citi Bikes. But what\nabout local bike shops? Is Citi Bike rolling up riders at their expense?\n     At Gotham Bikes in Tribeca, manager W. Ben said the shop has seen an increase in its overall sales due to the bike-share\nprogram. “ It’s getting more people on the road,’’ he said. James Ryan, an employee at Danny’s Cycles in Gramercy also said Citi\nBike is a good option for people to ease into biking in a city famed for its traffic jams and aggressive drivers. “They can try out a\nbike without committing to buying one,” he said.\n     Rentals are not a big part of the business at either Gotham Bikes or Danny’s Cycles. But for Frank’s Bike Shop, a small\nbusiness on Grand St. , the bike-share program has been bad news. Owner Frank Arroyo said his rental business has decreased by\n90% since Citi Bike was rolled out last month. Arroyo’s main rental customers are European tourists, who have since been drawn\naway by Citi Bikes.\n     However, Ben said the bike-share is good for bike sales at his shop. People have used the bike- share and realized how great\nit is to bike in the city, then decide that they want something nicer for themselves,’’ he noted.\n     Christian Farrell of Waterfront Bicycle Shop, on West St. just north of Christopher St. , said initially he was concerned about\nbike-share, though, he admitted, “ I was happy to see people on bikes.”\n     Farrell’s early concerns were echoed by Andrew Crooks, owner of NYC Velo, at 64 Second Ave. “It seemed like a great idea,\nbut one that would be difficult to implement,” Crooks said of Citi Bike. He said he worried about inexperienced riders’ lack of\nawareness of biking rules and strong negative reaction from non-cyclists. However, he said, ifs still too early to tell if his business\nhas been impacted.\n     While it’s possible bike-share will cause a drop in business, Crooks allowed that the idea is a positive step forward for New\nYork City.\n56 What is the author’s chief concern about the increasing use of Citi Bikes in New York?\n     A) How non-cyclists will respond to it.\n     B) Whether local bike shops will suffer.\n     C) Whether local bike businesses will oppose it.\n     D) How the safety of bike riders can be ensured.\n57 What happened to Gotham Bikes as a result of the bike-share program?\n      A) It found its bike sales unaffected.                      C) It saw its bike sales on the rise.\n      B) It shifted its business to rentals.                      D) It rented more bikes to tourists.\n58.Why is the bike-share program bad news for Franks Bike Shop?\n     A) It cannot meet the demand of the bike-share program.\n     B) Its customers have been drawn away by Citi Bikes.\n     C) Its bike prices have to be lowered again and again.\n     D) It has to compete with the city’s bike rental shops.\n59.Why did Andrew Crooks think that the bike-share program would be difficult to execute?\n     A) Inexperienced riders might break biking rules.\n     B) Conflicts might arise among bike rental shops.\n     C) Traffic conditions might worsen in the downtown area.\n     D) There are not enough lanes to accommodate the bikes.\n60. What is the general attitude of local bike shops towards Citi Bike?\n     A) Wait-and-see.                B) Negative.                 C) Indifferent.                   D) Approving.\n\nPassage Two\nQuestions 61 to 65 are based on the following passage.\n     Various studies have shown that increased spending on education has not led to measurable improvements in learning.\n\n                                                                  6\n\n                                2014 年 12 月大学英语四级考试真题(二)答案与详解\n\nBetween 1980 and 2008, staff and teachers at US public schools grew roughly twice as fast as students. Yet students showed no\nadditional learning in achievement tests.\n     Universities show similar trends of increased administration personnel and costs without greater learning, as documented in\nRichard Arum and Josipa Roksa’s recent book Academically Adrift： Limited Learning on College Campuses.\n     A survey shows that 63% of employers say that recent college graduates don’t have the skills they need to succeed and 25%\nof employers say that entry-level writing skills are lacking.\n     Some simplistically attribute the decline in our public education system to the drain of skilled students by private schools, but\nfar more significant events were at work.\n     Public schools worked well until about the 1970s. In fact, until that time, public schools provided far better education than\nprivate ones. It was the underperforming students who were thrown out of public schools and went to private ones.\n     A prominent reason public schools did well was that many highly qualified women had few options for working outside the\nhouse other than being teachers or nurses. They accepted relatively low pay, difficult working conditions, and gave their very best.\n     Having such a large supply of talented women teachers meant that society could pay less for their services. Womens\nliberation opened up new professional opportunities for women, and, over time, some of the best left teaching as a career option,\nbringing about a gradual decline in the quality of schooling.\n     Also around that time, regulations, government, and unions came to dictate pay, prevent adjustments, and introduce\nbureaucratic (官僚的）standard for advancement. Large education bureaucracies and unions came to dominate the landscape,\nconfusing activity with achievement. Bureaucrats regularly rewrite curriculums, talk nonsense about theories of education, and\nrequire ever more administrators. The end result has been that, after all the spending, students have worse math and reading skills\nthan both their foreign peers
