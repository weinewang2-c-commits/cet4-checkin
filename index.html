<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四级备考 · 每日打卡</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 54C18 44 8 35 8 24a12 12 0 0 1 24-5 12 12 0 0 1 24 5c0 11-10 20-24 30z' fill='%23FF8FAB'/%3E%3Ccircle cx='22' cy='22' r='4' fill='%23FFC7A8'/%3E%3Ccircle cx='42' cy='22' r='4' fill='%23FFC7A8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="preconnect" href="https://sf3-scmcdn-cn.feishucdn.com" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+QingKe+HuangYou&amp;display=swap">
<style>
:root{
  --bg:#FFF6F0; --card:#FFFFFF; --ink:#5B4A5E; --ink-soft:#8A7690;
  --pink:#FF8FAB; --pink-deep:#F26B8A; --pink-soft:#FFE1E9;
  --lav:#C3B1E1; --lav-soft:#EDE6F8; --peach:#FFC7A8; --peach-soft:#FFEDE2;
  --mint:#8ED6A4; --mint-soft:#DFF3E6; --sun:#FFD98E; --sun-soft:#FFF4D6;
  --radius:24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.65;
  min-height:100vh;
}
.fun{font-family:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.5px}
/* ===== 重置打卡（低调小工具） ===== */
.reset-zone{margin:26px auto 0;max-width:340px;display:flex;gap:10px;justify-content:center}
.reset-zone button{flex:1;font-size:12px;color:var(--ink-soft);background:transparent;border:1px dashed #E4C9D4;border-radius:999px;padding:7px 10px;cursor:pointer;transition:background .2s}
.reset-zone button:active{background:var(--pink-soft)}

/* ===== 日期选择 ===== */
.date-switch{font-size:12px;color:#A07700;background:var(--sun-soft);border:1.5px dashed #EACB7E;border-radius:999px;padding:3px 12px;cursor:pointer;vertical-align:middle}
.date-switch:active{background:var(--sun)}
.p-note{font-size:13px;color:var(--ink-soft);text-align:center;margin:8px 0 14px}
.picker-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:520px){.picker-list{grid-template-columns:repeat(4,1fr)}}
.p-item{position:relative;background:var(--card);border:2px solid #F3DFE7;border-radius:16px;padding:10px 6px;text-align:center;cursor:pointer;transition:transform .12s,border-color .3s}
.p-item:active{transform:scale(.96)}
.p-item b{display:block;font-size:16px;color:var(--pink-deep)}
.p-item span{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.p-item.on{border-color:var(--pink);background:var(--pink-soft)}
.p-item .p-today{position:absolute;top:-8px;right:8px;font-size:10px;background:var(--sun);color:#7A5A00;border-radius:999px;padding:1px 8px;font-style:normal}

/* ===== 通用视图容器 ===== */
.view{display:none;min-height:100vh;position:relative}
.view.active{display:block}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px;position:relative;z-index:1}
/* ===== 装饰层 ===== */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco svg{position:absolute}
/* ===== 欢迎页 ===== */
#view-welcome{
  align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(160deg,#FFF0F4 0%,#FDEBFF 45%,#FFF4D6 100%);
  cursor:pointer;
}
#view-welcome.active{display:flex}
#view-welcome .w-inner{padding:30px;position:relative;z-index:2;animation:popIn .5s ease-out}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
#view-welcome .hello{font-size:44px;color:var(--pink-deep);line-height:1.3}
#view-welcome .hello-emo{display:block;font-size:40px;margin-bottom:10px}
#view-welcome .hello-sub{font-size:17px;color:var(--ink-soft);margin-top:14px}
#view-welcome .tap-hint{position:absolute;bottom:-70px;left:50%;transform:translateX(-50%);font-size:13px;color:#B99AA6;white-space:nowrap;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
#view-welcome .w-bear{position:absolute;bottom:8%;left:8%;width:56px;opacity:.9}
#view-welcome .w-star{position:absolute;top:12%;right:12%;width:38px}
#view-welcome .w-cloud{position:absolute;top:16%;left:8%;width:52px;opacity:.8}
/* ===== 顶部栏 ===== */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.topbar .back{flex:0 0 auto;width:42px;height:42px;border-radius:14px;border:none;background:var(--pink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--pink-deep);font-size:20px;font-weight:700}
.topbar h1{font-size:22px;color:var(--pink-deep);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== Hero ===== */
.hero{text-align:center;padding:10px 6px 8px}
.hero .date-line{font-size:13.5px;color:var(--ink-soft);background:var(--sun-soft);border:1.5px dashed #F2C879;border-radius:999px;display:inline-block;padding:3px 14px;margin-bottom:10px}
.hero h2{font-size:32px;line-height:1.25;color:var(--pink-deep)}
.hero .sub{font-size:14px;color:var(--ink-soft);margin-top:4px}
.phase-badge{display:inline-block;margin-top:10px;font-size:13px;padding:4px 14px;border-radius:999px;color:#fff}
.phase-基础{background:var(--mint)}
.phase-强化{background:var(--lav)}
.phase-冲刺{background:var(--peach);color:#7A4A2A}
/* 今日总进度 */
.day-progress{margin:14px auto 0;max-width:320px;background:var(--lav-soft);border-radius:999px;height:14px;overflow:hidden}
.day-progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sun),var(--pink));transition:width .5s ease;width:0}
.day-progress-tip{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
/* ===== 任务卡片（home） ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 8px 24px rgba(242,107,138,.13);padding:18px;margin-top:16px;position:relative;border:2px solid transparent;cursor:pointer;transition:transform .12s,border-color .3s}
.card:active{transform:scale(.98)}
.card.done{border-color:var(--mint)}
.card .ribbon{position:absolute;top:-12px;left:16px;font-size:12.5px;padding:3px 12px;border-radius:999px;color:#fff}
.card.t1 .ribbon{background:var(--pink)}
.card.t2 .ribbon{background:var(--lav)}
.card h3{font-size:20px;display:flex;align-items:center;gap:7px;color:var(--ink)}
.card .time{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.card .task-text{font-size:14.5px;margin-top:9px;color:#6B5A70;background:var(--peach-soft);border-radius:13px;padding:9px 13px}
.card .go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pink),var(--pink-deep));border-radius:999px;padding:8px 18px;box-shadow:0 5px 14px rgba(242,107,138,.3)}
.card.t2 .go{background:linear-gradient(135deg,var(--lav),#A08AC9);box-shadow:0 5px 14px rgba(163,133,201,.3)}
.card .done-tag{position:absolute;top:16px;right:16px;font-size:12px;color:var(--mint);font-weight:700}
/* ===== 单词页 ===== */
#view-words .w-top{display:flex;align-items:center;gap:12px;margin:14px 2px 6px}
#view-words .w-top .pnum{font-size:14px;font-weight:700;color:var(--pink-deep);white-space:nowrap}
#view-words .w-bar{flex:1;height:13px;background:var(--lav-soft);border-radius:999px;overflow:hidden}
#view-words .w-bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--sun),var(--pink));transition:width .4s}
.w-card{
  margin-top:14px;background:var(--card);border-radius:var(--radius);box-shadow:0 10px 28px rgba(242,107,138,.15);
  padding:38px 22px;text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2.5px solid var(--pink-soft);
}
.w-card .w-word{font-size:38px;font-weight:800;color:#3E3348;word-break:break-word}
.w-card .w-ph{font-size:16px;color:#A995B0;margin-top:6px}
.w-card .w-sep{width:56px;height:3.5px;border-radius:3px;background:linear-gradient(90deg,var(--pink),var(--sun));margin:16px auto}
.w-card .w-mean{font-size:17px;color:#6B5A70;line-height:1.7}
.w-card .w-idx{position:absolute;top:14px;left:16px;font-size:12.5px;color:#D9A6B8;font-weight:700}
.w-actions{display:flex;gap:12px;margin-top:16px}
.w-actions button{flex:1;min-height:52px;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .12s}
.w-actions button:active{transform:scale(.96)}
.w-known{background:var(--mint-soft);color:#2E8B57}
.w-next{background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;box-shadow:0 6px 16px rgba(242,107,138,.3)}
.w-done-zone{text-align:center;margin-top:16px}
.w-done-zone button{background:linear-gradient(135deg,var(--sun),var(--peach));color:#7A4A2A;border:none;border-radius:16px;font-size:16px;font-weight:700;padding:13px 30px;cursor:pointer;box-shadow:0 6px 16px rgba(245,164,118,.3)}
/* ===== 真题页 ===== */
#view-zhenti .z-meta{font-size:12.5px;color:var(--ink-soft);margin:4px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.part-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.part-tabs::-webkit-scrollbar{display:none}
.part-tabs button{flex:0 0 auto;border:none;background:var(--lav-soft);color:#7B66A3;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;transition:all .2s}
.part-tabs button.on{background:var(--lav);color:#fff}
.z-content{
  margin-top:10px;background:var(--card);border-radius:18px;box-shadow:0 6px 18px rgba(242,107,138,.1);
  padding:18px;white-space:pre-wrap;word-break:break-word;font-size:14px;color:#4A3D52;line-height:1.75;
  max-height:58vh;overflow-y:auto;
}
.z-nav{display:flex;gap:10px;margin-top:12px}
.z-nav button{flex:1;min-height:46px;border:none;border-radius:14px;font-size:14.5px;font-weight:700;cursor:pointer;background:var(--pink-soft);color:var(--pink-deep)}
.z-nav button:disabled{opacity:.4;cursor:default}
.z-nav button.z-finish{background:linear-gradient(135deg,var(--mint),#6FBF8B);color:#fff;box-shadow:0 5px 14px rgba(142,214,164,.4)}
/* ===== 鼓励弹窗 ===== */
.cheer-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(91,74,94,.35);cursor:pointer}
.cheer-modal.show{display:flex}
.cheer-modal .box{background:#fff;border-radius:26px;padding:30px 34px;text-align:center;max-width:320px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.18);animation:popIn .35s ease-out}
.cheer-modal .box svg{margin:0 auto 6px;display:block}
.cheer-modal .txt{font-size:20px;color:var(--pink-deep);margin-top:8px}
.cheer-modal .sub{font-size:13.5px;color:var(--ink-soft);margin-top:6px}
/* ===== 底部 ===== */
.next-tip{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:18px;line-height:1.8}
.next-tip b{color:var(--pink-deep)}
footer{text-align:center;font-size:12px;color:#C3ACB8;margin-top:26px}
/* 庆祝 */
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.celebrate span{position:absolute;bottom:-40px;animation:floatUp 2.4s ease-out forwards;font-size:22px}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(-110vh) rotate(320deg);opacity:0}}
#fxCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:98}
@media (prefers-reduced-motion:reduce){.celebrate span,#fxCanvas{display:none}}
/* 12/11 全部完成鼓励卡 */
.praise-card{margin-top:18px;background:linear-gradient(180deg,#FFFDF2,#FFF8E1);border:2px solid #F3CF7E;border-radius:var(--radius);padding:20px 18px;text-align:center}
.praise-card .p-ribbon{display:inline-block;font-size:13px;color:#8A6200;background:var(--sun);border-radius:999px;padding:3px 14px;margin-bottom:12px}
.praise-card .p-title{font-size:19px;color:#B45309;margin-bottom:10px}
.praise-card p{font-size:14px;color:var(--ink);line-height:1.85;text-align:left}
.praise-card .p-end{display:block;text-align:center;color:var(--pink-deep);font-weight:700;margin-top:12px;font-size:15px}
@media (min-width:768px){
  .wrap{padding:28px 20px 70px}
  #view-welcome .hello{font-size:54px}
  .w-card{padding:48px 30px}
  .z-content{max-height:64vh}
}
</style>
</head>
<body>
<!-- 背景装饰 -->
<div class="deco" aria-hidden="true">
  <svg style="top:6%;left:4%;width:32px" viewBox="0 0 32 32" fill="#FFD98E"><path d="M16 2l3.6 10.4L30 16l-10.4 3.6L16 30l-3.6-10.4L2 16l10.4-3.6z"/></svg>
  <svg style="top:12%;right:5%;width:24px" viewBox="0 0 32 32" fill="#FF8FAB"><path d="M16 28C9 22 4 16 4 10a6.5 6.5 0 0 1 12-2 6.5 6.5 0 0 1 12 2c0 6-5 12-12 18z"/></svg>
  <svg style="top:24%;left:9%;width:42px;opacity:.85" viewBox="0 0 64 36" fill="#fff"><path d="M20 34a12 12 0 0 1 1-24A16 16 0 0 1 48 12a9 9 0 0 1 1 22H20z"/></svg>
  <svg style="top:32%;right:7%;width:22px" viewBox="0 0 32 32" fill="#C3B1E1"><path d="M16 28C9 22 4 16 4 10a6.5 6.5 0 0 1 12-2 6.5 6.5 0 0 1 12 2c0 6-5 12-12 18z"/></svg>
  <svg style="top:48%;left:2%;width:26px" viewBox="0 0 32 32" fill="#FFD98E"><circle cx="16" cy="16" r="3"/><path d="M16 2v6M16 24v6M2 16h6M24 16h6M6.3 6.3l4.2 4.2M21.5 21.5l4.2 4.2M25.7 6.3l-4.2 4.2M10.5 21.5l-4.2 4.2" stroke="#FFD98E" stroke-width="3" stroke-linecap="round"/></svg>
  <svg style="bottom:20%;left:5%;width:38px;opacity:.9" viewBox="0 0 64 36" fill="#fff"><path d="M20 34a12 12 0 0 1 1-24A16 16 0 0 1 48 12a9 9 0 0 1 1 22H20z"/></svg>
  <svg style="bottom:9%;right:3%;width:24px" viewBox="0 0 32 32" fill="#8ED6A4"><path d="M16 28C9 22 4 16 4 10a6.5 6.5 0 0 1 12-2 6.5 6.5 0 0 1 12 2c0 6-5 12-12 18z"/></svg>
  <svg style="bottom:32%;right:12%;width:36px" viewBox="0 0 48 32"><path d="M4 28a20 20 0 0 1 40 0" stroke="#FF8FAB" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M10 28a14 14 0 0 1 28 0" stroke="#FFD98E" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M16 28a8 8 0 0 1 16 0" stroke="#8ED6A4" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
</div>

<!-- ===== 视图1：欢迎页 ===== -->
<div class="view" id="view-welcome" onclick="goHome()">
  <svg class="w-cloud" viewBox="0 0 64 36" fill="#fff" opacity=".85"><path d="M20 34a12 12 0 0 1 1-24A16 16 0 0 1 48 12a9 9 0 0 1 1 22H20z"/></svg>
  <svg class="w-star" viewBox="0 0 32 32" fill="#FFD98E"><path d="M16 2l3.6 10.4L30 16l-10.4 3.6L16 30l-3.6-10.4L2 16l10.4-3.6z"/></svg>
  <svg class="w-bear" viewBox="0 0 64 60">
    <circle cx="16" cy="14" r="12" fill="#E8C79A"/><circle cx="48" cy="14" r="12" fill="#E8C79A"/>
    <circle cx="13" cy="11" r="4.5" fill="#F6E3C8"/><circle cx="51" cy="11" r="4.5" fill="#F6E3C8"/>
    <circle cx="32" cy="32" r="22" fill="#E8C79A"/>
    <circle cx="24" cy="30" r="3" fill="#5B4A5E"/><circle cx="40" cy="30" r="3" fill="#5B4A5E"/>
    <circle cx="20" cy="36" r="5" fill="#FFA8B8"/><circle cx="44" cy="36" r="5" fill="#FFA8B8"/>
    <path d="M28 40q4 4 8 0" stroke="#5B4A5E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="w-inner">
    <span class="hello-emo" id="helloEmo"></span>
    <div class="hello fun" id="helloText"></div>
    <div class="hello-sub" id="helloSub"></div>
    <div class="tap-hint">点击任意位置开始 &#10084;</div>
  </div>
</div>

<!-- ===== 视图2：今日主页 ===== -->
<div class="view" id="view-home">
  <div class="wrap">
    <header class="hero">
      <span class="date-line" id="dateLine"></span>
      <h2 class="fun" id="heroTitle"></h2>
      <div class="sub" id="heroSub"></div>
      <div><span class="phase-badge" id="phaseBadge"></span> <button class="date-switch" onclick="show('view-picker');renderPicker()">切换日期</button></div>
      <div class="day-progress"><i id="dayBar"></i></div>
      <div class="day-progress-tip" id="dayTip"></div>
    </header>
    <main id="main"></main>
    <div class="next-tip" id="nextTip"></div>
    <div class="reset-zone" id="resetZone">
      <button onclick="resetToday()" id="btnResetToday">清除今日打卡</button>
      <button onclick="resetAll()" id="btnResetAll">重置全部记录</button>
    </div>
    <footer>给最可爱的你 · 四级必过 425+</footer>
  </div>
</div>

<!-- ===== 视图：日期选择 ===== -->
<div class="view" id="view-picker">
  <div class="wrap">
    <div class="topbar">
      <button class="back" onclick="goHome()">&#8592;</button>
      <h1 class="fun">选择日期</h1>
      <button class="back" style="flex:0 0 auto;width:auto;padding:0 14px;font-size:13px;background:var(--sun-soft);color:#A07700" onclick="jumpToday()">回到今天</button>
    </div>
    <div class="p-note">点击任意一天，即可查看那天的任务</div>
    <div class="picker-list" id="pickerList"></div>
  </div>
</div>

<!-- ===== 视图3：背单词 ===== -->
<div class="view" id="view-words">
  <div class="wrap">
    <div class="topbar">
      <button class="back" onclick="goHome()">&#8592;</button>
      <h1 class="fun" id="wTitle">今日单词</h1>
    </div>
    <div class="w-top">
      <span class="pnum" id="wCount">0 / 50</span>
      <div class="w-bar"><i id="wBar"></i></div>
    </div>
    <div id="wBody"></div>
    <div class="w-done-zone" id="wDoneZone" style="display:none">
      <button onclick="finishWords()" id="wFinishBtn">全部背完，打卡！</button>
    </div>
  </div>
</div>

<!-- ===== 视图4：真题 ===== -->
<div class="view" id="view-zhenti">
  <div class="wrap">
    <div class="topbar">
      <button class="back" onclick="goHome()">&#8592;</button>
      <h1 class="fun">真题练习</h1>
    </div>
    <div class="z-meta" id="zMeta"></div>
    <div class="part-tabs" id="partTabs"></div>
    <div class="z-content" id="zContent"></div>
    <div class="z-nav">
      <button id="zPrev" onclick="zPrev()">&#8592; 上一部分</button>
      <button id="zNext" onclick="zNext()">下一部分 &#8594;</button>
    </div>
    <div style="text-align:center;margin-top:12px">
      <button class="z-finish" style="border:none;border-radius:14px;font-size:15px;font-weight:700;padding:12px 34px;cursor:pointer;background:linear-gradient(135deg,var(--mint),#6FBF8B);color:#fff;box-shadow:0 5px 14px rgba(142,214,164,.4)" onclick="finishZhenti()">做完啦，打卡！</button>
    </div>
  </div>
</div>

<!-- 鼓励弹窗 -->
<div class="cheer-modal" id="cheerModal" onclick="this.classList.remove('show')">
  <div class="box">
    <div id="cheerSvg"></div>
    <div class="txt fun" id="cheerTxt"></div>
    <div class="sub" id="cheerSub"></div>
  </div>
</div>
<div class="celebrate" id="celebrate" aria-hidden="true"></div>

Sheet 1 with a single line through the centre.\n1. A)      See a doctor about her strained shoulder.                C) Replace the cupboard with a new one.\n     B） Use a ladder to help her reach the tea.                     D)     Place the tea on a lower shelf next time.\n2. A)      At Mary Johnson’s.                                       C) In an exhibition hall.\n     B)     At a painter’s studio.                                 D) Outside an art gallery.\n3. A)       The teacher evaluated lacks teaching experience.\n     B)     She does not quite agree with what the man said.\n     C)     The man had better talk with the students himself.\n     D)     New students usually cannot offer a fair evaluation.\n4. A)      He helped Doris build up the furniture.                  C) Doris fixed up some of the bookshelves.\n     B)     Doris helped him arrange the furniture.                 D)     He was good at assembling bookshelves.\n5. A)       He doesn’t get on with the others.                      C) He has been taken for a fool.\n     B)    He doesn’t feel at ease in the firm.                     D)     He has found a better position.\n6. A)      They should finish the work as soon as possible.\n     B)    He will continue to work in the garden himself.\n     C)     He is tired of doing gardening on weekends.\n     D)     They can hire a gardener to do the work.\n7. A)     The man has to get rid of the used furniture.\n     B)     The man’s apartment is ready for rent.\n     C)     furniture is covered with lots of dust.\n     D)     The furniture the man bought is inexpensive.\n8. A)      The man will give the mechanic a call.                   C) The woman is doing some repairs.\n     B)   The woman is waiting for a call.                             D) The man knows the mechanic very well.\n\nQuestions 9 to 11 are based on the conversation you have just heard.\n9.    A) She had a job interview to attend.                        C) She had to attend an important meeting.\n      B) She was busy finishing her project.                       D) She was in the middle of writing an essay.\n\n                                                                   1\n\n                                           2014 年 6 月大学英语四级考试真题（一）\n\n10. A) Accompany her roommate to the classroom.         C) Submit her roommate’s assignment.\n     B) Hand in her roommate’s application form.       D) Help her roommate with her report.\n11. A) Where Dr. Ellis’s office is located.                C) Directions to the classroom building.\n     B) When Dr. Ellis leaves his office.                  D) Dr. Ellis’s schedule for the afternoon.\nQuestions 12 to 15 are based on the conversation you have just heard.\n12. A) He finds it rather stressful.                   C) He can handle it quite well.\n    B) He is thinking of quitting it.                  D) He has to work extra hours.\n13. A) The 6:00 one.                                   C) The 7:00 one.\n     B) The 6:30 one.                                   D) The 7:30 one.\n14. A) It is an awful waste of time.                   C) The time on the train is enjoyable.\n      B) He finds it rather unbearable.                 D) It is something difficult to get used to.\n15. A) Reading newspapers.                              C) Listening to the daily news.\n     B) Chatting with friends.                          D) Planning the day’s work.\nSection B\n\nDirections ： In this section, you will hear 3 short passages. At the end of each passage, you will hear some questions. Both the\n              passage and the questions will be spoken only once. After you hear a question, you must choose the best answer\n              from the four choices marked A), B), C)and D). Then mark the corresponding letter on Answer Sheet 1 with a\n              single line through the centre.\nPassage One\nQuestions 16 to 18 are based on the passage you have just heard.\n16. A) Ignore small details while reading.\n      B)   Read at least several chapters at one sitting.\n      C)   Develop a habit of reading critically.\n      D)   Get key information by reading just once or twice.\n17.   A) Choose one’s own system of marking.                C) Make as few marks as possible.\n      B) Underline the key words and phrases.               D) Highlight details in a red color.\n18. A) By reading the textbooks carefully again.             C) By focusing on the notes in the margins.\n    B) By reviewing only the marked parts.                 D) By comparing notes with their classmates.\nPassage Two\nQuestions 19 to 21 are based on the passage you have just heard.\n19. A) The sleep a person needs varies from day to day.\n    B) The amount of sleep for each person is similar.\n    C) One can get by with a couple of hours of sleep.\n    D) Everybody needs some sleep for survival.\n20. A) It is a made-up story.                               C) It is a rare exception.\n    B) It is beyond cure.                                    D) It is due to an accident.\n21. A) His extraordinary physical condition.                C) The unique surroundings of his living place.\n     B) His mother’s injury just before his birth.            D) The rest he got from sitting in a rocking chair.\nPassage Three\nQuestions 22 to 25 are based on the passage you have just heard.\n22. A) She invested in stocks and shares on Wall Street.\n    B) She learned to write for financial newspapers.\n    C) She developed a strong interest in finance.\n    D) She tenderly looked after her sick mother.\n\n                                                                2\n\n                                         2014 年 6 月大学英语四级考试真题（一）\n\n23. A) She made a wise investment in real estate.\n      B)She sold her restaurant with a substantial profit.\n      C)She got 7. 5 million dollars from her ex-husband.\n      D)She inherited a big fortune from her father.\n24. A) She was extremely mean with her money.\n      B)She was dishonest in business dealings.\n      C)She frequently ill-treated her employees.\n      D)She abused animals including her pet dog.\n25. A) She made a big fortune from wise investment.\n      B)She built a hospital with her mother’s money.\n      C)She made huge donations to charities.\n      D)She carried on her family’s tradition.\n\nSection C\nDirections ： In this section, you will hear a passage three times. When the passage is read for the first time, you should listen\n               carefully for its general idea. When the passage is read for the second time, you arerequired to fill in the blanks\n               with the exact words you have just heard. Finally, whenthe passage is read for the third time, you should check\n               what you have written.\n      Among the kinds of social gestures most significant for second-language teachers are those which are 26 in form but\ndifferent in meaning in the two cultures. For example, a Colombian who wants someone to 27 him often signals with a hand\nmovement in which all the fingers of one hand, cupped, point downward as they move rapidly 28 . Speakers of English have a\nsimilar gesture though the hand may not be cupped and the fingers may be held more loosely, but for them the gesture means\ngoodbye or go away, quite the 29 of the Colombian gesture. Again, in Colombia, a speaker of English would have to know that\nwhen he 30 height he must choose between different gestures depending on whether he is 31 a human being or an animal. If\nhe keeps the palm of the hand 32 the floor, as he would in his own culture when making known the height of a child, for\nexample, he will very likely be greeted by laughter; in Colombia this gesture is 33 for the description of animals. In order to\ndescribe human beings he should keep the palm of his hand 34 to the floor. Substitutions of one gesture for the other often\ncreate not only humorous but also 35 moments. In both of the examples above, speakers from two different cultures have the\nsame gesture, physically, but its meaning differs sharply.\nPartⅢ                                       Reading Comprehension                                             (40 minutes)\nSection A\nDirections ： In this section, there is a passage with ten blanks. You are required to select one word for each blank from a list of\n            choices given in a word bank following the passage. Read the passage through carefully before making your\n            choices. Each choice in the bank is identified by a letter. Please mark the corresponding letter for each item on\n            Answer Sheet 2 with a single line through the centre. You may not use any of the words in the bank more than\n            once.\nQuestions 36 to 45 are based on the following passage.\n    Many Brazilians cannot read. In 2000, a quarter of those aged 15 and older were functionally illiterate (文 盲 ） .Many 36\ndo not want to. Only one literate adult in three reads books. The 37 Brazilian reads 1. 8 non-academic books a year, less than\n  half the figure in Europe and the United States. In a recent survey of reading habits, Brazilians came 27th out of 30 countries.\nArgentines, their neighbors, 38 18th.\n      The government and businesses are all struggling in different ways to change this. On March 13 the government 39 a\nNational Plan for Books and Reading. This seeks to boost reading, by founding libraries and financing publishers among other\nthings.\n      One discouragement to reading is that books are 40 . Most books have small print-runs, pushing up their price.\n      But Brazilians5 indifference to books has deeper roots. Centuries of slavery meant the country’s leaders long             41\neducation. Primary schooling became universal only in the 1990s.\n      All this means Brazil’s book market has the biggest growth 42 in the western world.\n\n                                                                3\n\n                                          2014 年 6 月大学英语四级考试真题（一）\n\n      But reading is a difficult habit to form. Brazilians bought fewer books in 2004, 89 million, including textbooks 43 by the\ngovernment, than they did in 1991. Last year the director of Brazil’s national library 44 . He complained that he had half the\nlibrarians he needed and termites (白蚁） had eaten much of the 45 . That ought to be a cause for national shame.\n\n A) average                                                     I) normal\n B) collection                                                  J) particularly\n C) distributed                                                 K) potential\n D) exhibition                                                  L) quit\n E) expensive                                                   M) ranked\n F) launched                                                    N) simply\n G) named                                                       O) treasured\n H) neglected\n\nSection B\nDirections ： In this section, you are going to read a passage with ten statements attached to it. Each statement contains\n                 information given in one of the paragraphs. Identify the paragraph from which the information is derived. You\n                 may choose a paragraph more than once. Each paragraph is marked with a letter. Answer the questions by marking\n                 the corresponding letter on Answer Sheet 2.\n                                                  The Touch-Screen Generation\nA) On a chilly day last spring, a few dozen developers of children’s apps(应用程序）for phones and tablets(平板电脑)\n    gathered at an old beach resort in Monterey, California, to show off their games. The gathering was organized by Warren\n    Buckleitner, a longtime reviewer of interactive children’s media. Buckleitner spent the breaks testing whether his own\n    remote-control helicopter could reach the hairs second story, while various children who had come with their parents looked\n    up in awe(敬畏）and delight. But mostly they looked down, at the iPads and other tablets displayed around the hall like so\n    many open boxes of candy. I walked around and talked with developers, and several quoted a famous saying of Maria\n    Montessori’s, “ The hands are the instruments of man’s intelligence.’’\nB) What, really, would Maria Montessori have made of this scene? The 30 or so children here were not down at the shore\n    poking (戳) their fingers in the sand or running them along stones or picking seashells. Instead they were all inside, alone or\n    in groups of two or three, their faces a few inches from a screen, their hands doing things Montessori surely did not imagine.\nC) In 2011, the American Academy of Pediatrics updated its policy on very young children and media. In 1999, the group had\n    discouraged television viewing for children younger than 2, citing research on brain development that showed this age\n    groups critical need for “direct interactions with parents and other significant care givers.” The updated report began by\n    acknowledging that things had changed significantly since then. In 2006, 90% of parents said that their children younger\n    than 2 consumed some form of electronic media. Nevertheless, the group took largely the same approach it did in 1999,\n    uniformly discouraging passive media use, on any type of screen, for these kids. (For older children, the academy noted,\n    “high-quality programs” could have “educational benefits.” ） The 2011 report mentioned “smart cell phone” and “new\n    screen” technologies, but did not address interactive apps. Nor did it bring up the possibility that has likely occurred to those\n     90% of American parents that some good might come from those little swiping（在电子产品上刷） fingers.\nD) I had come to the developers, conference partly because I hoped that this particular set of parents, enthusiastic as they were\n     about interactive media, might help me out of this problem, that they might offer some guiding principle for American\n     parents who are clearly never going to meet the academy’s ideals, and at some level do not want to. Perhaps this group\n     would be able to express clearly some benefits of the new technology that the more cautious doctors weren’t ready to\n     address.\nE) I fell into conversation with a woman who had helped develop Montessori Letter Sounds, an app that teaches preschoolers the\n     Montessori methods of spelling. She was a former Montessori teacher and a mother of four. I myself have three children\n     who are all fans of the touch screen. What games did her kids like to play, I asked, hoping for suggestions I could take home.\n     “ They don’t play all that much. ”\n\n                                                                 4\n\n                                         2014 年 6 月大学英语四级考试真题（一）\n\n     Really? Why not?\n    “Because I don’t allow it. We have a rule of no screen time during the week, unless it’s clearly educational. ’’\n    No screen time? None at all? That seems at the outer edge of restrictive, even by the standards of overcontrolling parents.\n    “On the weekends, they can play. I give them a limit of half an hour and then stop. Enough.”\nF) Her answer so surprised me that I decided to ask some of the other developers who were also parents what their domestic\n    ground rules for screen time were. One said only on airplanes and long car rides. Another said Wednesdays. and weekends,\n    for half an hour. The most permissive said half an hour a day, which was about my rule at home. At one point I sat with one\n    of the biggest developers of e-book apps for kids, and his family. The small kid was starting to fuss in her high chair, so the\n    mom stuck an iPad in front of her and played a short movie so everyone else could enjoy their lunch. When she saw me\n    watching, she gave me the universal tense look of mothers who feel they are being judged. “ At home,” she assured me, “ I\n    only let her watch movies in Spanish. ’”\nG) By their reactions, these parents made me understand the problem of our age: as technology becomes almost everywhere in\n    our lives, American parents are becoming more, not less, distrustful of what it might be doing to their children.\n    Technological ability has not, for parents, translated into comfort and ease. On the one hand, parents want their children to\n    swim expertly in the digital stream that they will have to navigate (航行) all their lives; on the other hand, they fear that too\n    much digital media, too early, will sink them. Parents end up treating tablets as precision surgical (外科的）instruments,\n    devices that might perform miracles for their child’s IQ and help him win some great robotics competition——but only if\n    they are used just so. Otherwise, their child could end up one of those sad, pale creatures who can^ make eye contact and has\n    a girlfriend who lives only in the virtual world.\nH) Norman Rockwell, a 20th-century artist, never painted Boy Swiping Finger on Screen, and our own vision of a perfect\n    childhood has never been adjusted to accommodate that now-common scene. Add to that our modem fear that every\n    parenting decision may have lasting consequences—that every minute of enrichment lost or mindless entertainment\n    indulged（放纵的）will add up to some permanent handicap (障碍)in the future—and you have deep guilt and confusion.\n    To date, no body of research has proved that the iPad will make your preschooler smarter or teach her to speak Chinese, or\n    alternatively that it will rust her nervous system—the device has been out for only three years, not much more than the time\n    it takes some academics to find funding and gather research subjects. So what is a parent to do?\n46. The author attended the conference, hoping to find some guiding principles for parenting in the electronic age.\n47. American parents are becoming more doubtful about the benefits technology is said to bring to their children.\n48. Some experts believe that human intelligence develops by the use of hands.\n49. The author found a former Montessori teacher exercising strict control over her kids, screen time.\n50. Research shows interaction with people is key to babies, brain development.\n51. So far there has been no scientific proof of the educational benefits of iPads.\n52. American parents worry that overuse of tablets will create problems with their kids, interpersonal relationships.\n53. The author expected developers of children’s apps to specify the benefits of the new technology.\n54. The kids at the gathering were more fascinated by the iPads than by the helicopter.\n55. The author permits her children to use the screen for at most half an hour a day.\n\nSection C\nDirections： There are 2 passages in this section. Each passage is followed by some questions or unfinished statements. For each\n         of them there are four choices marked A), B),, C) and D). You should decide on the best choice and mark the\n        corresponding letter on Answer Sheet 2 with a single line through the centre.\nPassage One\nQuestions 56 to 60 are based on the following passage.\n      When young women were found to make only 82 percent of what their male peers do just one year out of college, many\nwere at a loss to explain it.\n      All the traditional reasons put forward to interpret the pay gap—that women fall behind when they leave the workforce to\nraise kids, for example, or that they don’t seek as many management roles— failed to justify this one. These young women didn’t\nhave kids yet. And because they were just one year removed from their undergraduate degrees, few of these women yet had the\n\n                                                                5\n\n                                           2014 年 6 月大学英语四级考试真题（一）\n\nchance to go after (much less decline) leadership roles.\n     But there are other reasons why the pay gap remains so persistent. The first is that no matter how many women may be\ngetting college degrees, the university experience is still an unequal one. The second is that our higher education system is not\ndesigned to focus on the economic consequences of our students, years on campus.\n     Now that women are the majority of college students and surpass men in both the number of undergraduate and advanced\ndegrees awarded, one might think the college campus is a pretty equal place. It is not. Studies show that while girls do better than\nboys in high school, they start to trail off during their college years. They enroll in different kinds of classes, tend to major in less\nrigorous (非常严格的)subjects, and generally head off with less ambitious plants.\n\n     As a result, it’s not surprising that even the best educated young women enter the workplace with a slight disadvantage.\nTheir college experience leaves them somewhat confused, still stumbling ( 栽 倒 ) over the dilemmas their grandmothers,\ngeneration sought to destroy. Are they supposed to be pretty or smart? Strong or sexy(性感的)？ All their lives, today’s young\nwomen have been pushed to embrace both perfection and passion—to pursue science and sports, math and theater—and do it all\nas well as they possibly can. No wonder they are not negotiating for higher salaries as soon as they get out of school. They are too\nexhausted, and too scared of failing.\n56. Traditionally, it is believed that women earn less than men because______________________.\n      A)    they have failed to take as many rigorous courses\n      B)    they do not feel as fit for management roles\n      C)    they feel obliged to take care of their kids at home\n      D)    they do not exhibit the needed leadership qualities\n57. What does the author say about America’s higher education system?\n      A)    It does not offer specific career counseling to women.\n      B)    It does not consider its economic impact on graduates.\n      C)    It does not take care of women students’ special needs.\n      D)    It does not encourage women to take rigorous subjects.\n58. What does the author say about today’s college experience?\n      A)    It is different for male and female students.\n      B)    It is not the same as that of earlier generations.\n      C)    It is more exhausting than most women expect.\n      D)    It is not so satisfying to many American students.\n59. What does the author say about women students in college?\n      A)    They have no idea how to bring out their best.\n      B)    They drop a course when they find it too rigorous.\n      C)    They are not as practical as men in choosing courses.\n      D)    They don5t perform as well as they did in high school.\n60. How does the author explain the pay gap between men and women fresh from college?\n      A)    Women are too worn out to be ambitious.\n      B)    Women are not ready to take management roles.\n      C)    Women are caught between career and family.\n      D)    Women are not good at negotiating salaries.\nPassage Two\nQuestions 61 to 65 are based on the following passage.\n     Reading leadership literature, you’d sometimes think that everyone has the potential to be an effective leader.\n     I don’t believe that to be true. In fact, I see way fewer truly effective leaders than I see people stuck in positions of\n\n                                                                   6\n\n                                           2014 年 6 月大学英语四级考试真题（一）\n\nleadership who are sadly incompetent and seriously misguided about their own abilities.\n       Part of the reason this happens is a lack of honest self-assessment by those who aspire to（追求） leadership in the first\nplace.\n       We’ve all met the type of individual who simply must take charge. Whether it’s a decision-making session, a basketball\ngame, or a family outing, they can’t help grabbing the lead dog position and clinging on to it for dear life. They believe they’ve\nnatural born leaders.\n       Truth is, they’re nothing of the sort. True leaders don^ assume that ifs their divine (神圣的) right to take charge every time\ntwo or more people get together. Quite the opposite. A great leader will assess each situation on its merits, and will only take\ncharge when their position, the situation, and/or the needs of the moment demand it.\n       Many business executives confuse leadership with action. They believe that constant motion somehow generates\nleadership as a byproduct. Faced with any situation that can’t be solved by the sheer force of activity, they generate a dust cloud\nof impatience. Their one leadership tool is volume: if they think you aren’t working as hard as they think you should, their\ndemands become increasingly louder and harsher.\n       True leaders understand the value of action, of course, but it isn’t their only tool. In fact, it isn’t even their primary tool.\nGreat leaders see more than everyone else answers, solutions, patterns, problems, opportunities. They know it’s vitally important\nto do, but they also know that thinking, understanding, reflection and interpretation are equally important.\n       If you’re too concerned with outcomes to the extent that you manipulate and intimidate others to achieve those outcomes,\nthen you aren’t leading at all, you’re dictating. A true leader is someone who develops his or her team so that they can and do hit\ntheir targets and achieve their goals.\n61. What does the author think of the leaders he knows?\n      A)     Many of them are used to taking charge.\n      B)     Few of them are equal to their positions.\n      C)     Many of them fail to fully develop their potential.\n      D)     Few of them are familiar with leadership literature.\n62. Why are some people eager to grab leadership positions?\n      A)     They believe they have the natural gift to lead.\n      B)     They believe in what leadership literature says.\n      C)     They have proved competent in many situations.\n      D)     They derive great satisfaction from being leaders.\n63. What characterizes a great leader according to the author?\n      A)     Being able to take prompt action when chances present themselves.\n      B)     Having a whole-hearted dedication to their divine responsibilities.\n      C)     Having a full understanding of their own merits and weaknesses.\n      D)     Being able to assess the situation carefully before taking charge.\n64. How will many business executives respond when their command fails to generate action?\n        A) They reassess the situation at hand.                   C) They resort to any tool available.\n        B) They become impatient and rude.                        D) They blame their team members.\n65. What is the author’s advice to leaders?\n      A)     Concentrate on one specific task at a time.\n      B)     Use different tools to achieve different goals.\n      C)     Build up a strong team to achieve their goals.\n      D)     Show determination when faced with tough tasks.\n\nPart IV                                                 Translation                                         (30 minutes)\nDirections ： For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You should write your\n               answer on Answer Sheet 2.\n     中国应进一步发展核能，因为核电目前只占其总发电量的 2%。该比例在所有核国家中居第 30 位，几乎是最低的。\n     2011 年 3 月日本核电站事故后，中国的核能开发停了下来，中止审批新的核电站，并开展全国性的核安全检查。\n\n                                                                  7\n\n                     2014 年 6 月大学英语四级考试真题（一）\n\n到 2012 年 10 月，审批才又谨慎地恢复。\n  随着技术和安全措施的改进，发生核事故的可能性完全可以降到最低程度鈐换句话说，核能是可以安全开发和利\n用的。\n\n                                8\n"}, "2014-06-02": {"title": "2014年6月四级真题(第2套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2014-06/02", "text": "                                                 2014 年 6 月大学英语四级考试真题（二）\n\n                  2014 年 6 月大学英语四级考试真题（第 2 套）\nPart I                                                      Writing  A) Some new problems in her work.                              C)        Her chance for promotion in the bank.\n         B)    Cooperation with an international bank.                  D)        Her intention to leave her present job.\n13.     A) The World Bank.                                                 C)    A US finance corporation.\n         B)    Bank of Washington.                                         D)     An investment bank in New York.\n14.     A) Supervising financial transactions.\n         B)    Taking charge of public relations.\n         C)    Making loans to private companies in developing countries.\n         D)    Offering service to international companies in the United States.\n15.      A) It is a first major step to realizing the woman’s dream.\n         B)    It is an honor for the woman and her present employer.\n         C)    It is a loss for her current company.\n         D)    It is really beyond his expectation.\n\nSection B\nDirections： In this section, you will hear 3 short passages. At the end of each passage, you will hear some questions. Both the passage and the\n                 questions will be spoken only once. After you hear a question, you must choose the best answer from the four choices marked A),\n                 B),C),and D). Then mark the corresponding letter on Answer Sheet 1 with a single line through the centre.\nPassage One\nQuestions 16 to 18 are based on the passage you have just heard.\n16. A) Carry out a thorough checkup.                                       C) Keep extra gas in reserve.\n       B) Try to keep the gas tank full.                                   D) Fill up the water tank.\n17. A) Attempting to leave your car to seek help.                      C) Running the engine every now and then.\n      B) Opening a window a bit to let in fresh air.                   D) Keeping the heater on for a long time.\n18. A) It exhausts you physically.                                           C) It causes you to lose body heat.\n       B) It makes you fall asleep easily.                                      D) It consumes too much oxygen.\nPassage Two\nQuestions 19 to 21 are based on the passage you have just heard.\n19.    A) They are very generous in giving gifts.                       C) They regard gifts as a token of friendship.\n       B) They refuse gifts when doing business.                        D) They give gifts only on special occasions.\n20.    A) They enjoy giving gifts to other people.                      C) They have to follow many specific rules.\n         B) They spend a lot of time choosing gifts.                   D) They pay attention to the quality of gifts.\n21.    A) Gift-giving plays an important role in human relationships.\n         B) We must be aware of cultural differences in giving gifts.\n         C) We must learn how to give gifts before going abroad.\n\n                                                                       2\n\n                                                 2014 年 6 月大学英语四级考试真题（二）\n\n          D) Reading extensively makes one a better gift-giver.\n\nPassage Three\nQuestions 22 to 25 are based on the passage you have just heard.\n22. A) It reflects American peopled view of French politics.\n     B) It is first published in Washington and then in Paris.\n     C) It explains American politics to the French public.\n     D) It is popular among French government officials.\n\n23. A) Work on her column.                                              C) Entertain her guests.\n     B) Do housework at home.                                           D) Go shopping downtown.\n24. A) To report to her newspaper.                                     C) To visit her parents.\n     B) To refresh her French.                                         D) To meet her friends.\n25. A) She might be recalled to France.                                C) She might close her Monday column.\n     B) She might change her profession.                                D) She might be assigned to a new post.\nSection C\nDirections： In this section, you will hear a passage three times. When the passage is read for the first time, you should listen carefully for its general\n                 idea. When the passage is read for the second time, you are required to fill in the blanks with the exact words you have just heard.\n                 Finally, when the passage is read for the third time, you should check what you have written.\n       According to American law, if someone is accused of a crime, he is considered 26 until the court proves the person is\nguilty.\n       To arrest a person, the police have to be reasonably sure that a crime has been 27 . The police must give the suspect the\nreasons why they are arresting him and tell him his rights under the law. Then the police take the suspect to the police station,\nwhere the name of the person and the 28              against him are formally listed.\n       The next step is for the suspect to go before a judge. The judge decides whether the suspect should be kept in jail or 29 .\nIf the suspect has no previous criminal record and the judge feels that he will return to court 30 run away, he can go free.\nOtherwise, the suspect must put up bail (保释金). At this time, too, the judge will 31 a court lawyer to defend the suspect if he\ncan’t afford one.\n       The suspect returns to court a week or two later. A lawyer from the district attorney’s office presents a case against the\nsuspect. The attorney may present          32    as well as witnesses. The judge then decides whether there is enough reason to 33 .\n       The American justice system is very complex and sometimes operates slowly. However, every step is 34 to protect the\nrights of the people. These individual rights are the 35 of the American government.\nPart Ⅲ                                                Reading Comprehension                                                      (40 minutes)\nSection A\nDirections：Inthissection, thereisa passagewithtenblanks.Youarerequiredtoselectonewordforeachblankfromalistofchoicesgivenina word\n                 bankfollowingthepassage.Readthepassagethrough carefullybeforemakingyourchoices.Eachchoiceinthe bankisidentifiedby\n                 a letter. Please mark the corresponding letter for each item on Answer Sheet 2 with a single line through the centre. You may not\n                 use any of the words in the bank more than once.\n\nQuestions 36 to 45 are based on the following passage.\n       Global warming is a trend toward warmer conditions around the world. Part of the warming is natural; we have\nexperienced a 20,000-year-long warming as the last ice age ended and the ice 36 away. However, we have already reached\ntemperatures that are in 37 with other minimum-ice periods, so continued warming is likely not natural. We are 38 to a\npredicted worldwide increase in temperatures 39 between 1℃ and 6 ℃ over the next 100 years. The warming will be more 40\nin some areas, less in others, and some places may even cool off. Likewise, the 41 of this warming will be very different\ndepending on where you are—coastal areas must worry about rising sea levels, while Siberia and northern Canada may become\n\n                                                                           3\n\n                                               2014 年 6 月大学英语四级考试真题（二）\n\nmore habitable (宜居的) and 42 for humans than these areas are now.\n        The fact remains, however, that it will likely get warmer, on 43 , everywhere. Scientists are in general agreement that\nthe warmer conditions we have been experiencing are at least in part the result of a human-induced global warming trend. Some\nscientists 44 that the changes we are seeing fall within the range of random (无规律的）variation—some years are cold, others\nwarm, and we have just had an unremarkable string of warm years 45 —but that is becoming an increasingly rare interpretation\nin the face of continued and increasing warm conditions.\n                        A) appealing                                                                         I) melted\n                         B) average                                                                          J) persist\n                      C) contributing                                                                       K) ranging\n                        D) dramatic                                                                        L) recently\n                        E) frequently                                                                      M) resolved\n                          F) impact                                                                        N) sensible\n                           G) line                                                                           O) shock\n                        H) maintain\n\nSection B\nDirections ： In this section, you are going to read a passage with ten statements attached to it Each statement contains information given in one of\n                the paragraphs. Identify the paragraph from which the information is derived. You may choose a paragraph more than once. Each\n                paragraph is marked with a letter. Answer the questions by marking the corresponding letter on Answer Sheet 2.\n                                                              The End of the Book?\nA) Amazon, by far the largest bookseller in the country, reported on May 19 that it is now selling more books in its electronic\n     Kindle format than in the old paper-and-ink format. That is remarkable, considering that the Kindle has only been around\n     for four years. E-books now account for 14 percent of all book sales in this country and are increasing far faster than overall\n     book sales. E-book sales are up 146 percent over last year, while hardback sales increased 6 percent and paperbacks\n     decreased 8 percent.\nB)   Does this spell the doom of the physical book? Certainly not immediately, and perhaps not at all. What it does mean is that\n     the book business will go through a transformation in the next decade or so more profound than any it has seen since\n     Gutenberg introduced printing from moveable type in the 1450s.\nC) Physical books will surely become much rarer in the marketplace. Mass market paperbacks, which have been declining for\n     years anyway, will probably disappear, as will hardbacks for mysteries, thrillers, “romance fiction,” etc. Such books, which\n     only rarely end up in permanent collections, either private or public, will probably only be available as e-books within a few\n     years. Hardback and trade paperbacks for “serious” nonfiction and fiction will surely last longer. Perhaps it will become the\n     mark of an author to reckon with that he or she is still published in hard copy.\nD) As for children’s books, who knows? Children’s books are like dog food in that the purchasers are not the consumers, so the\n     market (and the marketing) is inherently strange.\nE)   For clues to the book’s future, let’s look at some examples of technological change and see what happened to the old\n     technology.\nF)   One technology replaces another only because the new technology is better, cheaper, or both. The greater the difference, the\n     sooner and more thoroughly the new technology replaces the old. Printing with moveable type on paper dramatically\n     reduced the cost of producing a book compared with the old-fashioned ones handwritten on vellum, which comes from\n     sheepskin. A Bible—to be sure, a long book—required vellum made from 300 sheepskins and countless man-hours of labor.\n     Before printing arrived, a Bible cost more than a middle-class house. There were perhaps 50,000 books in all of Europe in\n     1450. By 1500 there were 10 million.\n\n                                                                        4\n\n                                           2014 年 6 月大学英语四级考试真题（二）\n\nG) But while printing quickly caused the handwritten book to die out, handwriting lingered on (继续存在)well into the 16th\n     century. Very special books are still occasionally produced on vellum, but they are one-of-a-kind show pieces.\nH) Sometimes a new technology doesn’t drive the old one out, but only parts of it while forcing the rest to evolve. The movies\n     were widely predicted to drive live theater out of the marketplace, but they didn’t, because theater turned out to have\n     qualities movies could not reproduce. Equally, TV was supposed to replace movies but, again, did not.\nI)   Movies did, however, fatally impact some parts of live theater. And while TV didn’t kill movies, it did kill second-rate\n     pictures, shorts, and cartoons.\nJ)   Nor did TV kill radio. Comedy and drama shows (“Jack Benny, “Amos and Andy, “The Shadow”) all migrated to television.\n     But because you can’t drive a car and watch television at the same time, rush hour became radio’s prime time, while music,\n     talk, and news radio greatly enlarged their audiences. Radio is today a very different business than in the late 1940s and a\n     much larger one.\nK) Sometimes old technology lingers for centuries because of its symbolic power. Mounted cavalry ( 骑 兵 )replaced the\n     chariot(二轮战车）on the battlefield around 1000 BC. But chariots maintained their place in parades and triumphs right up\n     until the end of the Roman Empire 1,500 years later. The sword hasn’t had a military function for a hundred years, but is still\n     part of an officer’s full- dress uniform, precisely because a sword always symbolized “ an officer and a gentleman.’’\nL)   Sometimes new technology is a little cranky(不稳定的）at first. Television repairman was a common occupation in the\n     1950s, for instance. And so the old technology remains as a backup. Steamships captured the North Atlantic passenger\n     business from sail in the 1840s because of its much greater speed. But steamships didn’t lose their sails until the 1880s,\n     because early marine engines had a nasty habit of breaking down. Until ships became large enough (and engines small\n     enough) to mount two engines side by side, they needed to keep sails. (The high cost of steam and the lesser need for speed\n     kept the majority of the world’s ocean freight moving by sail until the early years of the 20th century.)\nM) Then there is the fireplace. Central heating was present in every upper- and middle-class home by the second half of the\n     19th century. But functioning fireplaces remain to this day a powerful selling point in a house or apartment. I suspect the\n     reason is a deep-rooted love of fire. Fire was one of the earliest major technological advances for humankind, providing heat,\n     protection, and cooked food (which is much easier to eat and digest). Human control of fire goes back far enough (over a\n     million years) that evolution could have produced a genetic leaning towards fire as a central aspect of human life.\nN)   Books—especially books the average person could afford—haven’t been around long enough to produce evolutionary\n     change in humans. But they have a powerful hold on many people nonetheless, a hold extending far beyond their literary\n     content. At their best, they are works of art and there is a tactile (触觉的）pleasure in books necessarily lost in e-book\n     versions. The ability to quickly thumb through pages is also lost. And a room with books in it induces, at least in some, a\n     feeling not dissimilar to that of a fire in the fireplace on a cold winter’s night.\nO) For these reasons I think physical books will have a longer existence as a commercial product than some currently predict.\n     Like swords, books have symbolic power. Like fireplaces, they induce a sense of comfort and warmth. And, perhaps,\n     similar to sails, they make a useful backup for when the lights go out.\n\n46. Authors still published in printed versions will be considered important ones.\n47. Some people are still in favor of printed books because of the sense of touch they can provide.\n48. The radio business has changed greatly and now attracts more listeners.\n49.Contrary to many peopled prediction of its death, the film industry survived.\n50. Remarkable changes have taken place in the book business.\n51. Old technology sometimes continues to exist because of its reliability.\n52. The increase of e-book sales will force the book business to make changes not seen for centuries.\n53. A new technology is unlikely to take the place of an old one without a clear advantage.\n54. Paperbacks of popular literature are more likely to be replaced by e-books.\n55. A house with a fireplace has a stronger appeal to buyers.\n\n                                                                  5\n\n                                                2014 年 6 月大学英语四级考试真题（二）\n\n Section C\n Directions ： There are 2 passages in this section. Each passage is followed by some questions or unfinished statements. For each of them there are\n                   four choices marked A), B), C) and D). You should decide on the best choice and mark the corresponding letter on Answer\n                   Sheet 2 with a single line through the centre.\n Passage One\n Questions 56 to 60 are based on the following passage.\n       The question of whether our government should promote science and technology or the liberal arts in higher education isn’t\n an either/or proposition (命题), although the current emphasis on preparing young Americans for STEM (science, technology,\n engineering, maths)-related fields can make it seem that way.\n       The latest congressional report acknowledges the critical importance of technical training, but also asserts that the study of\n the humanities (人文学科）and social sciences must remain central components of America’s educational system at all levels.\n Both areas are critical to producing citizens who can participate effectively in our democratic society, become innovative(创新\n 的）leaders, and benefit from the spiritual enrichment that the reflection on the great ideas of mankind over time provides.\n       Parents and students who have invested heavily in higher education worry about graduates, job prospects as technological\n advances and changes in domestic and global markets transform professions in ways that reduce wages and cut jobs. Under these\n circumstances, it’s natural to look for what may appear to be the most “practical” way out of the problem: “Major in a subject\n designed to get you a job” seems the obvious answer to some, though this ignores the fact that many disciplines in the humanities\n characterized as “soft” often, in fact, lead to employment and success in the long run. Indeed, according to surveys, employers\n have expressed a preference for students who have received a broadly-based education that has taught them to write well, think\n critically, research creatively, and communicate easily.\n       Moreover, students should be prepared not just for their first job, but for their 4th and 5th jobs, as there’s little reason to\n doubt that people entering the workforce today will be called upon to play many different roles over the course of their careers.\n The ones who will do the best in this new environment will be those whose educations have prepared them to be flexible. The\n ability to draw upon every available tool and insight—picked up from science, arts, and technology—to solve the problems of\n the future, and take advantage of the opportunities that present themselves, will be helpful to them and the United States.\n 56. What does the latest congressional report suggest?\n       A)      STEM-related subjects help students find jobs in the information society.\n       B)      The humanities and STEM subjects should be given equal importance.\n       C)      The liberal arts in higher education help enrich students’ spiritual life.\n       D)      Higher education should be adjusted to the practical needs of society.\n57. What is the main concern of students when they choose a major?\n       A)      Their interest in relevant subjects.                          C)     The quality of education to receive.\n       B)      The academic value of the courses.                            D)     Their chances of getting a good job.\n58. What does the author say about the so-called soft subjects?\n       A)      They benefit students in their future life.\n       B)      They broaden students’ range of interests.\n       C)      They improve students’ communication skills.\n       D)      They are essential to students’ healthy growth.\n59. What kind of job applicants do employers look for?\n       A)      Those who have a strong sense of responsibility.\n       B)      Those who are good at solving practical problems.\n       C)      Those who are likely to become innovative leaders.\n       D)      Those who have received a well-rounded education.\n60. What advice does the author give to college students?\n      A) Seize opportunities to tap their potential.                        C) Prepare themselves for different job options.\n\n                                                                        6\n\n                                         2014 年 6 月大学英语四级考试真题（二）\n\n     B) Try to take a variety of practical courses.                  D) Adopt a flexible approach to solving problems.\n\nPassage Two\nQuestions 61 to 65 are based on the following passage.\n     Energy independence. It has a nice ring to it, doesn’t it? If you think so, you’re not alone, because energy independence has\nbeen the dream of American presidents for decades, and never more so than in the past few years, when the most recent oil price\nshock has been partly responsible for kicking off the great recession.\n     “Energy independence” and its rhetorical(修辞的）companion “energy security” are, however, slippery concepts that are\nrarely thought through. What is it we want independence from, exactly?\n     Most people would probably say that they want to be independent from imported oil. But there are reasons that we buy all\nthat oil from elsewhere.\n     The first reason is that we need it to keep our economy running. Yes, there is a trickle(涓涓细流）of biofuel（生物燃料）\navailable, and more may become available, but most biofuels cause economic waste and environmental destruction.\n     Second, Americans have basically decided that they don’t really want to produce all their own oil. They value the\nenvironmental quality they preserve over their oil imports from abroad. Vast areas of the United States are off-limits to oil\nexploration and production in the name of environmental protection. To what extent are Americans really willing to endure the\nenvironmental impacts of domestic energy production in order to cut back imports?\n     Third, there are benefits to trade. It allows for economic efficiency, and when we buy things from places that have lower\nproduction costs than we do, we benefit. And although you don’t read about this much, the United States is also a large exporter\nof oil products, selling about 2 million barrels of petroleum products per day to about 90 countries.\n     There is no question that the United States imports a great deal of energy and, in fact, relies on that steady flow to maintain\nits economy. When that flow is interrupted, we feel the pain in short supplies and higher prices. At the same time, we derive\nmassive economic benefits when we buy the most affordable energy on the world market and when we engage in energy trade\naround the world.\n61. What does the author say about energy independence for America?\n      A) It sounds very attractive.                                  C) It will bring oil prices down.\n      B) It ensures national security.                               D) It has long been everyone’s dream.\n62. What does the author think of biofuels?\n     A)    They keep America’s economy running healthily.\n     B)    They prove to be a good alternative to petroleum.\n     C)    They do not provide a sustainable energy supply.\n     D)    They cause serious damage to the environment.\n63 Why does America rely heavily on oil imports?\n     A)    It wants to expand its storage of crude oil.\n     B)    Its own oil reserves are quickly running out.\n     C)    It wants to keep its own environment intact.\n     D)    Its own oil production falls short of demand.\n64. What does the author say about oil trade?\n     A) It proves profitable to both sides.                          C) It makes for economic prosperity.\n     B) It improves economic efficiency.                             D) It saves the cost of oil exploration.\n65. What is the author’s purpose in writing the passage?\n     A)    To justify America’s dependence on oil imports.\n     B)    To arouse Americans’ awareness of the energy crisis.\n     C)    To stress the importance of energy conservation.\n     D)    To explain the increase of international oil trade.\n\n                                                                 7\n\n                                            2014 年 6 月大学英语四级考试真题（二）\n\nPart IV                                                Translation                                             (30 minutes)\nDirections： For this part, you are allowed 30 minutes to translate a passagefrom Chineseinto English. You should write your answer onAnswer\n               Sheet 2.\n      中国教育工作者早就认识到读书对于国家的重要意义。有些教育工作者 2003 年就建议设立全民读书日。他们强\n调，人们应当读好书，尤其是经典著作。通过阅读，人们能更好地学会感恩、有责任心和与人合作，而教育的目的正\n是要培养这些基本素质。阅读对于中小学生尤为重要,假如他们没有在这个关键时期培养阅读的兴趣，以后要养成阅\n读的习惯就很难了。\n\n                                                                    8\n"}, "2014-06-03": {"title": "2014年6月四级真题(第3套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2014-06/03", "text": "                                             2014 年 6 月大学英语四级考试真题（三）\n\n2014 年 6 月大学英语四级考试真题（第 3 套）\nPart I                                                    Writing                                                     (30 minutes)\nDirections ： For this part, you are allowed 30 minutes to write a short essay on the following question. You should write at least 120 words but\n                  no more than 180 words.\n       Suppose a foreign Mend of yours is coming to visit China, what is the first place you would like to take him/her to see and\nwhy?\n\nPart II                                            Listening Comprehension                                              (30 minutes)\nSection A\nDirections：Inthissection,youwillhear8shortconversationsand2 longconversations.Attheendofeachconversation, oneormorequestionswill\n                  be askedabout what was said.Both the conversation and thequestions will be spoken only once.After eachquestion there will be\n                  a pause. During the pause, you must read the four choices marked A),B), C) and D), and decide which is the best answer. Then\n                  mark the corresponding letter on Answer Sheet 1 with a single line through the centre.\n1.   A) He has proved to be a better reader than the woman.\n     B) He has difficulty understanding the book.\n     C) He cannot get access to the assigned book.\n     D) He cannot finish his assignment before the deadline.\n2.   A) She will drive the man to the supermarket.\n     B) The man should buy a car of his own.\n     C) The man needn’t go shopping every week.\n     D) She can pick the man up at the grocery store.\n3.   A)     Get more food and drinks.                                     C)   Tidy up the place.\n     B)     Ask his friend to come over.                                  D)    Hold a party.\n4.   A) The talks can be held any day except this Friday.\n     B) He could change his schedule to meet John Smith.\n     C) The first-round talks should start as soon as possible.\n     D) The woman should contact John Smith first.\n5.   A) He understands the woman’s feelings.\n     B)     He has gone through a similar experience.\n     C) The woman should have gone on the field trip.\n     D) The teacher is just following the regulations.\n6.   A)     She will meet the man halfway.                                C) She will ask David to talk less.\n     C)     She is sorry the man will not come.                           D) She has to invite David to the party.\n7.   A) Few students understand Prof. Johnson’s lectures.\n     B)     Few students meet Prof. Johnson’s requirements.\n     C)     Many students find Prof. Johnson’s lectures boring.\n     C)     Many students have dropped Prof. Johnson’s class.\n8.   A)      Check their computer files.                                   C) Study a computer program.\n     B) Make some computations.                                        D) Assemble a computer.\n\nQuestions 9 to 12 are based on the conversation you have just heard.\n9.   A) It allows him to make a lot of friends.                           C) It enables him to apply theory to practice.\n     B) It requires him to work long hours.                             D) It helps him understand people better.\n\n                                                                      1\n\n                                             2014 年 6 月大学英语四级考试真题（三）\n\n10.    A) It is intellectually challenging.\n         B) It requires him to do washing-up all the time.\n         C) It exposes him to oily smoke all day long.\n         D) It demands physical endurance and patience.\n11.    A) In a hospital.                                                   C) At a laundry.\n         B) At a coffee shop.                                              D)   In a hotel.\n12.    A) Getting along well with colleagues.                              C) Planning everything in advance.\n       B)     Paying attention to every detail.                            D)   Knowing the needs of customers.\n\nQuestions 13 to 15 are based on the conversation you have just heard.\n\n13. A) The pocket money British children get.                        C) The things British children spend money on.\n\n      B) The annual inflation rate in Britain.                      D) The rising cost of raising a child in Britain.\n\n14.    A) It enables children to live better.                        C) It often rises higher than inflation.\n\n       B) It goes down during economic recession.                      D) It has gone up 25% in the past decade.\n\n15. A) Save up for their future education.                            C) Buy their own shoes and socks.\n\n      B) Pay for small personal things.                               D) Make donations when necessary.\n\nSection B\nDirections ：Inthissection, youwillhear3 shortpassages, attheendofeachpassage, youwillhearsomequestions.Boththepassageandquestions\n                 will be spoken only once. After you hear a question, you must choose the best answer from the four choices marked A), B), C) and\n                 D). Then mark the corresponding letter on Answer Sheet 1 with a single line through the centre.\nPassage One\nQuestions 16 to 19 are based on the passage you have just heard.\n16.    A) District managers.                                               C) Sales directors.\n       B)    Regular customers.                                            D)    Senior clerks.\n17.    A) The support provided by the regular clients.\n         B) The initiative shown by the sales representatives.\n         C) The urgency of implementing the company’s plans.\n         D) The important part played by district managers.\n18.    A) Some of them were political-minded.                              C) One third of them were senior managers.\n       B)    Fifty percent of them were female.                            D)    Most of them were rather conservative.\n19.    A) He used too many quotations.                                     C) H
