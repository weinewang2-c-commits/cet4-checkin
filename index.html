and earlier generations spending far less on education— as all the accumulating evidence now\ndocuments.\n 61. What do we learn from various studies on America’s public education?\n        A) Achievement tests have failed to truly reflect the quality of teaching.\n        B) Public schools lack the resources to compete with private schools.\n        C) Little improvement in education has resulted from increased spending.\n        D) The number of students has increased much faster than that of teachers.\n 62. How do some people explain the decline in public education?\n        A) Government investment does not meet schools’ needs.\n        B) Skilled students are moving to private schools.\n        C) Qualified teachers are far from adequately paid.\n        D) Training of students basic skills is neglected.\n                                   ,\n\n  63. What was a significant contributor to the past glory of public schools?\n        A) Well-behaved students.                                    C) Talented women teachers.\n        B) Efficient administration.                                 D) Generous pay for teachers.\n  64 Why did some of the best women teachers leave teaching?\n        A) New career opportunities were made available to them by women’s liberation.\n        B) Higher academic requirements made it difficult for them to stay in their jobs.\n        C) They were unhappy with the bureaucratic administration in their schools.\n        D) The heavy teaching loads left them little time and energy for family life.\n 65. What does the author think is one of the results of government involvement in education?\n        A) Increasing emphasis on theories of education.\n        B) Highly standardized teaching methods.\n        C) Students’ improved academic performance.\n        D) An ever-growing number of administrators.\n\n                                                                 7\n\n                             2014 年 12 月大学英语四级考试真题(二)答案与详解\n\nPart IV                                                        Translation                              (30 minutes)\n  Directions： For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You should write your\n                answer on Answer Sheet 2.\n   中国的互联网社区是全世界发展最快的。2010 年，中国约有 4.2 亿网民（netizen)，而且人数还在迅速增长。互联\n网的日渐流行带来了重大的社会变化。中国网民往往不同于美国网民。美国网民更多的是受实际需要的驱使，用互联网\n为工具发电子邮件、买卖商品、做研究、规划旅程或付款。中国网民更多是出于社交原因使用互联网，因而更广泛地使\n用论坛、博客、聊天室等。\n\n                                                              8\n"}, "2014-12-03": {"title": "2014年12月四级真题(第3套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2014-12/03", "text": "                                           2014 年 12 月年大学英语四级考试真题（三）\n\n               2014 年 12 月大学英语四级考试真题（第 3 套)\nPart I                                                      Writing                                             (30 minutes)\nDirections： For this part, you are allowed 30 minutes to write a short essay about a campus activity that has benefited you\n                most. You should state the reasons and write at least 120 words but no more than 180 words.\n\nPart II                                           Listening Comprehension                                       (30 minutes)\nSection A\nDirections ： In this section, you will hear 8 short conversations and 2 long conversations. At the end of each conversation, one\n                or more questions will be asked about what was said. Both the conversation and the questions will be spoken only\n                once. After each question there will be a pause. During the pause, you must read the four choices marked A), B), C)\n                and D), and decide which is the best answer. Then mark the corresponding letter on Answer Sheet 1 with a single\n                line through the centre.\n1.    A) The man hates to lend his tools to other people.\n     B) The man hasn’t finished working on the bookshelf.\n     C) The tools have already been returned to the woman.\n     D) The tools the man borrowed from the woman are missing.\n2.    A) Save time by using a computer.                             C)   Borrow Martha’s computer.\n     B)    Buy her own computer.                                    D)    Stay home and complete her paper.\n3.    A) The man doesn’t have money for his daughter’s graduate studies.\n      B)    The man doesn’t think his daughter will get a business degree.\n     C)    The man insists that his daughter should pursue her studies in science.\n     D)    The man advises his daughter to think carefully before making her decision.\n4.    A) The cinema is some distance away from where they are.\n      B)    He would like to read the film review in the newspaper.\n     C)    They should wait to see the movie at a later time.\n     D)    He’ll find his way to the cinema.\n5.    A) He’s been to Seattle many times.                           C)   He has a high position in his company.\n      B) He has chaired a lot of conferences.                       D)    He lived in Seattle for many years.\n6.    A) Teacher and student.                                       C)   Manager and office worker.\n      B)    Doctor and patient.                                     D)    Travel agent and customer.\n7.    A) She knows the guy who will give the lecture.\n      B) She thinks the lecture might be informative.\n      C)    She wants to add something to her lecture.\n      D) She’ll finish her report this weekend.\n8.    A) The houses for sale are of poor quality.\n      B)    The houses are too expensive for the couple to buy.\n      C) The housing developers provide free trips for potential buyers.\n      D) The man is unwilling to take a look at the houses for sale.\nQuestions 9 to 11 are based on the conversation you have just heard.\n9.    A) How to study English well.                              C) How to write computer games.\n      B) Which courses to choose.                                D) Which books to read.\n10. A) Physical sciences.                                       C) Art and design.\n     B) Maths and physics.                                      D) Electronics and computer-programming.\n11. A) Her English is very good.                                C) Her English writing is poor.\n\n                                                                   1\n\n                                           2014 年 12 月年大学英语四级考试真题（三）\n\n      B) She is interested in English.                              D) Her oral English is bad.\nQuestions 12 to 15 are based on the conversation you have just heard.\n12.     A) Applying for a work experience.                             C) Taking an exam.\n        B) Applying for a part-time job.                               D)       Visiting an old friend.\n13.     A)    Students in the first half of their courses.\n        B) Students who will graduate soon.\n        C) Students in the second half of their courses.\n        D) Students who have just graduated from universities.\n14.     A) Explain the procedures to the students.                      C) Write a comprehensive report.\n        B) Work regular hours.                                         D)       Send a report about the woman’s work.\n15.     A) In two weeks.                                               C) In the second half of her course.\n        B)    In three weeks.                                          D)       Not decided yet.\n\nSection B\nDirections ： In this section, you will hear 3 short passages. At the end of each passage, you will hear some questions. Both the\n                 passage and the questions will be spoken only once. After you hear a question, you must choose the best answer\n                 from the four choices marked A), B),C)and D). Then mark the corresponding letter on Answer Sheet 1 with a\n              single line through the centre.\nPassage One\nQuestions 16 to 18 are based on the passage you have just heard.\n16.     A) Synthetic fuel.                                    C) Alcohol.\n        B) Solar energy.                                      D) Electricity.\n17.     A) Air traffic conditions.                             C) Road conditions.\n        B) Traffic jams on highways.                           D) New traffic rules.\n18.     A) Go through a health check.                         C) Arrive early for boarding.\n       B) Carry little luggage.                       D) Undergo security checks.\nPassage Two\nQuestions 19 to 22 are based on the passage you have just heard.\n19. A) In a fast-food restaurant.                C) At a county fair.\n        B) At a shopping center.                        D) In a bakery.\n20.     A) Avoid eating any food.                            C) Wash his hands thoroughly.\n        B) Prepare the right type of pie to eat.         D) Practice eating a pie quickly.\n21.     A) On the table.                                 C) Under his bottom.\n        B) Behind his back.                                  D) On his lap.\n22.     A)    Looking sideways to see how fast your neighbor eats.\n        B)   Eating from the outside toward the middle.\n        C) Swallowing the pie with water.\n        D) Holding the pie in the right position.\nPassage Three\nQuestions 23 to 25 are based on the passage you have just heard.\n23. A) Beauty.                       B) Loyalty.                       C) Luck.                           D) Durability.\n24. A)       He wanted to follow the tradition of his country.\n        B) He believed that it symbolized an everlasting marriage.\n        C) It was thought a blood vessel in that finger led directly to the heart.\n        D) It was supposed that the diamond on that finger would bring good luck.\n25. A)       The two people can learn about each other’s likes and dislikes.\n        B) The two people can have time to decide if they are a good match.\n        C) The two people can have time to shop for their new home.\n siness administration. The graduates of these courses often start out in middle management\njobs. From there, they can easily get promoted if they show the necessary 35 and ability.\n\nPart III                     Reading Comprehension                                                      (40 minutes)\nSection A\nDirections ： In this section, there is a passage with ten blanks. You are required to select one word for each blank from a list of\n               choices given in a word bank following the passage. Read the passage through carefully before making your\n               choices. Each choice in the bank is identified by a letter. Please mark the corresponding letter for each item on\n               Answer Sheet 2 with a single line through the centre. You may not use any of the words in the bank more than\n               once.\n\nQuestions 36 to 45 are based on the following passage.\n      For decades, Americans have taken for granted the United States’ leadership position in the development of new\ntechnologies. The innovations (创 新）that resulted from research and development during World War Ⅱ and afterwards were\n36   to the prosperity of the nation in the second half of the 20th century. Those innovations, upon which virtually all aspects of\n37 society now depend, were possible because the United States then 38 the world in mathematics and science education.\nToday, however, despite increasing demand for workers with strong skills in mathematics and science, the           39     of degrees\nawarded in science, math, and engineering are decreasing.\n     The decline in degree production in what are called the STEM disciplines (science, technology, engineering, and math)\nseems to be 40 related to the comparatively weak performance by US schoolchildren on international assessments of math and\nscience. Many students entering college have weak skills in mathematics. According to the 2005 report of the Business-Higher\nEducation Forum, 22 percent of college t of cooking in schools and banning machines (自动售货机）here and there—as\n     suggested by the AMRC report—is not going to achieve very much. Labelling is quite inadequate. What is needed is\n     legislation banning high levels of sugary syrups used in foods and drinks.\nO)   In June 2012, the then minister for public health said the government was not scared of the food industry and had not ruled\n     out legislation, because of the costs of obesity to the NHS. However, nothing has happened yet. Why not have another\n     Jammie Dodger biscuit and forget about it.\n\n46. Avoiding over-consumption of sugar can improve peopled health as well as save medical expenses.\n47. Laws should be passed to make it illegal to produce overly sweet foods or drinks.\n48. Giving small children sweet juices to drink all the time is equal to child abuse.\n49. Looking around, the author found obesity quite widespread.\n50. The number of obese people is expected to increase quickly in the next few decades.\n51. If people really understood the horrible consequences of sugary foods and drinks, they would support government\n     measures against sugar consumption.\n52. It would be a very good beginning to impose an additional tax on sugary drinks.\n53. The government has not yet taken any action to regulate sugar consumption although it indicated its intention to do so some\n     time ago.\n54. Sugar is far more harmful to health than fat and salt.\n55. Consumers of sweet foods are not really to blame because they cannot tell what food is sugary.\nSection C\nDirections： There are 2 passages in this section. Each passage is followed by some questions or unfinished statements. For each\n                 of them there are four choices marked A), B), C) and D). You should decide on the best choice and mark the\n                 corresponding letter on Answer Sheet 2 with a single line through the centre.\nPassage One\nQuestions 56 to 60 are based on the following passage.\n      The rise of ood or bad for society. In an interview with TIME earlier\nthis week, Cohen said although he and his co-author are optimistic about many aspects of the Internet, they’ve also realistic about\nthe risks and dangers that lie ahead when the next five billion people come online, particularly with respect to personal privacy\nand state surveillance (监视).\n56.   In what way is the rise of the Internet similar to the invention of the printing press and the telegraph?\n      A)   It transforms human history.                             C)      It is adopted by all humanity.\n      B)   It facilitates daily communication.                      D)      It revolutionizes people’s thinking.\n57. How do Schmidt and Cohen describe the effects of the Internet?\n      A)   They are immeasurable.                                   C)      They are unpredictable.\n      B)   They are worldwide.                                      D)      They are contaminating.\n58. In what respect is the book The New Digital Age considered inadequate?\n      A)   It fails to recognize the impact of the Internet technology.\n      B)   It fails to look into the social implications of the Internet.\n      C)   It lacks an objective evaluation of the role of Internet businesses.\n      D)   It does not address the technical aspects of Internet communication.\n59. What will the future be like when everybody gets online?\n      A)   People will be living in two different realities.\n      B)   People will have equal access to information.\n      C)   People don’t have to travel to see the world.\n      D)   People don^ have to communicate face to face.\n60. What does the passage say about the authors of The New Digital Age?\n      A)   They leave many questions unanswered concerning the Internet.\n      B)   They are optimistic about the future of the Internet revolution.\n      C)   They have explored the unknown territories of the virtual world.\n      D)   They don^ take sides in analyzing the effects y for selling food that makes\n     people fat. Critics even complain that McDonald’s, whose logo symbolises calorie excess, should not have been allowed to\n     sponsor the World Cup. These are things fast-food firms have learnt to cope with. But not perhaps for much longer. The\n     burger business faces more pressure from regulators at a time when it is already adapting strategies in response to shifts in\n     the global economy.\nB) Fast food was once thought to be recession-proof. When consumers need to cut spending, the logic goes，cheap meals like\n     Big Macs and Whoppers become even more attractive. Such “trading down” proved true for much of the latest recession,\n     when fast-food companies picked up customers who could no longer afford to eat at casual restaurants. Traffic was boosted\n     in America, the home of fast food, with discounts and promotions, such as $ 1 menus and cheap combination meals.\nC) As a result, fast-food chains have weathered the recession better than their more expensive competitors. In 2009 sales at\n     full-service restaurants in America fell by more than 6% , but total sales remained about the same at fast-food chains. In\n     some markets, such as Japan, France and Britain, total spending on fast food increased. Same-store sales in America at\n     McDonald’s, the world’s largest fast-food company, did not decline throughout the downturn. Panera Bread, an American\n     fast-food chain known for its fresh ingredients, performed well, too, because it offers higher-quality food at lower prices\n     than restaurants.\n\n                                                                         4\n\n                                         2015 年 6 月大学英语四级考试真题(一)\n\nD) But not all fast-food companies have been as fortunate. Many, such as Burger King, have seen sales fall. In a severe\n     recession, while some people trade down to fast food, many others eat at home more frequently to save money. David\n     Palmer，an ana tes, as shown by Australian\nfigures from their slip-slop-slap campaign. So if there is a heat wave this summer, it would be best for us, too, to slip on a shirt,\nslop on (补上) sunscreen and slap on a hat.\n56. What is peopled common expectation of a high-factor sunscreen?\n       A) It will delay the occurrence of skin cancer.             C) It will keep their skin smooth and fair.\n       B) It will protect them from sunburn.                            D) It will work for people of any skin color.\n57. What does the research in Nature say about a high-factor sunscreen?\n      A)    It is ineffective in preventing melanomas.\n      B)    It is ineffective in case of intense sunlight.\n      C)    It is ineffective with long-term exposure.\n      D)    It is ineffective for people with fair skin.\n58. What do we learn from the 2011 Australian study of 1,621 people?\n      A)    Sunscreen should be applied alongside other protection measures.\n      B)    High-risk people benefit the most from the application of sunscreen.\n\n                                                                       6\n\n                                         2015 年 6 月大学英语四级考试真题(一)\n\n     C)     Irregular application of sunscreen does women more harm than good.\n     D)     Daily application of sunscreen helps reduce the incidence of melanomas.\n59. What does the author say about the second Australian study?\n     A)     It misleads people to rely on sunscreen for protection.\n     B)     It helps people to select the most effective sunscreen.\n     C)     It is not based on direct observation of the subjects.\n     D)     It confirms the results of the first Australian study.\n60. What does the author suggest to reduce melanoma rates?\n      A) Using both covering up and sunscreen.                       C) Using covering up instead of sunscreen.\n      B ) Staying in the shade whenever possible.                    D) Applying the right amount of sunscreen.\n\nPassage Two\nQuestions 银行的分析师大 卫.帕尔曼表示， 在美国，\n一 些小型的快餐连锁店，如玩偶匣和卡乐星，在这次经济衰退中受到了特别严重的冲 击，因为它们要与麦当劳这样的全球性\n\n快餐巨头进行竞争。去年，在其他企业都减少广告投入的情况下，麦当劳 在广告宣传上的投入却增加了 7%多。\n    —些快餐企业还不惜牺牲自己的利润试图给顾客们更好的优惠。（52)在经济衰退期间，很多商家采取 低价策略，他\n们期望一旦吸引顾客进门，就能够劝说他们购买梢贵的产品。但在多数情况下，这种策略并不^ 效。去年，汉堡王的特许经\n销商就因为双层奶酪汉堡的促销活动而起诉该公司，声称以 1 美元出售这些成本价^ 1.10 美元的产品对他们来说是不公平\n的。五月份法官裁决表示支持汉堡王。尽管如此，这家公司可能还是要咒 骂其做出的促销便宜菜品而不是更高价菜品的决\n定，因为这些“实惠菜单”上的菜品在销售总额中所占的比例从 去年 10 月的 12%上升到了现在的 20% ^\n    (54)分析人士对今年快餐业的适度增长有所期待。但是衰退的形势促使商家重新考虑他们的策略。现 在许多商家推出\n一些价格稍高的商品试图将消费者从 1 美元的特价商品中吸引回来。拥有塔可钟和必胜客的百 胜餐饮集团的旗下品牌肯德\n基已经推出了一款售价约 5 美元的鸡肉三明治。五月份汉堡王推出了 7 美元八个的 烤猪排。\n    许多快餐企业也试图让消费者购买包括饮料在内的更多新产品。麦当劳开始销售更优质的咖啡作为对 星巴克的挑战。\n它的“麦克咖啡”系列在美国本土的销售量约占 6%。（48)星巴克已经将它的西雅图最好咖■# 的品牌版权出售给了汉堡王，\n该咖啡将在今年晚些时候开始销售。\n    因为销售策略从“大尺寸”向“更多买家”转变，快餐商家需要维持一天的高客流量。(53)许多商家看到 了早餐市场的\n巨大商机，而不是仅仅出售高脂肪的食物。麦当劳明年将在美国销售粥类食物。伯恩斯坦调查公 司的分析师莎拉•塞纳托尔\n表示，早餐市场具有很好的赚钱潜力，因为其利润相当高。快餐商家也在增加中午和 夜晚小吃的种类，例如混合型饮料及\n包装食品。其想法是，通过在菜单上涵盖更广的范围，“我们可以卖给消费者 他们一整天都需要的食物，”百胜集团首席财\n务官瑞克•卡如茨说道。\n    但是那些越长越粗的腰围怎么办呢？到目前为止，快餐企业已经聪明地避开了政府的监管。（49)通过提 供一些健康\n的选择，像沙拉和低热量的三明治，这些企业至少给人们留下了采取行动帮助对抗肥胖的印象。提供 的这些东西未必是亏\n本特卖品，因为它们增强了廉价食品店对食客群体，包括不想吃汉堡的人们的吸引力。但是 消费者不能被强制点沙拉来代\n替薯条。\n    在未来，简单提供一些健康的可供选择的食品可能是不够的。“每一个我所了解的包装食品和餐馆企业 现在都在关心\n法律规定，”瑞银集团的帕尔曼先生表示。（55)今年美国国会通过的健康改革法案要求拥有 20 家 及以上连锁店的餐馆将\n它们所供应的食品卡路里含量印制在菜单上。一项由美国国家经济研究局开展的对 2007 年在纽约推出的相似热量张贴法\n案对星巴克的影响跟踪调查发现,在旁边有唐恩都乐连锁店的情况下，星巴克每 次交易中的平均热量值减少了 6% ,而收益\n增长了 3% ■——也就是说，这些菜单标签有助于这些连锁企业提供更 健康的菜品。\n    为了避免与美国和其他地方的法规起冲突，快餐企业将不得不继续创新。麦当劳的沃特■瑞克宣称其公 司已经对菜单\n进行了改良，这意味着麦当劳与几年前相比会提供更多健康的食品。“与世界上的其他餐饮企业相 比，我们可能会销售更\n多的蔬菜、更多的牛奶、更多的沙拉以及更多的苹果他说道。（46)但是加利福尼亚州的 一个小镇最近提出一项议案，即\n禁止麦当劳在其高热量的“快乐套餐”中附赠玩具，因为立法者们认为这会引诱孩 子们去吃不健康的食物，这表明还有更多\n                          事情等着快餐企业去做。\nB 详解详析\n46. Some people propose laws be made\n                                        K) In order to avoid other legislation in America and elsewhere,\n    to stop McDonald's from attaching\n                                        fast-food companies will have to continue innovating (仓!J 新）•\n    toys to it to have a comfortable retirement.\n        iEl|$事实细节题。文章第四段第二句和第三句提到，许多欧洲国家政府已经摒弃了曾鼓励人们尽 早退的政策。\n        预期寿命的延长以及慷慨的固定养老金计划被不再慷慨的固定缴费养老金计划所替 代，这些都意味着甚至有钱人\n        也必须延长工作年限以获得舒适的退休生活。由此可知，政策的变化带来 的后果是甚至有钱人也不得不为了在退\n        休后过上舒适的生活而延长工作年限，故答案为 c)。\n        (gi 睛 A) “无技术的人可能选择尽早退休”，根据文章第四段第二句，许多欧洲国家政府已经摒弃了 曾鼓励人们\n        尽早退休的政策，可见，人们可能都会因此而延长工作时间，因此排除;B) “更多的人不得不 接受在职培训”，\n        文章中并未提及职业培训问题，因此排除;D) “人们可能会从养老金计划中获得慷慨的 固定福利”，根据第四段\n        第三句，慷慨的固定养老金计划被不再慷慨的固定缴费养老金计划所替代，可见 养老:§计划已经修改，早已不再\n        像从前那样慷慨，因此排除。\nD)。(H$§j 由题干中的 characteristic of work 定位到第四段第四至六句：But the changing nature of\n        work also plays a big role. Pay has risen sharply for the highly educated,and those people continue\n        to reap rich rewards into old age because these days the educated elderly are more productive\n        than the preceding generation. Technological change may well reinforce that shift： the skills that\n        complement computers, from management knowhow to creativity, do not necessarily decline\n        with age.\n               解推理判断题。文章第四段第四句提到,工作性质的变化也起到了很大作用，第五句进而对工 作性^的变化\n         进行了分析，指出对那些高学历人士而言，工作报酬在大幅增加，这些人将继续获得较高 的收人，直到老年，因\n         为当今的老龄高学历人群比上一代人工作更有成效，第六句对上文进行了总结，得 出结论，技术革新可能将进一\n         步增强这一转变:作为计算机的补充的技能，从经营管理技巧到创新能力，\n\n                                 2015 年 6 月大学英语四级考试真题(一)\n\n         都不会随着年龄的增长而衰退。由此可见,21 世纪的工作特点是，比起年龄问题,经营管理技巧、创新 能力等技\n      能将更加被看重，故答案为 D)。\n            睛：A)“计算机将承担更复杂的工作”，文章第四段的末句提到从经营管理技巧到创新能力，都是 ginSt\n      算机的补充的技能，因此更复杂的工作仍然是由人来承担的，而非计算机，故排除;B)“更多的工 作将由年轻的\n      高学历人才承担”，根据文章第四段的内容，作者强调的是老龄高学历人群比上一代人工 作更有成效，因此相对\n      于年轻人,年龄较长的高学历人才将更\n      受欢迎，故排除;C) “大多数工作将是\n      创造 性的”，文章末句提到创新能力可\n      以作为计算机的补充，可见,除了创新                             complement [ 'komplimont] v.补充\n      性工作之外，仍有大量的其他工 作需                             decline [difklain] u 降低，减少\n                                                    compare with 与...... 相比\n      要计算机完成，因此也排除。\n                                                    put off 推迟\n©高频词汇及辑语 deepen [丨 diipsn] v•加深\n  加剧 squeeze [skwiiz] v.压；榨 retirement [ri'taismant] n.退休 generous [^enaros] ac?/•慷慨的，大方的\n\n                                           Part IV Translation\ng 参考译文_、_\n     China is one of the most ancient civilizations across the world ， from which many elements that\nconstruct the foundation of the modem world are derived. Now China has the worlds fastest growing\neconomy and is experiencing a new industrial revolution. It has also launched an ambitious space\nexploration plan, including the building of a space station by 2020. Currently, being one of the largest\nexporters in the world, China is attracting massive foreign investment. Meanwhile, it has invested billions of\ndollars overseas as well. In 2011, China surpassed Japan, becoming the second largest economic entity in\nthe world.\nB 难点注释\n翻译第一句时需要注意，“……之一”的表述中，名词使用复数形式，“最古老的文明之一”可译为 one of the most ancient\n  civilizations 或 one of the oldest civilizations。\n翻译第二句时，需要注意句子的主干为“元素起源于中国”，谓语动词“起源于”可译为 be derived from 或 originate from;\n  定语“构成现代世界基础的”较长，可处理为定语从句来修饰先行词“元素”；“构成……基础” 可译为 construct the\n  foundation of 或 form the basis of。由于第一句和第二句均为简单句，都出现了“中国” 一词，翻译时既可以单独成\n  句，也可以合二为一。本译文采用后者，将第一句作为主句,第二句处理为定语从 句，用介词+ which 来引导，修饰第\n  一句中的 China，从而使译文更加简洁连贯。\n翻译第三句时，需要注意该句主语为“中国”，句中有两个并列谓语“拥有”和“经历”。“拥有”表示的是客观事 实，可采用\n  一般现在时，“正经历着”强调当前的情况，可采用现在进行时；“工业革命”可译为 industrial revolution 〇\n第四句中“太空探索计划”可直译为 space exploration plan,也可意译为 plan for exploring the outer space; “启动”\n  可译为 launch 或 start。\n第五句和第 M 句结构相似，该句有两种译法。可以翻译为两个并列的简单句，也可以将“中国正在吸引大量外 国投资”译\n  为主句,时态为现在进行时;“是世界最大的出口国之一”采用非谓语结构，译为 being one of the largest exporters in\n  the world,避免单调和重复 0\n第六句为简单句,“在海外投资”译为 invest overseas, “数十亿”译为 billions of。\n翻译最后一句时应注意时态。该句表述的是过去的事实，应使用一般过去时。“超越”译为 surpass;“成为”这 个短语有两\n  种译法，可以将“超越”和“成为”处理为两个并列的动作，译为 became the second largest economy in the world;\n  也可以将“成为”处理为现在分词作状语，表示结果，译为 becoming the second largest economic entity in the\n  world 〇\n   Q ： What does the man imply?\n   C)   。未听先知选项中多次出现 game 和 play chess,可以推测对话内容与下象棋有关。另外，从四个选 项的内容中\n        可以推测，对话讲的应该是女士想放弃下象棋，男士给出建议或指导。\n        解本题的关键在于听懂反问句和反问的语调。女士说因为今天又输了，所以打算放弃下象棋。 男士没有正面回应，\n                          而是反问了两句：Just because you lost? Is that any reason to quit? “仅仅是因为输\n        了吗？那能算是放弃的理由吗?”言外之意就是不该放弃。换句话说就是，男士建议女士继续下棋。故本 题答案为\n        D)。\n2. M: Do you know Sally’s new address? She’s got some mail here, and I’d like to forward it to her.\n\n                                 2015 年 6 月大学英语四级考试真题(一)\n\n   W： Well, we've not been in touch for quite a while. Let’s see. Mary should know it.\n   Q ： What does the woman mean?\n   D)   。馨 1 2 3 4 耒明^知_.选项中出现了 mail, address 和 contact 等词，可以推测对话内容和邮件有关。由选项中\n        的 玛丽和萨利两个人名可知对话盼内容涉及另外两个人，人物较多，听录音时应注意区分人物之间的关系， 做好\n        标记;另外，选项 A)以 the man 作主语，选项 B)和 D)以 she 作主语，可以推测该题会从女士的角度 提问^女士\n        的话为听音重点。\n        :塵译解本题的关键在于听到细节“Maiy should know it. ”男士想把萨利的邮件转寄给她，问女士是否 知道她的\n        地址。女士说自己很久没跟萨利联系了,但是结尾补充了一句：“玛丽应该知道地址。”故本题 答案为 C)。\n3. W： I missed classes this morning. Could you please lend me your notes?\n   M： My notes? YouVe never seen my handwriting, have you?\n   Q ： What does the man imply?\n   C)   。鼸未听先知选项中出现了 handwriting, notes 和 class 等词，可以推测对话内容应该与上课做笔记有 关。另\n        外，四个选项中，A)和 B)以 his 开头，C)和 D)以 he 为主语，可以推测该题会从男士的角度提问， 男士的话为听\n        音重点。\n        M 详解解题的关键是听懂反意疑问句。女士想要借男士的笔记看，男士没有正面回答，而是反问道：YouVe never\n        seen my handwriting，have you? “你没看过我的笔迹，对吗?”言夕卜之意就是自己的笔迹难\n      .以辨认，不易读懂。故本题答案为 B)。\n4. M： Tm taking my girlfriend to the fancy new restaurant for her birthday tonight.\n   W ： I went there last weekend. I found it rather disappointing.\n   Q ： What does the woman mean?\n   D)   。S,未听先知四个选项中反复出现了 choose 和 restaurant 等词，由此推测对话内容与选择饭店有关。 另外，\n        选项 A)和 D)均是讲男士选择饭店，而选项 B)和 C)则出现了 dating 和 her，故可推测该题可能是 从女士的角度\n        看待男士所选择的饭店，女士的话为听音重点。\n                                           201^6/10 丄纪\nW ： Yes, I see. Well, Mr. Grand is not available just now.\nM ： Can you tell me when I could reach him?\nW ： HeJs very busy for the next few days. Then he5ll be away in New York. So ifs difficult to give you a time.\nM： Could I speak to someone else, perhaps?\nW ： Who, in particular?\n"}, "2015-06-02": {"title": "2015年6月四级真题(第2套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2015-06/02", "text": "                                        2015 年 6 月大学英语四级考试真题(二）\n\n2015 年 6 月大学英语四级考试真题（第 2 套)\nPart I                                                                   Writing                           (30 minutes)\nDirections： For this part,you are allowed 30 minutes to write an essay based on the picture below. You should start your essay\n             with a brief description of the picture and then comment on this kind of modem life. You should write at least 120\n             words but no more than 180 words.\n                                                  THIS MODERN LIFE\n                               WORK                  HOME                    PLAY               SLEEP\n\nPart II                                             Listening Comprehension                              (30 minutes)\nSection A\nDirections： In this section,you will hear 8 short conversations and 2 long conversations. At the end of each conversation, one or\n                more questions will be asked about what was said. Both the conversation and the questions will be spoken only\n                once. After each question there will be a pause. During the pause, you must read the four choices marked A), B),\n                C) and D), and decide which is the best answer. Then mark the corresponding letter on Answer Sheet 1 with a\n             single line through the centre.\n   1.    A) He is pleased to sit on the committee.\n         B) He is willing to offer the woman a hand.\n         C) He will tell the woman his decision later.\n         D) He would like to become a club member.\n   2.    A) Their planned trip to Vancouver is obviously overpriced.\n         B) They should borrow a guide book instead of buying one.\n         C) The guide books in the library have the latest information.\n         D) The library can help order guide books about Vancouver.\n   3. A) He regrets having taken the history course.\n         B) He finds little interest in the history books.\n         C) He has trouble finishing his reading assignments.\n         D) He has difficulty writing the weekly book report.\n   4. A) The man had better choose another restaurant.\n         B) The new restaurant is a perfect place for dating.\n         C) The new restaurant caught her fancy immediately.\n         D) The man has good taste in choosing the restaurant.\n   5. A) He has been looking forward to spring.              C) He will clean the woman’s boots for spring.\n         B) He has been waiting for the winter sale.            D) He will help the woman put things away.\n   6. A) At a tailor’s.                                                C) In a clothes store.\n         B) At Bob’s home.                                             D) In a theatre.\n   7. A) His guests favor Tibetan drinks.                       C) Mineral water is good for health.\n         B) At Bob’s home.                                      D) Plain water will serve the purpose.\n   8. A) Report the result of a discussion.                     C) Submit an important document.\n        B) Raise some environmental issues.                     D) Revise an environmental report.\n\n                                                                   1\n\n                                      2015 年 6 月大学英语四级考试真题(二）\n\n   Questions 9 to 12 are based on the conversation you have just heard.\n   9. A) They pollute the soil used to cover them.                    C) The rubbish in them takes long to dissolve.\n     B) They are harmful to nearby neighborhoods.                     D) The gas they emit is extremely poisonous.\n   10. A) Growing population.                                 C) Changed eating habits.\n        B) Packaging materials.                               D) Lower production cost.\n   11. A) By saving energy.                                     C) By reducing poisonous wastes.\n        B) By using less aluminum.                              D) By making the most of materials.\n   12. A) We are running out of natural resources soon.\n        B) Only combined efforts can make a difference.\n        C) The waste problem will eventually hurt all of us\n        D) All of us can actually benefit from recycling.\n   Questions 13 to 15 are based on the conversation you have just heard.\n   13. A) Miami. B) Vancouver.          C) Bellingham.        D) Boston.\n   14. A) To get information on one-way tickets to Canada.\n        B) To inquire about the price of “ Super Saver” seats.\n        C) To get advice on how to fly as cheaply as possible.\n        D) To inquire about the shortest route to drive home.\n   15. A) Join a tourist group.         C) Avoid trips in public holidays.\n        B) Choose a major airline.      D) Book tickets as early as possible.\n\nSection B\nDirections： In this section, you will hear 3 short passages. At the end of each passage, you will hear some questions. Both the\n              passage and the questions will be spoken only once. After you hear a question, you must choose the best answer\n              from the four choices marked A),B),C),and D). Then mark the corresponding letter on Answer Sheet 1 with a\n              single line through the centre.\nPassageOne\nQuestions 16 to 18 are based on the passage you have just heard.\n16. A) There are mysterious stories behind his works.\n    B) There are many misunderstandings about him.\n    C) His works have no match worldwide.\n    D) His personal history is little known.\n17. A) He moved to Stratford-on-Avon in his childhood.\n    B) He failed to go beyond grammar school.\n    C) He was a member of the town council.\n    D) He once worked in a well-known acting company.\n18. A) Writers of his time had no means to protect their works.\n    B) Possible sources of clues about him were lost in a fire.\n    C) His works were adapted beyond recognition.\n    D) People of his time had little interest in him.\nPassage Two\nQuestions 19 to 21 are based on the passage you have just heard.\n19. A) It shows you have been ignoring your health.\n    B) It can seriously affect your thinking process.\n    C) It is an early warning of some illness.\n\n                                                                  2\n\n                                          2015 年 6 月大学英语四级考试真题(二）\n\n       D) It is a symptom of too much pressure.\n20.      A) Reduce our workload.                                           C) Use painkillers for relief.\n          B) Control our temper.                                           D) Avoid masking symptoms.\n21.     A) Lying down and having some sleep.                               C) Going out for a walk.\n        B) Rubbing and pressing one’s back.                                D) Listening to light music.\nPassage Three\nQuestions 22 to 25 are based on the passage you have just heard.\n22. A) Depending heavily on loans.                                    C) Spending beyond one’s means.\n      B) Having no budget plans at all.                               D) Leaving no room for large bills.\n23. A) Many of them can be cut.                                       C) They eat up most of the family income.\n      B) All of them have to be covered.                              D) They eat up most of the family income.\n24. A) Rent a house instead of buying one.                            C) Make a conservation plan.\n      B) Discuss the problem in the family.                           D) Move to a cheaper place.\n25. A) Financial issues plaguing a family.                             C) Family budget problems and solutions.\n      B) Difficulty in making both ends meet.                          D) New ways to boost family income.\nSection C\nDirections： In this section, you will hear a passage three times. When the passage is read for the first time, you should listen\n              carefully for its general idea. When the passage is read for the second time, you are required to fill in the blanks\n              with the exact words you have just heard. Finally, when the passage is read for the third time, you should check\n              what you have written.\n     Perhaps because going to college is so much a part of the American dream, many people go for no 26 reason. Some go\nbecause their parents expect it, others because ifs what their friends are doing. Then, there’s the belief that a college degree will\n27 ensure a good job and high pay.\n       Some students 28 through four years, attending classes, or skipping (逃课) them as the case may be, reading only what\ncan’t be avoided, looking for less 29 courses, and never being touched or changed in any important way. For a few of these\npeople, college provides no 30 , yet because of parental or peer pressure, they cannot voluntarily leave. They stop trying in the\nhope that their teachers will make the decision for them by     31 them.\n       To put it bluntly /(直截了当地）,unless you’re willing to make your college years count, you might be 32 doing\nsomething else. Not everyone should attend college, nor should everyone who does attend begin right after high school. Many\ncollege students 33 taking a year or so off. A year out in the world helps some people to 34 their priorities and goals. If you’re\nreally going to get something out of going to college, you have to make it mean something, and to do that you must have some\nidea why you’re there, what you hope to get out of it, and 35 even what you hope to become.\n\nPartⅢ                                 Reading Comprehension                                                   (40 minutes)\nSectionA\nDirections： In this section, there is a passage with ten blanks. You are required to select one word for each blank from a list of\n              choices given in a word bank following the passage. Read the passage through carefully before making your\n              choices. Each choice in the bank is identified by a letter. Please mark the corresponding letter for each item on\n              Answer Sheet     2 with a single line through the centre. You may not use any of the words in the bank more\n                than once.\nQuestions 36 to 45 are based on the following passage.\n       Ifs our guilty pleasure： Watching TV is the most common everyday activity, after work and sleep, in many parts of the\nworld. Americans view five hours of TV each day, and while we know that spending so much time sitting 36 can lead to\nobesity/(肥胖症）and other diseases, researchers have now quantified just how 37 being a couch potato can be.\n       In an analysis of data from eight large 38 .published studies, a Harvard-led group reported in the that for every two hours\n\n                                                                 3\n\n                                       2015 年 6 月大学英语四级考试真题(二）\n\nper day spent channel 39 , the risk of developing Type 2 diabetes Journal of the American Medical Asociation (糖尿病）rose\n20% over 8. 5 years, the risk of heart disease increased 15% over a 40 , and the odds of dying prematurely          41 13% during\na seven-year follow-up. All of these 42 are linked to a lack of physical exercise. But compared with other sedentary (久坐的）\nactivities, like knitting, viewing TV may be especially 43 at promoting unhealthy habits. For one, the sheer number of hours\nwe pass watching TV dwarfs the time we spend on anything else. And other studies have found that watching ads for beer and\npopcorn may make you more likely to 44 them.\n     Even so, the authors admit that they didn’t compare different sedentary activities to 45 whether TV watching was linked\nto a greater risk of diabetes, heart disease or early death compared with, say, reading.\n              A) climbed                                                                   I) previously\n             B) consume                                                                     J) resume\n              C) decade                                                                     K) suffered\n             D) determine                                                                   L) surfing\n              E) effective                                                                  M) term\n              F) harmful                                                                   N) terminals\n\n             G) outcomes\n                                                                                            O) twisting\n             H) passively\n\nSection B\nDirections：In this section,you are going to read a passage with ten statements attached to it. Each statement contains information\n              given in one of the paragraphs. Identify the paragraph from which the information is derived. You may choose a\n              paragraph more than once. Each paragraph is marked with a letter. Answer the questions by marking the\n              corresponding letter on Answer Sheet 2.\n                                       Essay-Grading Software Offers Professors a Break\nA.    Imagine taking a college exam, and, instead of handing in a blue book and getting a grade from a professor a few weeks\n      later, clicking the “send” button when you are done and receiving a grade back instantly, your essay scored by a software\n      program. And then, instead of being done with that exam, imagine that the system would immediately let you rewrite the\n      test to try to improve your grade.\nB.    EdX, the nonprofit enterprise founded by Harvard and the Massachusetts Institute of Technology (MIT) to offer courses on\n      the Internet, has just introduced such a system and will make its automated(自的）software available free on the Web to\n      any institution that wants to use it. The software uses artificial intelligence to grade student essays and short written\n      answers, freeing professors for other tasks.\nC.    The new service will bring the educational consortium(盟)into a growing conflict over the role of automation in\n      education. Although automated grading systems for multiple-choice and true-false tests are now widespread, the use of\n      artificial intelligence technology to grade essay answers has not yet received widespread acceptance by educators and has\n      many critics.\nD.    Anant Agarwal, an electrical engineer who is president of EdX, predicted that the instant-grading software would be a\n      useful teaching tool, enabling students to take tests and write essays over and over and improve the quality of their answers.\n      He said the technology would offer distinct advantages over the traditional classroom system, where students often wait\n      days or weeks for grades. “There is a huge value in learning with instant feedback,” Dr. Agarwal said. “Students are telling\n      us they learn much better with instant feedback.”\nE.    But skeptics (怀疑者) the automated system is no match for live teachers. One longtime critic , Les Perelman, has drawn\n\n                                                                 4\n\n                                      2015 年 6 月大学英语四级考试真题(二）\n\n     national attention several times for putting together nonsense essays that have fooled software grading programs into\n     giving high marks. He has also been highly critical of studies claiming that the software compares well to human graders.\nF.   He is among a group of educators who last month began circulating a petition (呼吁) opposing automated assessment\n     software. The group, which calls itself Professionals Against Machine Scoring of Student Essays in High-Stakes\n     Assessment, has collected nearly 2,000 signatures, including some from famous people like Noam Chomsky.\nG.   “Let’s face the realities of automatic essay scoring,” the group’s statement reads in part. “Computers cannot ‘read’. They\n     cannot measure the essentials of effective written communication: accuracy, reasoning, adequacy of evidence, good sense,\n     ethical ( 伦理的) position, convincing argument, meaningful organization, and clarity, among others.\nH.   But EdX expects its software to be adopted widely by schools and universities. It offers free online classes from Harvard,\n     MIT and the University of California-Berkeley; this fall, it will add classes from Wellesley, Georgetown and the\n     University of Texas. In all, 12 universities participate in EdX, which offers certificates for course completion and has said\n     that it plans to continue to expand next year, including adding international schools.\nI.   The EdX assessment tool requires human teachers, or graders, to first grade 100 essays or essay questions. The system then\n     uses a variety of machine-learning techniques to train itself to be able to grade any number of essays or answers\n     automatically and almost instantly. The software will assign a grade depending on the scoring system created by the\n     teacher, whether it is a letter grade or numerical（数字的）rank.\nJ.   EdX is not the first to use the automated assessment technology, which dates to early computers in the 1960s. There is now\n     a range of companies offering commercial programs to grade written test answers, and four states—Louisiana, North\n     Dakota, Utah and West Virginia—are using some form of the technology in secondary schools. A fifth, Indiana, has\n     experimented with it. In some cases the software is used as a “second reader,” to check the reliability of the human graders.\nK.   But the growing influence of the EdX consortium to set standards is likely to give the technology a boost. On Tuesday,\n     Stanford announced that it would work with EdX to develop a joint educational system that will make use of the automated\n     assessment technology.\nL.   Two start-ups, Coursera and Udacity, recently founded by Stanford faculty members to create “massive open online\n     courses,” or MOOCs, are also committed to automated assessment systems because of the value of instant feedback. “It\n     allows students to get immediate feedback on their work, so that lean turns into a game, with students naturally(吸引)\n     toward resubmitting the work until they get it right,” said Daphne Roller, a computer scientist and a founder of Coursera.\nM.   Last year the Hewlett Foundation, a grant-making organization set up by one of the Hewlett- Packard founders and his wife,\n     sponsored two $100,000 prizes aimed at improving software that grades essays and short answers. More than 150 teams\n     entered each category. A winner of one of the Hewlett contests, Vik Paruchuri, was hired by EdX to help design its\n     assessment software.\nN.   “One of our focuses is to help kids learn how to think critically,” said Victor Vuchic, a program officer at the Hewlett\n     Foundation. “ It’s probably impossible to do that with multiple-choice tests. The challenge is that this requires human\n     graders, and so they cost a lot more and they take a lot more time. ”\nO.   Mark D. Shermis, a professor at the University of Akron in Ohio, supervised the Hewlett Foundation’s contest on\n     automated essay scoring and wrote a paper about the experiment. In his view, the technology—though imperfect—has a\n     place in educational settings.\nP.   With increasingly large classes, it is impossible for most teachers to give students meaningful feedback on writing\n     assignments, he said. Plus, he noted, critics of the technology have tended to come from the nation’s best universities,\n     where the level of teaching is much better than at most schools.\nQ.   Often they come from very famous institutions where, in fact, they do a much better job of providing feedback than a\n     machine ever could,” Dr. Shermis said. “ There seems to be a lack of appreciation of what is actually going on in the real\n     world.”\n\n                                                               5\n\n                                        2015 年 6 月大学英语四级考试真题(二）\n\n46.        Some professionals in education are collecting signatures to voice their opposition to automated essay grading.\n47.        Using software to grade students’ essays saves teachers time for other work.\n48.        The Hewlett contests aim at improving essay grading software.\n49.        Though the automated grading system is widely used in multiple-choice tests, automated essay grading is still\ncriticized by many educators.\n50.        Some people don’t believe the software grading system can do as good a job as human graders.\n51.        Critics of automated essay scoring do not seem to know the true realities in less famous universities.\n52.        Critics argue many important aspects of effective writing cannot be measured by computer rating programs.\n53.        As class size grows, most teachers are unable to give students valuable comments as to how to improve their writing.\n54.        The automated assessment technology is sometimes used to double check the work of human graders.\n55.        Students find instant feedback helps improve their learning considerably.\nSection C\nDirections： There are 2 passages in this 'Section. Each passage is followed by some questions or unfinished statements. For each\n               of them there are four choices marked A), B), C) and D). You should decide on the best choice and mark the\n               corresponding letter on Answer Sheet 2 with a single line through the centre.\nPassageOne\nQuestions 56 to 60 are based on the following passage.\n      The endless debate about “work-life balance ’’ often contains a hopeful footnote about stay-at- home dads. If American\nsociety and business won5t make it easier on future female leaders who choose to have children, there is still the ray of hope that\nincreasing numbers of full-time fathers will. But based on today’s socioeconomic trends, this hope is, unfortunately, misguided.\n      It’s true that the number of men who have left work to do their thing as full-time parents has doubled in a decade, but ifs still\nvery small ： only 0. 8% of married couples where the stay-at-home father was out of the labor force for a year. Even that\npercentage is likely inflated by men thrust into their caretaker role by a downsizing. This is simply not a large enough group to\nreduce the social stigma( 污 名 )and force other adjustments necessary to supporting men in this decision, even if only for a\nrelatively short time.\n      Even shorter times away from work for working fathers are already difficult. A study found that 85% of new fathers take\nsome time off after the birth of a child—but for all but a few, it’s a week or two at most. Meanwhile, the average for women who\ntake leave is more than 10 weeks.\n      Such choices impact who moves up in the organization. While you’re away, someone else is doing your work, making your\nsales, taking care of your customers. That can’t help you at work. It can only hurt you. Women, of course, face the same issues of\nreturning after a long absence. But with many more women than men choosing to leave the workforce entirely to raise families,\nreturning from an extended parental leave doesn’t raise as many eyebrows as it does for men.\n      Women would make more if they didn't break their earning trajectory (轨）by leaving the workforce, or if higher-paying\nprofessions were more family-friendly. In the foreseeable future, stay- at-home fathers may make all the difference for\nindividual families, but their presence won’t reduce the numbers of high-potential women who are forced to choose between\nfamily and career.\n56. What gives women a ray of hope to achieve work-life balance?\nA.    More men taking an extended parental leave.\nB.    Peopled changing attitudes towards family.\nC.    More women entering business management.\nD.    The improvement of their socioeconomic status.\n57. Why does the author say the hope for more full-time fathers is misguided?\nA.    Women are better at taking care of children.\n\n                                                                  6\n\n                                       2015 年 6 月大学英语四级考试真题(二）\n\nB.    Many men value work more than their family.\nC.    Their number is too small to make a difference.\nD.    Not many men have the chance to stay at home.\n58. Why do few men take a long parental leave?\nA.    A long leave will have a negative impact on their career.\nB.    They just have too many responsibilities to fulfill at work.\nC.    The economic loss will be too much for their family to bear.\nD.    They are likely to get fired if absent from work for too long.\n59. What is the most likely reaction to men returning from an extended parental leave?\nA) Jealousy.        C) Admiration.\nB) Surprise.        D) Sympathy.\n60. What does the author say about high-potential women in the not-too-distant future?\nA.    They will benefit from the trend of more fathers staying at home.\nB.    They will find high-paying professions a bit more family-friendly.\nC.    They are unlikely to break their career trajectory to raise a family.\nD.    They will still face the difficult choice between career and children.\nPassage Two\nQuestions 61 to 65 are based on the following passage.\n     Some of the world’s most significant problems never hit headlines. One example comes from agriculture. Food riots and\nhunger make news. But the trend lying behind these matters is rarely talked about. This is the decline in the growth in yields of\nsome of the world’s major crops. A new study by the University of Minnesota and McGill University in Montreal looks at where,\nand how far, this decline is occurring.\n     The authors take a vast number of data points for the four most important crops :rice, wheat, com and soyabeans (大\n豆).They find that on between 24% and 39% of all harvested areas, the improvement in yields that took place before the 1980s\nslowed down in the 1990s and 2000s.\n     There are two worrying features of the slowdown. One is that it has been particularly sharp in the world’s most     (人口\n多的）countries, India and China. Their ability to feed themselves has been an important source of relative stability both within\nthe countries and on world food markets. That self-sufficiency cannot be taken for granted if yields continue to slow down or\nreverse.\n     Second, yield growth has been lower in wheat and rice than in com and soyabeans. This is problematic because wheat and\nrice are more important as foods, accounting for around half of all calories consumed. Com and soyabeans are more important as\nfeed grains. The authors note that “we have preferentially focused our crop improvement efforts on feeding animals and cars\nrather than on crops that feed people and are the basis of food security in much of the world. ”,\n     The report qualifies the more optimistic findings of another new paper which suggests that the world will not have to dig up\na lot more land for farming in order to feed 9 billion people in 2050, as the Food and Agriculture Organisation has argued.\n     Instead, it says, thanks to slowing population growth, land currently ploughed up for crops might be able to revert (回返）\nto forest or wilderness. This could happen. The trouble is that the forecast assumes continued improvements in yields, which\nmay not actually happen.\n61. What does the author try to draw attention to?\nA) Food riots and hunger in the world.     C) The decline of the grain yield growth.\nB) News headlines in the leading media. D) The food supply in populous countries.\n62. Why does the author mention India and China in particular?\nA.    Their self-sufficiency is vital to the stability of world food markets.\n\n                                                                  7\n\n                                         2015 年 6 月大学英语四级考试真题(二）\n\nB.   Their food yields have begun to decrease sharply in recent years.\nC.   Their big populations are causing worldwide concerns.\nD.   Their food self-sufficiency has been taken for granted.\n63. What does the new study by the two universities say about recent crop improvement efforts?\nA.   They fail to produce the same remarkable results as before the 1980s.\nB.   They contribute a lot to the improvement of human food production.\nC.   They play a major role in guaranteeing the food security of the world.\nD.   They focus more on the increase of animal feed than human food grains.\n64. What does the Food and Agriculture Organisation say about world food production in the coming decades?\nA.   The growing population will greatly increase the pressure on world food supplies.\nB.   The optimistic prediction about food production should be viewed with caution.\nC.   The \"slowdown of the growth in yields of major food crops will be reversed.\nD.   The world will be able to feed its population without increasing farmland.\n65. How does the author view the argument of the Food and Agriculture Organisation?\nA.   It is built on the findings of a new study.\nB.   It is based on a doubtful assumption.\nC.   It is backed by strong evidence.\nD.   It is open to further discussion.\n\nPart IV                                              Translation                                       (30 minutes)\nDirections： For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You should write your\n             answer on Answer Sheet 2.\n据报道，今年中国快递服务（courier services)将递送大约 120 亿件包裹。这将使中国有可能超越美国成为世界上最大\n的快递市场。大多数包裹里装着网上订购的物品。中国给数百万在线零售商以极具竞 争力的价格销售商品的机会。\n仅在 11 月 11 日，中国消费者就从国内最大的购物平台购买了价值 90 亿美元的商品。中国有不少这样的特殊购物日。\n因此,快递业在中国扩展就不足为奇了。\n\n                                                               8\n"}, "2015-06-03": {"title": "2015年6月四级真题(第3套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2015-06/03", "text": "                                        2015 年 6 月大学英语六级考试真题(三）\n\n                                          2015 年 6 月大学英语四级考试真题（第 3 套)\n\nPart I        Writing                                  (30 minutes)\nDirections ： For this part, you are allowed 30 minutes to write an essay based on the picture below.\n              You should start your essay with a brief description of the picture and then comment on parents' role in their\n              children’s growth. You should write at least 120 words but no more than 180 words.\n\n                                 “Good news mom! I was accepted to the college of your choice.”\n\nPart II          Listening Comprehension (30 minutes)\nSection A\nDirections ： In this section, you will hear 8 short conversations and 2 long conversations. At the end of each conversation, one or\n                 more questions will be asked about what was said. Both the conversation and the questions will be spoken only\n                 once. After each question there will be a pause. During the pause, you must read the four choices marked A), B),\n                 C) and D), and decide which is the best answer. Then mark the corresponding letter on Answer Sheet 1 with a\n                 single line through the centre.\n1. A)       The woman is the manager's secretary.                C) The man is the manager’s business associate.\n     B)     The man found himself in a wrong place.              D)    The woman was putting up a sign on the wall.\n2. A) He needs more time for the report.                         C) He is sorry not to have helped the woman.\n     B)   He needs help to interpret the data.                   D)    He does not have sufficient data to go on.\n3. A) A friend from New York.                                    C) A postal delivery.\n     B)   A message from Tony.                                   D)    A change in the weather.\n4. A) She is not available until the end of next week.\n     B)     She is not a reliable source of information.\n     C)     She does not like taking exams.\n     D) She does not like psychology.\n5. A) He will help the woman carry the suitcase.\n     B) The woman’s watch is twenty minutes fast.\n     C) The woman shouldn’t make such a big fuss.\n     D) There is no need for the woman to be in a hurry.\n6. A) Mary is not so easygoing as her.                           C) She finds it hard to get along with Mary.\n     B) Mary and she have a lot in common.                       D)    She does not believe what her neighbors said.\n7.   A) At an information service.                             C) At a repair shop.\n\n                                                                1\n\n                                              2015 年 6 月大学英语六级考试真题(三）\n\n       B) At a car wash point.                                    D) At a dry cleaner's\n8.    A) The woman came to the concert at the man’s request.\n      B) The man is already fed up with playing the piano.\n      C) The piece of music the man played is very popular.\n      D) The man’s unique talents are the envy of many people.\n\nQuestions 9 to 12 are based on the conversation you have just heard.\n9. A) He has taught Spanish for a couple of years at a local school.\n      B) He worked at the Brownstone Company for several years.\n      C) He owned a small retail business in Michigan years ago.\n      D) He has been working part-time in a school near Detroit.\n10. A) He prefers a full-time job with more responsibility.\n      B) He is eager to find a job with an increased salary.\n      C) He likes to work in a company close to home.\n      D) He would rather get a less demanding job.\n11. A) Sports.          B) Travel.                   C) Foreign languages.            D) Computer games.\n12.        A)     When he is supposed to start work.\n         B)      What responsibilities he would have.\n         C) When he will be informed about his application.\n         D) What career opportunities her company can offer.\n\nQuestions 13 to 15 are based on the conversation you have just heard.\n13.      A) She is pregnant.                                       C)     She has just finished her project.\n         B)      She is over 50.                                   D)      She is a good saleswoman.\n14.    A) He takes good care of Lisa.                                   C)He is good at business management.\n         B) He is the CEO of a giant company.                      D)      He works as a sales manager.\n15.    A) It is in urgent need of further development.\n         B) It produces goods popular among local people.\n         C) It has been losing market share in recent years.\n         D) It is well positioned to compete with the giants.\n\nSection B\nDirections ： In this section, you will hear 3 short passages. At the end of each passage, you will hear some questions. Both the\n                   passage and the questions will be spoken only once. After you hear a question, you must choose the best answer\n                   from the four choices marked A), B),and D). Then mark the corresponding letter on Answer Sheet 1 with a single\n                   line through the centre.\nPassage One\nQuestions 16 to 19 are based on the passage you have just heard.\n16. A) It is lined with tall trees.                                 C)    It has high buildings on both sides.\n      B)        It was widened recently.                            D)     It used to be dirty and disorderly.\n17. A) They repaved it with rocks.                                  C)    They beautified it with plants.\n      B)        They built public restrooms on it.                  D)     They set up cooking facilities near it.\n18. A) What makes life enjoyable.                                   C)    What a community means.\n      B)        How to work with tools.                             D)     How to improve health.\n19. A)        They were obliged to fulfill the signed contract.\n\n                                                                    2\n\n                                             2015 年 6 月大学英语六级考试真题(三）\n\n      B)         They were encouraged by the city officials, praise.\n      C)         They wanted to prove they were as capable as boys.\n      D)        They derived happiness from the constructive work.\nPassage Two\nQuestions 20 to 22 are based on the passage you have just heard.\n20. A)          The majority of them think it less important than computers.\n      B)         Many of them consider it boring and old-fashioned.\n      C)        The majority of them find it interesting.\n      D)        Few of them read more than ten books a year.\n21. A)          Novels and stories.                                    C)   History and science books.\n      B)         Mysteries and detective stories.                  D) Books on culture and tradition.\n22. A)          Watching TV.                                           C)   Reading magazines.\n      B)         Listening to music.                                   D)   Playing computer games.\nPassage Three\nQuestions 23 to 25 are based on the passage you have just heard.\n23. A)           Advice on the purchase of cars.\n      B)         Information about the new green-fuel vehicles.\n      C)         Trends for the development of the motor car.\n      D)         Solutions to global fuel shortage.\n24. A)          Limited driving range.                                 C)   The short life of batteries.\n      B)         Huge recharging expenses.                             D)   The unaffordable high price.\n25.      A)         They need to be further improved.\n           B)     They can easily switch to natural gas.\n           C)      They are more cost-effective than vehicles powered by solar energy.\n           D) They can match conventional motor cars in performance and safety.\n\nSection C\nDirections ： In this section, you will hear a passage three times. When the passage is read for the first time, you should listen\n                    carefully for its general idea. When the passage is read for the second time，you are required to fill in the blanks\n                    with the exact words you have just heard. Finally, when the passage is read for the third time, you should check\n                    what you have written.\n       My favorite T. V. show? “ The Twilight Zone.” I                 26   like the episode called “ The Printer’s Devil. ” It’s about a\nnewspaper editor who’s being           27 out of business by a big newspaper syndicate—you know, a group of papers 28              by the\nsame people.\n      He’s about to 29 when he’s interrupted by an old man who says his name is Smith. The editor is not only offered $ 5,000\nto pay off his newspapers         30 , but this Smith character also offers his services for free. It turns out that the guy operates the\nprinting machine with amazing speed, and soon he’s turning out newspapers with 31 . The small paper is successful again. The\neditor is 32 at how quickly Smith gets his stories—only minutes after they happen—but soon he’s presented with a contract to\nsign. Mr. Smith, it seems, is really the devil! The editor is frightened by this news, but he is more frightened by the idea of losing\nhis newspaper, so he agrees to sign. But soon Smith is 33 the news even before it happens—and ifs all terrible—one disaster\nafter another. Anyway, there is a little more to tell, but I don’t want to 34 the story for you. I really like these old episodes of\n“The Twilight Zone” because the stories are fascinating. They are not realistic. But then again, in a way they are, because they\ndeal with         35   .\n\n                                                                       3\n\n                                        2015 年 6 月大学英语六级考试真题(三）\n\nPart III      Reading Comprehension             (40 minutes)\nSection A\nDirections: In this section, there is a passage with ten blanks. You are required to select one word for each blank from a list of\n              choices given in a word bank following the passage. Read the passage through carefully before making your\n              choices. Each choice in the bank is identified by a letter. Please mark the corresponding letter for each item on\n              Answer Sheet 2 with a single line through the centre. You may not use any of the words in the bank more than\n              once.\n\nQuestions 36 to 45 are based on the following passage.\n      As a teacher, you could bring the community into your classroom in many ways. The parents and grandparents of your\nstudents are resources and   36     for their children. They can be   37    teachers of their own traditions and histories. Immigrant\nparents could talk about their country of 38       and why they emigrated to the United States. Parents can be invited to talk about\ntheir jobs or a community project. Parents, of course, are not the only community resources. Employees at local businesses and\nstaff at community agencies have 39        information to share in classrooms.\n      Field trips provide another opportunity to know the community. Many students don’t have the opportunity to                  40\nconcerts or visit museums or historical sites except through field trips. A school district should have 41          for selecting and\nconducting field trips. Families must be made      42 of field trips and give permission for their children to participate.\n      Through school projects, students can learn to be      43   in community projects ranging from planting trees to cleaning up\na park to assisting elderly people. Students,     44   older ones, might conduct research on a community need that could lead to\naction by a city council or state government. Some schools require students to provide community service by         45   in a nursing\nhome, child care center or government agency. These projects help students understand their responsibility to the larger\ncommunity.\n                          A) assets                                                                   I) joining\n                          B) attend                                                                  J) naturally\n                          C) aware                                                                   K) observe\n                        D) especially                                                                 L) origin\n                        E) excellent                                                                M) recruited\n                        F) expensive                                                                N) up-to-date\n                      G) guidelines\n                                                                                                  O) volunteering\n                      H) involved\n\nSection B\nDirections ： In this section, you are going to read a passage with ten statements attached to it. Each statement contains\n              information given in one of the paragraphs. Identify the paragraph from which the information is derived. You may\n              choose a paragraph more than once. Each paragraph is marked with a letter. Answer the questions by marking the\n              corresponding letter on Answer Sheet 2.\n                                                Reaping the Rewards of Risk-Taking\nA) Since Steve Jobs resigned as chief executive of Apple, much has been said about him as a peerless business leader who has\n    created immense wealth for shareholders, and guided the design of hit products that are transforming entire industries, like\n    music and mobile communications.\nB) All true, but let’s think different, to borrow the Apple marketing slogan of years back. Let’s look at Mr. Jobs as a role model.\nC) Above all, he is an innovator (创新者）. His creative force is seen in products such as the iPod, iPhone, and iPad, and in new\n    business models for pricing and distributing music and mobile software online. Studies of innovation come to the same\n\n                                                                  4\n\n                                       2015 年 6 月大学英语六级考试真题(三）\n\n     conclusion ： you can’t engineer innovation, but you can increase the odds of it occurring. And Mr. Jobs’ career can be\n     viewed as a consistent pursuit of improving those odds, both for himself and the companies he has led. Mr. Jobs, of course,\n     has enjoyed singular success. But innovation, broadly defined, is the crucial ingredient in all economic progress—higher\n     growth for nations, more competitive products for companies, and more prosperous careers for individuals. And Mr. Jobs,\n     many experts say, exemplifies what works in the innovation game.\nD) “ We can look at and learn from Steve Jobs what the essence of American innovation is,” says John Kao, an innovation\n     consultant to corporations and governments. Many other nations, Mr. John Kao notes, are now ahead of the United States in\n     producing what are considered the raw materials of innovation. These include government financing for scientific research,\n     national policies to support emerging industries, educational achievement, engineers and scientists graduated, even the\n     speeds of Internet broadband service.\nE) Yet what other nations typically lack, Mr. Kao adds, is a social environment that encourages diversity, experimentation,\n     risk-taking, and combining skills from many fields into products that he calls “ recombinant mash-ups ( 打碎重组 ),” like\n     the iPhone, which redefined the smartphone category. “The culture of other countries doesn’t support the kind of innovation\n     that Steve Jobs exemplifies, as America does,” Mr. John Kao says.\nF)   Workers of every rank are told these days that wide-ranging curiosity and continuous learning are vital to thriving in the\n     modem economy. Formal education matters, career counselors say, but real- life experience is often even more valuable.\nG) An adopted child, growing up in Silicon Valley, Mr. Jobs displayed those traits early on. He was fascinated by electronics as\n     a child, building Heath kit do-it-yourself projects, like radios. Mr. Jobs dropped out of Reed College after only a semester\n     and traveled around India in search of spiritual enlightenment, before returning to Silicon Valley to found Apple with his\n     friend, Stephen Wozniak, an engineering wizard (奇才). Mr. Jobs was forced out of Apple in 1985, went off and founded\n     two other companies, Next and Pixar, before returning to Apple in 1996 and becoming chief executive in 1997.\nH) His path was unique, but innovation experts say the pattern of exploration is not unusual. “It’s often people like Steve Jobs\n     who can draw from a deep reservoir of diverse experiences that often generate breakthrough ideas and insights,” says Hal\n     Gregersen, a professor at the European Institute of Business Administration.\nI)   Mr. Gregersen is a co-author of a new book, The Innovator's DNA, which is based on an eight-year study of 5000(创业者）\n     and executives worldwide. His two collaborators and co--authors are Jeff Dyer, a professor at Brigham Young University,\n     and Clayton Christensen, a professor at the Harvard Business School, whose 1997 book The Innovators Dilemma\n     popularized the concept of         (颠覆性的）innovation. ”\nJ)   The academics identify five traits that are common to the disruptive innovators: questioning, experimenting, observing,\n     associating and networking. Their bundle of characteristics echoes the ceaseless curiosity and willingness to take risks noted\n     by other experts. Networking, Mr. Hal Gregersen explains, is less about career-building relationships than a consistent\n     search for new ideas. Associating, he adds, is the ability to make idea-producing connections by linking concepts from\n     different disciplines.\nK) “Innovators engage in these mental activities regularly,” Mr. Gregersen says. “It’s a habit for them Innovative companies,\n     according to the authors, typically enjoy higher valuations in the stock market, which they call an “innovation premium (溢\n     价）.” It is calculated by estimating the share of a company’s value that cannot be accounted for by its current products and\n     cash flow. The innovation premium tries to quantify(量化)investors’ bets that a company will do even better in the future\n     because of innovation.\nL) Apple, by their calculations, had a 37 percent innovation premium during Mr. Jobs’ first term with the company. His years in\n     exile resulted in a 31 percent innovation discount. After his return, Applet fortunes improved gradually at first, and improved\n     markedly starting in 2005, yielding a 52 percent innovation premium since then.\nM) There is no conclusive proof, but Mr. Hal Gregersen says it is unlikely that Mr. Jobs could have reshaped industries beyond\n     computing, as he has done in his second term at Apple, without the experience outside the company, especially at Pixar—the\n     computer-animation (动画制作）studio that created a string of critically and commercially successful movies, such as “Toy\n\n                                                                5\n\n                                        2015 年 6 月大学英语六级考试真题(三）\n\n     Story” and “Up.”\nN) Mr. Jobs suggested much the same thing during a commencement address to the graduating class at Stanford University in\n     2005. “It turned out that getting fired from Apple was the best thing that could have ever happened to me,” he told the\n     students. Mr. Jobs also spoke of perseverance (坚持）and will power. “Sometimes life hits you in the head with a brick,” he\n     said. “Don’t lose faith. ”\nO) Mr. Jobs ended his commencement talk with a call to innovation, both in one’s choice of work and in one’s life. Be curious,\n     experiment, take risks, he said to the students. His advice was emphasized by the words on the back of the final edition of\n     The Whole Earth Catalog, which he quoted Stay hungry. Stay foolish. ” “And, Mr. Jobs said, “I have always wished that for\n     myself. And now, as you graduate to begin anew, I wish that for you.\n\n46. Steve Jobs called on Stanford graduates to innovate in his commencement address.\n47. Steve Jobs considered himself lucky to have been fired once by Apple.\n48.Steve Jobs once used computers to make movies that were commercial hits.\n49. Many governments have done more than the US government in providing the raw materials for innovation.\n50. Great innovators are good at connecting concepts from various academic fields.\n51. Innovation is vital to driving economic progress.\n52. America has a social environment that is particularly favorable to innovation.\n53. Innovative ideas often come from diverse experiences.\n54. Real-life experience is often more important than formal education for career success.\n55. Applet fortunes suffered from an innovation discount during Jobs’ absence.\n\nSection C\nDirections ： There are 2 -passages in this section. Each passage is followed by some questions or unfinished statements. For each\n                 of them there are four choices marked A), B), C) and D) . You should decide on the best choice and mark the\n                 corresponding letter on Answer Sheet 2 with a single line through the centre.\nPassage One\nQuestions 56 to 60 are based on the following passage.\n     Junk food is everywhere. We’re eating way too much of it. Most of us know what we’re doing and yet we do it anyway.\n     So here’s a suggestion offered by two researchers at the Rand Corporation : Why not take a lesson from alcohol control\npolicies and apply them to where food is sold and how it’s displayed?\n
