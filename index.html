 in emotional intelligence.\n\n    53. What does the finding of Myriam Bechtoldt's study indicate?\n        A) Greater emotional cleverness means less trouble in one's life.\n        B) Emotional intelligence helps people succeed in job interviews.\n        C) People's psychological wellbeing is related to various factors.\n        D) People may suffer from having a high emotional intelligence.\n\n    54. What do we learn about emotional intelligence from a number of studies?\n        A) People suffering from depression are emotionally immature.\n        B) People who look at the dark side of life often feel depressed.\n        C) Some people may take advantage of it and benefit themselves.\n        D) Some people may lack it and are easily manipulated by others.\n\n    55. What does the author suggest sensitive individuals do?\n        A) Avoid burdening themselves with others' feelings.\n        B) Rid themselves of worries over worldly affairs.\n        C) Learn to cope with people's negative feelings.\n        D) Help people to deal with their troubles in life.\n\n    Part IV                                      Translation                                       ( 30 minutes)\n    Directions: For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You\n    should write your answer on Answer Sheet 2.\n\n         在中国农历中，立秋(Start of Autumn)意味着夏天的结束和秋天的开始。立秋带来的首先是天\n    气的变化，气温逐渐下降。人们看到树叶开始变黄飘落时，知道秋天已经来临，这就是所谓的“一\n    叶知秋”。但此时酷热的天气并未完全结束，高温通常还会持续一段时间，被称为“秋老虎”。立秋\n    对农民意义重大，这时各种秋季作物迅速生长、开始成熟，收获的季节即将到来。\n\n9                                                                               https://zhenti.burningvocabulary.com/"}, "2022-12-02": {"title": "2022年12月四级真题(第2套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2022-12/02", "text": "                2022 年 12 月大学英语四级考试真题（第 2 套）\n\n    Part I                                          Writing                                           ( 30 minutes)\n    Directions: In this task, you are to write an essay on the importance of developing a healthy lifestyle among\n    college students. You will have 30 minutes for the task. You should write at least 120 words but no more than\n    180 words.\n\n    Part II                               Listening Comprehension                                     ( 25 minutes)\n    Section A\n    Directions: In this section, you will hear three news reports. At the end of each news report, you will hear two\n    or three questions. Both the news report and the questions will be spoken only once. After you hear a question,\n    you must choose the best answer from the four choices marked A), B), C) and D). Then mark the\n    corresponding letter on Answer Sheet 1 with a singles line through the centre.\n    Questions 1 and 2 are based on the news report you have just heard.\n    1. A) A free car show.                                       C) A sports competition.\n       B) A yearly concert.                                      D) A pipe band contest.\n    2. A) Improve the image of Glasgow city.                     C) Contribute a lot to the local economy.\n       B) Enrich the local culture of Glasgow.                   D) Entertain people in local communities.\n    Questions 3 and 4 are based on the news report you have just heard.\n    3. A) Surprising rise in global sea levels.                  C) Changing weather patterns in summer.\n       B) Dangerous ice melts in Greenland.                      D) Record growth of Greenland's ice sheets.\n\n    4. A) It began in late May.                                  C) It started a month earlier than usual.\n       B) It lasted three months.                                D) It ended a month earlier than before.\n    Questions 5 to 7 are based on the news report you have just heard.\n    5. A) Bundles of £20 notes kept turning up.\n       B) A villager was searching for his lost cash.\n       C) Local policemen came across bundles of £20 notes.\n       D) A bundle containing thousands of pounds got stolen.\n\n    6. A) They give it to charity.                               C) They hand it over to the local government.\n       B) They return it to the finder.                          D) They place a notice in The Northern Echo.\n\n    7. A) They cooperated well with the police.                  C) They were puzzled by the mystery.\n       B) They enjoyed a fairly affluent life.                   D) They had a strong community spirit.\n\n1                                                                                  https://zhenti.burningvocabulary.com/\n\n    Section B\n    Directions: In this section, you will hear two long conversations. At the end of each conversation, you will\n    hear four questions. Both the conversation and the questions will be spoken only once. After you hear a\n    question, you must choose the best answer from the four choices marked A), B), C) and D). Then mark the\n    corresponding letter on Answer Sheet 1 with a single line through the centre.\n    Questions 8 to 11 are based on the conversation you have just heard.\n    8. A) Excited.                                              C) Indifferent.\n       B) Delighted.                                            D) Strange.\n    9. A) Search for the meaning of their life.                 C) Call on their relatives and friends.\n       B) Look back on their years at school.                   D) Talk about future plans with friends.\n\n    10. A) He prefers to have them shown on social media.\n       B) He loves them but does not want to make a fuss.\n       C) He enjoys celebrating others' birthdays rather than his own.\n       D) He looks forward to receiving presents from his close friends.\n\n    11. A) Hold it on a modest scale to remove birthday anxieties.\n       B) View it as a chance for people to socialize and have fun.\n       C) Extend invitation to those he trusts most.\n       D) Make it an occasion to collect donations.\n    Questions 12 to 15 are based on the conversation you have just heard.\n    12. A) It was absolutely exhausting.                    C) There was too long a delay.\n       B) There was a terrible smell.                       D) She got off at the wrong station.\n\n    13. A) She hasn't saved enough money.                   C) She hasn't passed the driving test yet.\n       B) She is worried about traffic jams.                D) She is used to taking public transport.\n\n    14. A) They are popular.                                C) They are a bit expensive for her.\n       B) They are dangerous.                               D) They are environmentally friendly.\n\n    15. A) By bus.                                          C) By renting a bike.\n       B) By jogging.                                       D) By sharing a ride.\n\n    Section C\n    Directions: In this section, you will hear three passages. At the end of each passage, you will hear three or\n    four questions. Both the passage and the questions will be spoken only once. After you hear a question, you\n    must choose the best answer from the four choices marked A), B), C) and D). Then mark the corresponding\n    letter on Answer Sheet 1 with a single line through the centre.\n\n2                                                                                 https://zhenti.burningvocabulary.com/\n\n    Questions 16 to 18 are based on the passage you have just heard.\n    16. A) He is a sign language interpreter.                   C) He doesn't like speaking at meetings.\n       B) He is a deaf person working in IT.                    D) He doesn't use email or text messages.\n    17. A) Improved communication skills.                       C) Big advances in sign language.\n       B) Speech recognition technology.                        D) Transformation in the IT industry.\n\n    18. A) He can avoid being mistaken.                         C) He can understand with ease.\n       B) He can take notes on the spot.                        D) He can see the speakers' images.\n    Questions 19 to 21 are based on the passage you have just heard.\n    19. A) To find pure white walls shining.                 C) To get a hug from family members.\n       B) To enter a house well looked after.                D) To see cheerful colours all around.\n\n    20. A) Choosing a colour because it is fashionable.\n       B) Painting the interior of their cupboards.\n       C) Doing the painting job all by themselves.\n       D) Designing all window frames the same way.\n\n    21. A) Fit most of the cupboards into walls.\n       B) Hang landscape paintings all around.\n       C) Match the room's ceiling with all the furniture in colour.\n       D) Paint the wooden frameworks and walls the same colour.\n    Questions 22 to 25 are based on the passage you have just heard.\n    22. A) Children must read at least 3 times a week.\n       B) Reading is a habit every child can develop.\n       C) Reading to their children is important.\n       D) Children should start reading at age 3.\n\n    23. A) The number of books they have read by age four.\n       B) The speed of their brain development in infancy.\n       C) The number and quality of books parents read to them in infancy.\n       D) The quality and quantity of time parents spend playing with them.\n    24. A) Books with specifically labeled images.              C) Books describing the lives of animals.\n       B) Books with pictures of dolls and toys.                D) Books telling very interesting stories.\n\n    25. A) Read as many books as possible to their children.\n       B) Choose carefully what to read to their children.\n       C) Share experience with other parents.\n       D) Create picture books for their children.\n\n3                                                                                https://zhenti.burningvocabulary.com/\n\n    Part III                             Reading Comprehension                                          ( 40 minutes)\n    Section A\n    Directions: In this section, there is a passage with ten blanks. You are required to select one word for each\n    blank from a list of choices given in a word bank following the passage. Read the passage through carefully\n    before making your choices. Each choice in the bank is identified by a letter. Please mark the corresponding\n    letter for each item on Answer Sheet 2 with a single line through the centre. You may not use any of the words\n    in the bank more than once.\n\n         Parenting brings fathers more joy than it does mothers, according to a new study. The research\n    examined three studies       26    more than 18,000 participants. Across all three, parenthood was                  27\n    with more positive wellbeing outcomes for dads than for mums.\n         So why are fathers happier than mothers? \"Fathers may fare better than mothers in part due to how\n    they spend time with their children,\" said lead author Katherine Nelson-Coffey. In one study, the authors\n    28      that dads were more likely to take \"playing\" as an       29       activity both when caring for their kids\n    and spending time with their kids. \"Playing with their children likely offers parents opportunities to\n    experience positive feelings and    30    closeness with their children,\" they say.\n         Fathers also did better than men without kids, reporting greater happiness, life satisfaction, and\n    fewer      31    symptoms. They also reported greater connectedness and autonomy (自主). For mums,\n    32    , compared to women without children, the results weren't quite as positive. Mums reported greater\n    autonomy, but also \"greater trouble\" and fewer positive       33      .\n         Mums reported happier moods while interacting with their kids, compared to other experiences, but\n    not while engaging      34    in childcare. \"This difference suggests that how mothers and fathers spend\n    time with their children might have important          35       for their wellbeing,\" the authors write. They\n    suspect that mums may be less happy than dads because they're more likely to have higher expectations\n    about parenthood. As such, they're more likely to be \"let down\" by the experience.\n\n                       A) additional              F) directly                    K) involving\n                       B) associated              G) emotions                    L) note\n                       C) composing               H) however                     M) precisely\n                       D) cultivate               I) implications                N) superficial\n                       E) depressive              J) interfered                  O) therefore\n\n    Section B\n    Directions: In this section, you are going to read a passage with ten statements attached to it. Each statement\n    contains information given in one of the paragraphs. Identify the paragraph from which the information is\n    derived. You may choose a paragraph more than once. Each paragraph is marked with a letter. Answer the\n    questions by marking the corresponding letter on Answer Sheet 2.\n\n4                                                                                      https://zhenti.burningvocabulary.com/\n\n                                                 Learning to say no\n    A) Not doing something will always be faster than doing it. This philosophy applies in many areas of\n         life. For example, there is no meeting that goes faster than not having a meeting at all. This is not to\n         say you should never attend another meeting, but the truth is that we say \"yes\" to too many things we\n         don't actually want to do.\n    B) How often do people ask you to do something and you just reply, \"Sure.\" Three days later, you're\n         overwhelmed by how much is on your to-do list. We become frustrated by our obligations even\n         though we were the ones who said \"yes\" to them in the first place. Even worse, people will\n         occasionally fight to do things that waste time. You don't have to do something just because it exists.\n         It's worth asking if things are necessary. Many of them are not, and a simple \"no\" will be more\n         productive than whatever work the most efficient person can cope with. But if the benefits of saying\n         \"no\" are so obvious, then why do we say \"yes\" so often?\n    C) We say \"yes\" to many requests not because we want to do them, but because we don't want to be\n         seen as rude or unhelpful. Often, we have to consider saying \"no\" to someone we will interact with\n         again in the future — our co-worker, our spouse, our family and friends. Saying \"no\" to our superiors\n         at work can be particularly difficult. In these situations, I like the approach recommended in\n         Essentialism by Greg McKeown. He writes, \"Remind your superiors what you would be neglecting\n         if you said 'yes' and force them to deal with the trade-off. For example, if your manager comes to you\n         and asks you to do X, you can respond with 'Yes, I'm happy to make this the priority. Which of these\n         other projects should I deprioritize to pay attention to this new project?' \"\n    D) Collaborating with others is an important element of life. The thought of straining the relationship\n         outweighs the commitment of our time and energy. For this reason, it can be helpful to be gracious in\n         your response. Do whatever favors you can, and be warm-hearted and direct when you have to say\n         no. But even after we have accounted for these social considerations, many of us still seem to do a\n         poor job of managing the trade-off between yes and no. We find ourselves over-committed to things\n         that don't meaningfully improve or support those around us, and certainly don't improve our own\n         lives.\n    E) Perhaps one issue is how we think about the meaning of yes and no. The words \"yes\" and \"no\" get so\n         often used in comparison with each other that it feels like they carry equal weight in conversation. In\n         reality, they're not just opposite in meaning, but of entirely different magnitudes in commitment.\n         When you say \"no\", you're only saying \"no\" to one option. When you say \"yes\", you're saying \"no\"\n         to every other option. I like how economist Tim Harford put it, \"Every time we say 'yes' to a request,\n         we're also saying 'no' to anything else we might accomplish with the time.\" Once you're committed\n         to something, you've already decided how that future block of time will be spent. In other words,\n         saying \"no\" saves you time in the future. Saying \"yes\" costs you time in the future. \"No\" is a form of\n         time credit. You retain the ability to spend your future time however you want. \"Yes\" is a form of\n         time debt. You have to pay back your commitment at some point.\n    F)   \"No\" is a decision. \"Yes\" is a responsibility. Saying \"no\" is sometimes seen as a luxury that only\n         those in power can afford. And it's true: turning down opportunities is easier when you can fall back\n\n5                                                                                  https://zhenti.burningvocabulary.com/\n\n         on the safety net provided by power, money, and authority. But it's also true that saying \"no\" is not\n         merely a privilege reserved for the successful. It's also a strategy that can help you become\n         successful. Saying \"no\" is an important skill to develop at any stage of your career because it retains\n         the most important asset in life: your time. As investor Pedro Sorrentino put it, \"If you don't guard\n         your time, people will steal it from you.\" You need to say \"no\" to whatever isn't leading you toward\n         your goals.\n    G) Nobody embodied this idea better than Steve Jobs, who said, \"People think focus means saying 'yes'\n         to the thing you've got to focus on. But that's not what it means at all. It means saying 'no' to the\n         hundred other good ideas that there are. You have to pick carefully.\" Jobs had another great quote\n         about saying \"no\": \"I'm actually as proud of the things we haven't done as the things I have done.\n         Innovation is saying 'no' to 1,000 things.\"\n    H) Over time, as you continue to improve and succeed, your strategy needs to change. The opportunity\n         cost of your time increases as you become more successful. At first, you just eliminate the obvious\n         distractions and explore the rest. As your skills improve and you learn to separate what works from\n         what doesn't, you have to continually increase your threshold for saying \"yes\". You still need to say\n         \"no\" to distractions, but you also need to learn to say \"no\" to opportunities that were previously good\n         uses of time, so you can make space for better uses of time. It's a good problem to have, but it can be\n         a tough skill to master.\n    I)   What is true about health is also true about productivity: an ounce of prevention is worth a pound of\n         cure. More effort is wasted doing things that don't matter than is wasted doing things inefficiently.\n         And if that is the case, elimination is a more useful skill than optimization. I'm reminded of the\n         famous Peter Drucker quote, \"There is nothing so useless as doing efficiently that which should not\n         be done at all.\"\n\n    36. People often grant a request just because they want to appear polite and helpful.\n    37. It's no easy job learning to say \"no\" to opportunities that were once considered worth grasping.\n    38. When you decline a request, you are saving your future time.\n    39. People sometimes struggle to do things that are simply a waste of time.\n    40. Doing efficiently what is not worth doing is the most useless effort.\n    41. It is especially difficult for people to decline to do what their superiors ask them to do.\n    42. People agree to do too many things they are in fact unwilling to do.\n    43. According to one famous entrepreneur, innovation means refusal to do an enormous number of things.\n    44. It is an essential aspect of life to cooperate with other people.\n    45. Refusing a request is sometimes seen as a privilege not enjoyed by ordinary people.\n\n    Section C\n    Directions: There are 2 passages in this section. Each passage is followed by some questions or unfinished\n    statements. For each of them there are four choices marked A), B), C) and D). You should decide on the best\n    choice and mark the corresponding letter on Answer Sheet 2 with a single line through the centre.\n6                                                                                   https://zhenti.burningvocabulary.com/\n\n    Passage One\n    Questions 46 to 50 are based on the following passage.\n        We're eating more fish than ever these days. At around 20 kilograms per person global fish\n    consumption is now more than twice what it was in the 1960s. What's really remarkable, though, is where\n    that fish comes from.\n        For the first time in human history, most of our aquatic (水产的) food now comes from farming\n    rather than fishing.\n        People ate around 73 million tonnes of farmed fish — just more than half of the volume of fish that\n    humans consumed — in 2014. That's out of a total fish supply of 167 million tonnes; the remaining 20\n    million or so tonnes go into things like animal feed and medical products.\n        To keep eating fish at the current rate, we're definitely going to need to keep aquaculture (水产养殖)\n    developing. That's because the volume of fish caught in the wild has leveled off since the 1990s.\n        Back in 1974, only 10% of marine fish stocks had been overfished. Now, more than three-tenths are.\n    Only a tenth of our oceans' fish stocks could sustain heavier fishing than current levels.\n        But while catchings at sea have suffered, fish-farming has been growing at a fast rate. A lot of that is\n    coming from China, which produces 60% of the world's farmed fish. In fact, some 35 countries, including\n    China, now produce more farmed than wild-caught fish.\n        This shift toward aquaculture isn't just good for ensuring salmon (三文鱼) on your plate; it's also\n    crucial to ensuring food security and sustainability. By 2050, the world will need to feed an estimated 9.7\n    billion people. They'll have to get their protein somewhere. However, raising cattle, pigs, and other land-\n    based animals requires vast sums of grain and water. For example, pound for pound, beef requires 15\n    times more feed to raise than carp, a freshwater fish farmed all over Asia. That grain — and the water\n    needed to grow it — could be consumed by people instead.\n        However, aquaculture is no silver bullet. In some southeast Asian countries, shrimp farming does\n    disastrous damage to marine ecosystems. Despite these problems, however, shrimp continues to be\n    among the most popular seafoods worldwide.\n\n    46. What does the author say is remarkable about the fish we eat?\n        A) They reproduce quickly.                               C) They have become as important as grain.\n        B) They are mostly farmed.                                D) They have a longer history than humans.\n\n    47. What do we need to do if we keep consuming fish at the current rate?\n        A) Increase the fishing volume considerably.\n        B) Develop more advanced fishing technology.\n        C) Enlarge the marine fish stocks effectively.\n         D) Expand the scale of fish-farming continuously.\n\n    48. What does the author say about China in terms of aquatic food?\n        A) It places increasing emphasis on fishing now.\n        B) It boasts of the world's largest fishing stocks.\n\n7                                                                                 https://zhenti.burningvocabulary.com/\n\n        C) It raises more fish than caught from the wild.\n         D) It supplies 60% of the world's fish products.\n    49. Why does the author say aquaculture is so important these days?\n        A) It is a must for feeding the world's fast-growing population.\n        B) It proves a reliable source of protein for humans and animals.\n        C) It is essential to maintaining both mental and physical health.\n         D) It ensures a balanced healthy diet for people the world over.\n\n    50. What does the author imply by saying aquaculture is no silver bullet?\n        A) Shrimp-farming is a risky business.\n        B) Fish-farming will not be sustainable.\n        C) Fish-farming may cause serious problems too.\n         D) Shrimp-farming can become quite expensive.\n\n    Passage Two\n    Questions 51 to 55 are based on the following passage.\n        In 2020, the Nobel Peace Prize was awarded to the World Food Programme (WFP).\n        Why a Nobel Prize for the WFP, and why now? In 2019, the WFP assisted nearly 100 million people\n    in 88 countries. It is the safety net for those who fall off the edge of existence. It is a response to solving\n    the problem of food instability. Its Nobel Prize reminds us all of the moral hazard in imagining that the\n    poor and vulnerable are somebody else's problem.\n        The WFP has been around since 1961 and has been the global coordinator of nationally based efforts\n    to avoid disasters with food aid. Despite decades of effort to eliminate hunger, the latest estimate is that\n    about 11% of people on the planet (about 820 million people) are suffering daily undernourishment.\n    Progress at reducing undernourishment has stopped despite gains through the 1990s and 2000s.\n        Developed countries sometimes offer food and aid to developing ones, but at a price. One American\n    philosopher stated that addressing the needs of the poor and vulnerable is about more than money — it is\n    mostly about creating conditions under which prosperity and opportunity can thrive. When aid is offered\n    with heavy conditions attached, like loan repayment or food for resources, it often widens the gap\n    between rich and poor and sustains the old world order. This is why the work of the WFP is so vital.\n        The scientific community, however, can provide a helping hand to the WFP. By sharing knowledge\n    of agriculture and climate with peers in countries most vulnerable to poverty and hunger, scientists can\n    help reduce these problems. By making its voice heard, science can lead by example. The ability to\n    overcome food shortages that must be built into some of the poorest countries will not come from loans\n    from wealthy countries, which may have food problems of their own, or world economic institutions.\n    This ability will be built upon self-confident people using open and shared scientific knowledge to pull\n    themselves out of their misery.\n\n8                                                                                  https://zhenti.burningvocabulary.com/\n\n    51. What does the WFP's winning of the Nobel Peace Prize make us realize?\n        A) More and more people in the world are suffering from starvation.\n        B) All of us can be affected by food instability one way or another.\n        C) It is hazardous to leave millions of people poor and vulnerable.\n        D) It is morally wrong to think helping the poor is not our business.\n\n    52. What do we learn about the WFP's effort to eliminate hunger?\n        A) It has ensured a sufficient food supply to millions.\n        B) It is still far from its goal despite the progress made.\n        C) It has done a good job in combating natural disasters.\n        D) It is preventing starvation occurring on a global scale.\n\n    53. What will happen when food aid is offered at a price?\n        A) The rich will become richer and the poor poorer.\n        B) More people will be willing to join in the effort.\n        C) More food will be made available to the needy.\n        D) The relief effort will be rendered less sustainable.\n\n    54. How can scientists help cope with poverty and hunger?\n        A) By collaborating closely with world economic institutions.\n        B) By sharing expertise with peers in poverty-stricken nations.\n        C) By setting up more food research programs in developing countries.\n        D) By building self-respect in people suffering from undernutrition.\n    55. What message does the author try to convey at the end of the passage?\n        A) Wealthy nations should solve their own food problems first.\n        B) Rich countries should be more generous in providing food aid.\n        C) Poor nations should enhance their own ability to solve their food shortages.\n        D) World economic institutions should play a bigger role in fighting hunger.\n\n    Part IV                                       Translation                                      ( 30 minutes)\n    Directions: For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You\n    should write your answer on Answer Sheet 2.\n\n         立春 (Start of Spring) 在中国农历中表示春天的开始。立春之后，白天变得更长，天气也愈发\n    温暖，万物开始复苏，大地充满生机。人们常说“一年之计在于春”，农民在这个时节开始播种，\n    为全年的丰收打下基础。中国人早在三千年前就已开始在立春这一天举行庆祝活动。数百年来，\n    迎春一直是民间的重要习俗。在春暖花开的日子里，人们常常外出游玩，欣赏春天的美景。\n\n9                                                                               https://zhenti.burningvocabulary.com/"}, "2022-12-03": {"title": "2022年12月四级真题(第3套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2022-12/03", "text": "                    2022 年 12 月大学英语四级考试真题（第 3 套）\n\n    Part I                                          Writing                                              ( 30 minutes)\n    Directions: In this task, you are to write an essay on the necessity of developing social skills for college\n    students. You will have 30 minutes for the task. You should write at least 120 words but no more than 180\n    words.\n\n    Part II                                  Listening Comprehension                                     ( 25 minutes)\n\n    提示：2022 年 12 月本套听力内容与第一二套相同，故而未重复显示。\n\n    Part III                                 Reading Comprehension                                      ( 40 minutes)\n    Section A\n    Directions: In this section, there is a passage with ten blanks. You are required to select one word for each\n    blank from a list of choices given in a word bank following the passage. Read the passage through carefully\n    before making your choices. Each choice in the bank is identified by a letter. Please mark the corresponding\n    letter for each item on Answer Sheet 2 with a single line through the centre. You may not use any of the words\n    in the bank more than once.\n\n           Phones influence all aspects of teenage life. Ninety-five percent of Americans ages 13 to 17 have a\n    smartphone or have access to one, and nearly half report using the internet \"almost          26     .\"\n           But as recent survey data and interviews have suggested, many teens find much of that time to be\n    unsatisfyingly spent. Continuous        27     shouldn't be mistaken for endless enjoyment. A new                  28\n    representative survey about \"screen time and device distractions\" from the Pew Research Center\n    indicates that it's not just parents who think teenagers are worryingly      29      from their phones — many\n    teens themselves do too. Fifty-four percent of the 13-to-17-year-olds surveyed said they spend too much\n    time       30    in their phones.\n           Vicky Rideout, who runs a research firm that studies children's interactions with media and\n    technology, was not surprised by this finding. She says it's hardly     31    to teenagers. \"They are dealing\n    with the same challenges that adults are, as far as they are living in the         32      of a tech environment\n    designed to suck as much of their time onto their devices as possible,\" Rideout says.\n           The way parents interact with technology can     33    the way they interact with their kids. Rideout\n    thus thinks it's up to parents to model good    34    : Kids tend to take note if their parents put their phone\n    away at dinner or charge it in another room while they sleep. Witnessing habits like that can help kids\n    \"realize that they can    35    some more control over their devices,\" she says.\n\n1                                                                                     https://zhenti.burningvocabulary.com/\n\n                      A) absorbed                 F) exercise               K) solution\n                      B) addicted                 G) inseparable            L) specific\n                      C) behavior                 H) nationally             M) summary\n                      D) constantly               I) recruited              N) usage\n                      E) context                  J) shape                  O) vaguely\n\n    Section B\n    Directions: In this section, you are going to read a passage with ten statements attached to it. Each statement\n    contains information given in one of the paragraphs. Identify the paragraph from which the information is\n    derived. You may choose a paragraph more than once. Each paragraph is marked with a letter. Answer the\n    questions by marking the corresponding letter on Answer Sheet 2.\n                                                    Evil Genius\n    A) A few years ago I found myself teaching a university class on evil. It was for third-year criminology\n         students to help them contextualize theory and research within controversial current topics. It was a\n         huge success. The debates were heated and interesting. I could see people's views change within the\n         course of a single lecture. Over the past 13 years, as a student, lecturer and researcher, I've enjoyed\n         discussing the science of evil with anyone willing to listen. What I like most is destroying the cliché\n         (陈词滥调) of good and evil, and replacing them with scientific insight. We need a more informed\n         way of discussing behavior that at first we cannot, or should not, begin to understand.\n    B) Without understanding, we risk dehumanizing others, writing off human beings simply because we\n         don't comprehend them. We must try to understand what we have labeled evil. We tend to think evil\n         is something that other people are. We think of ourselves as \"good people\", and even when we do\n         morally wrong things, we understand the context of our decisions. With others, however, it is far\n         easier to write them off. If their actions deviate ( 偏 离 ) substantially from what we consider\n         acceptable, we may label them evil. We need to be careful with this. Calling someone evil is often\n         similar to saying they cannot change, and perhaps aren't even a human at all. However, when you\n         actually go monster-hunting, and you look deeply at the people behind shocking behavior, you may\n         be surprised.\n    C) As a child I used to love the Scooby-Doo cartoons. Arriving in their \"Mystery Machine\", the gang\n         would have to find a monster who was terrorizing a neighborhood. They would run around looking\n         for clues and at the end unmask the bad guy. It was always a normal person in a costume. There were\n         no monsters. Like the Scooby crew, we may find ourselves hunting for an easy fix, one word for\n         people who do bad things. But if we take a good look, the word 'evil' is insufficient — there are no\n         simple explanations for why humans do bad things: instead there are many, and they are all\n         marvelously different.\n    D) Evil is typically referred to when there is deviance from social norms: formal deviance is the\n         violation of laws, like theft, murder, and attacks, while informal deviance involves violations of\n\n2                                                                                  https://zhenti.burningvocabulary.com/\n\n         social norms, like lying. Evil behavior is typically thought to embrace one or both forms. However,\n         deviance can also describe a behavior that simply differs from the norm.\n    E) Perhaps this is where we can find the good side of our bad side. Deviating from the norm can make\n         us villains (恶棍), but it can also make us heroes. A child deviates from social pressures when they\n         stand up for another child being bullied in school. A soldier deviates when they choose not to follow\n         orders to kill an innocent civilian. An employee in a big tech company deviates when they expose its\n         wrongdoings.\n    F)   Creativity is also a deviation. Here, too, things are complex. Thinking creatively has given us\n         modern medicine, technology and modern political structures, but it has also given us poison and\n         nuclear weapons. Great benefit and great harm can come from the same human tendency.\n    G) In a research paper, Evil Genius, published in 2014, the behavioral scientists Francesca Gino and\n         Scott Wiltermuth wanted to examine whether people who behave unethically in one task are more\n         creative than others on a subsequent task, even after controlling for differences in baseline creative\n         skills. The unethical behavior they chose was dishonesty.\n    H) Over five experiments researchers gave participants tasks in which they could cheat. In one study,\n         they were given matrixes (矩阵) and had to find two numbers that added up to 10. Participants were\n         asked to self-report how well they did at the end of the study: 59% cheated by saying that they\n         solved more matrixes than they actually had.\n    I)   After each task, the researchers measured participants' performance on the Remote Associates Test.\n         This shows participants three words at a time that appear to be unrelated, and the person has to think\n         of a fourth word that is associated with all of them. For example, you might get \"Fox, Man, Peep\", or\n         \"Dust, Cereal, Fish\". In order to find the linking words (\"Hole\" for the first, \"Bowl\" for the second)\n         you need to be creative. The more you get right, the more creative you are thought to be because you\n         have come up with uncommon associations.\n    J)   For every one of the five studies, they found the same thing — participants who cheated in the first\n         task did better on the creativity task. Why? Like other forms of unethical behavior, lying means\n         breaking rules. It involves being deviant, going against the social principle that people should tell the\n         truth. Similarly, being creative involves \"thinking outside the box \", deviating from expectations.\n         They involve similar thought patterns, so stimulating one stimulates the other. Can we learn from\n         this? Perhaps. To be more creative, we could try lying in a controlled environment. Find online logic\n         games and cheat at them, play Scrabble ( 拼 字 游 戏 ) with a dictionary, or write a story about\n         something that is untrue? Such tasks can get our brains thinking flexibly, beyond our normal comfort\n         zone. This is not a call to become a compulsive (强迫性的) liar, but a controlled liar.\n    K) In addition to benefits for creativity, deviance can be a good thing in other ways. Even Philip\n         Zimbardo, the author of the Stanford prison experiment, who showed how easily we can be led to\n         behave badly, believes that the future of deviance research may lie more in understanding extreme\n         pro-social behavior, such as heroism. Like evil, we often view heroism as only a possibility for\n         outliers — for people who are abnormal. But Zimbardo asks: \"What if the capability to act heroically\n         is also fundamentally ordinary and available to all of us?\" Some say we should never meet our\n\n3                                                                                 https://zhenti.burningvocabulary.com/\n\n         heroes, lest they disappoint us when we find out how normal they are. But this should be liberating,\n         not disappointing. We are all capable of behaving like outliers. It's time for us to understand\n         deviance, and realize its potential for good as well as for harm.\n\n    36. A behavior that does not conform to social norms may be described as being deviant.\n    37. Various experiments found that participants who cheated in the initial task performed better in the\n       creativity test.\n    38. People may be simply considered evil if their behaviors are morally unacceptable to us.\n    39. The research published by two scientists was intended to examine the relationship between\n       dishonesty and creativity.\n    40. The author's lectures sparked lively discussions in his class.\n    41. The researchers tested the participants' creativity by asking them to play a word game.\n    42. It is time we realized that deviance may be capable of doing both good and harm to individuals and\n       society.\n    43. The reasons for people's evil behaviors can be explained in more ways than one.\n    44. The math task in one experiment was designed to test participants' tendency to cheat.\n    45. Some creative ideas have turned out to do harm to human society.\n\n    Section C\n    Directions: There are 2 passages in this section. Each passage is followed by some questions or unfinished\n    statements. For each of them there are four choices marked A), B), C) and D). You should decide on the best\n    choice and mark the corresponding letter on Answer Sheet 2 with a single line through the centre.\n\n    Passage One\n    Questions 46 to 50 are based on the following passage.\n\n        Even though we are living in an age where growing old is thought of as an inevitable misery, this\n    doctor has been changing the game for seniors over the last 25 years.\n        It all started in 1991 when the Harvard-educated physician was transferred from working in a\n    stressful emergency room to being the medical director of a nursing home in upstate New York. The\n    depressing and regimented (严格管制的) environment got him thinking on what exactly could improve\n    the residents' conditions.\n        Even though animals in nursing homes were illegal at the time, Dr. Bill Thomas took a chance.\n    Based on a hunch (直觉), he brought in two dogs, four cats, hens, rabbits, 100 birds, a multitude of plants,\n    a flower garden, and a vegetable patch.\n        The change was dramatic. There was a 50% drop in medical prescriptions along with a dramatic\n    decrease in death rates — but most importantly, the residents were simply happier.\n        Dr. Thomas's approach, named the Eden Alternative, has driven nursing homes to allow a more\n    autonomous (自主的) and creative living space for their elderly. It erases the belief that growing old\n\n4                                                                               https://zhenti.burningvocabulary.com/\n\n    means growing useless. He encourages residents to think of their age as an enriching new phase of life\n    rather than the end of it.\n         Thomas, now a speaker and author of several books, also created small, independently-run\n    residences with their own bedrooms and bathrooms, and he has been preaching a singular message that\n    getting old is not a bad thing.\n         \"Within six weeks, they had to send a truck around to pick up all the wheelchairs,\" Thomas told the\n    Washington Post. \"You know why most people in nursing homes use wheelchairs? Because the buildings\n    are so big.\"\n         The 56-year-old doctor's methods have been adopted in Australia, Japan, Canada, and America with\n    enormous success. Last year he published Second Wind: Navigating the Passage to a Slower, Deeper,\n    and More Connected Life, a guide on how to shift our perspectives on aging and growth.\n         He is currently traveling through North America performing with his guitar and his enthusiasm on\n    his Age of Disruption Tour.\n\n    46. What has Bill Thomas been doing for a quarter of a century?\n         A) Transforming people's lifestyle.\n         B) Honoring his Harvard education.\n         C) Changing people's philosophy of life.\n         D) Shifting people's perspective on aging.\n\n    47. Why did Bill Thomas try something different in the nursing home?\n         A) He wanted to make it more pleasant for seniors.\n         B) He wanted to apply his Harvard training to practice.\n         C) He felt it his duty to revolutionize its management.\n         D) He felt disappointed working in the environment.\n    48. What do we learn about Bill Thomas bringing animals and plants into the nursing home?\n         A) He made a mess of the nursing home.\n         B) He did something all professionals would do.\n         C) He won instant support from the state authorities.\n         D) He acted in violation of the state law.\n\n    49. What has Bill Thomas been persistently advocating?\n         A) Good health is not just a privilege of the young.\n         B) Nursing homes should be strictly limited in size.\n         C) Getting old is by no means something miserable.\n         D) Residences for seniors should be run independently.\n\n    50. How is Bill Thomas's new concept received??\n         A) It is gaining ground in many countries.\n         B) It is being heatedly debated worldwide.\n         C) It is considered revolutionary everywhere.\n         D) It is winning approval from the government.\n\n5                                                                             https://zhenti.burningvocabulary.com/\n\n    Passage Two\n    Questions 51 to 55 are based on the following passage.\n\n        Research shows that in developed countries, more affluent and educated people tend to consume\n    higher-quality diets — including more fruits and vegetables, fish and whole grains. On the contrary,\n    economically disadvantaged people report diets that are nutrient-poor and energy-dense. They are less\n    likely to have food-purchasing habits that conform to public health recommendations.\n        These dietary differences are often accompanied by higher rates of obesity and diabetes among\n    lower- income people. This relationship between social class and diet quality and health is extensively\n    documented. However, the research does not explain why this is the case — a question that has\n    significant implications for designing effective policies and initiatives to improve diets and prevent\n    chronic diseases.\n        Public-health initiatives to promote healthy diets often focus on providing nutrition education and\n    recipes (食谱). These approaches, however, often presume less food literacy (i.e. food knowledge and\n    skills) among low-income people. Are unhealthy diets really the result of poor choices, limited food skills\n    and knowledge?\n        Research suggests that adults in food-insecure households are just as likely as those in food-secure\n    households to adjust recipes to make them more healthy. They are also just as proficient in food\n    preparation and cooking skills. There is no indication that increasing food skills or budgeting skills will\n    reduce food insecurity.\n        Instead, disadvantaged groups are constrained by their economic, material and social circumstances.\n    For example, low income is the strongest predictor of food insecurity in Canada, where one in eight\n    households experiences insufficient access to nutritious foods.\n        It's well-established that food prices are an important determinant of food choice. Low-income\n    households report that they find it difficult to adopt dietary guidelines because food prices are a barrier to\n    improving their diets.\n        When researchers estimate the cost of diets people actually eat, higher-quality diets are typically\n    more costly.\n        While this may be so, it does not, in itself, prove that healthy diets are necessarily more expensive or\n    cost-prohibitive. After all, not all socioeconomically disadvantaged people consume poor diets.\n        We can easily think of a number of foods and recipes that are both inexpensive and nutritious. The\n    internet is full of recipes for \"eating well on a budget.\"\n\n    51. What can we learn from research on diets in developed countries?\n        A) Dietary recommendations are not fit for underprivileged people.\n        B) People from different social groups vary in ·their dietary habits.\n        C) People's choice of food depends on their individual taste.\n        D) There is no consensus on what high-quality diets are.\n\n    52. What does the author say is important in formulating policies to improve diets and health?\n        A) A better understanding of the relationship between social class and health.\n\n6                                                                                 https://zhenti.burningvocabulary.com/\n\n        B) A greater emphasis on studying the cause of obesity and chronic diseases.\n        C) Prioritizing the provision of better nutrition for lower classes.\n        D) Designing education programs and initiatives on public health.\n\n    53. What does research reveal about adults in food-insecure households?\n        A) Their eating habits need to be changed.\n        B) Their food literacy has been improving.\n        C) They do not pay much attention to their food recipes.\n        D) They do not lack food knowledge or budgeting skills.\n    54. What would help improve food security among the disadvantaged groups in Canada?\n        A) Teaching them budgeting skills.\n        B) Increasing their food choices.\n        C) Enabling them to have more access to nutritious foods.\n        D) Taking more effective measures to increase food supplies.\n\n    55. What does the author suggest disadvantaged people do to improve their health?\n        A) Adopt a positive attitude towards dietary guidelines.\n        B) Choose diets that are both healthy and affordable.\n        C) Make sure to purchase healthy foods on the internet.\n        D) Change their eating habits and consumption patterns.\n\n    Part IV                                       Translation                                      ( 30 minutes)\n    Directions: For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You\n    should write your answer on Answer Sheet 2.\n\n         冬至(Winter Solstice)是全年白昼最短、黑夜最长的一天，标志着一年中最寒冷时节的开始。\n    冬至过后，气温越来越低，人们的户外活动逐渐减少。农民地里活儿不多，主要忙于灌溉系统的\n    维护和农作物的防冻，同时为来年春天播种做准备。\n         中国人历来很重视冬至，许多地方都把冬至当作一个节日，庆祝方式各地不尽相同。北方人\n    有冬至吃饺子(jiaozi)的习俗，南方人有冬至吃汤圆(tangyuan)的传统。\n\n7                                                                               https://zhenti.burningvocabulary.com/"}, "2023-06-01": {"title": "2023年6月四级真题(第1套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2023-06/01", "text": "                 2023 年 6 月大学英语四级考试真题（第 1 套）\n\n    Part I                                         Writing                                            ( 30 minutes)\n    Directions: Suppose the student union of your university is organizing an online discussion on interpersonal\n    relationships. You are to write an essay on ways to maintain a warm and friendly relationship with your\n    classmates and on the benefits of such a relationship. You will have 30 minutes for the task. You should write\n    at least 120 words but no more than 180 words.\n\n    Part II                              Listening Comprehension                                      ( 25 minutes)\n    Section A\n    Directions: In this section, you will hear three news reports. At the end of each news report, you will hear two\n    or three questions. Both the news report and the questions will be spoken only once. After you hear a question,\n    you must choose the best answer from the four choices marked A), B), C) and D). Then mark the\n    corresponding letter on Answer Sheet 1 with a single line through the centre.\n    Questions 1 and 2 are based on the news report you have just heard.\n    1. A. A man was taken to a hospital.                         C. A man fell off his toilet seat.\n       B. A man was bitten by a snake.                           D. A man kept a 4-foot snake as a pet.\n    2. A. Who owned the snake.                                   C. Whether the snake was infected.\n       B. How the snake was captured.                            D. Where the snake had been taken.\n    Questions 3 and 4 are based on the news report you have just heard.\n    3. A. Posting her daughter’s photos on social media.\n       B. Sharing her photos with famous movie stars.\n       C. Amusing herself by going to ball parties.\n       D. Taking her trash out in fancy dresses.\n    4. A. To record her achievements.                            C. To amuse people.\n       B. To please her daughter.                                D. To make herself popular.\n    Questions 5 to 7 are based on the news report you have just heard.\n    5. A. Get a free meal after answering some questions.\n       B. Have a meal even if they have no money.\n       C. Have a chance of winning a $100 prize.\n       D. Eat as much as they want for $10.\n\n    6. A. It was brought up by two staffers. he conversation you have just heard.\n    12. A. Their quality.              B. Their design.           C. Their price.            D. Their color.\n\n    13. A. Jeans are available in a greater variety in America.\n       B. America has the best weaving tools in the world.\n       C. America makes the best-known brands of jeans.\n       D. Jeans are a typical American garment.\n\n    14. A. They are artificial.                                   C. They are natural.\n       B. They are unique.                                        D. They are special.\n    15. A. They are worth the price.                              C. They are popular with boys.\n       B. They are much too pricey.                               D. They are for casual wearing.\n\n    Section C\n    Directions: In this section, you will hear three passages. At the end of each passage, you will hear three or\n    four questions. Both the passage and the questions will be spoken only once. After you hear a question, you\n    must choose the best answer from the four choices marked A), B), C) and D). Then mark the corresponding\n    letter on Answer Sheet 1 with a single line through the centre.\n    Questions 16 to 18 are based on the passage you have just heard.\n    16. A. He wants to see it again.\n       B. He desires more in life.\n\n2                                                                                   https://zhenti.burningvocabulary.com/\n\n       C. He longs to become a superstar himself.\n       D. He feels as inspired as other audience members.\n    17. A. It is extremely artistic.                            C. It is somewhat complicated.\n       B. It is rather unrealistic.                             D. It is relatively predictable.\n\n    18. A. They are too simple.                                 C. They are basically misleading.\n       B. They are full of shootings.                           D. They are biased against women.\n    Questions 19 to 21 are based on the passage you have just heard.\n    19. A. It is an intuitive way to solidify friendship.       C. It can help connect people.\n       B. It is a means to inspire creative thinking.           D. It can highlight leadership.\n\n    20. A. Make them more open to learning.                     C. Enable them to remember the main idea.\n       B. Allow them to recite data points.                     D. Stimulate them to engage in discussions.\n\n    21. A. Enrich their own experience.                         C. Explain insightful ideas.\n       B. Inspire listeners’ imagination.                       D. Convey fundamental values.\n    Questions 22 to 25 are based on the passage you have just heard.\n    22. A. The number of immigrants to the U.S. is declining.\n       B. Another wave of immigrants is hitting the U.S.\n       C. Immigrants have been contributing to the U.S.\n       D. Immigrants outnumber U.S.-born Americans.\n\n    23. A. They have founded most Fortune 500 companies.\n       B. They have fewer chances to be hired by U.S. companies.\n       C. More of them expect their children to succeed in business.\n       D. More of them are successful business people.\n\n    24. A. Thirty-four percent of them use credit for their daily purchases.\n       B. Their level of debt is lower than that of native-born Americans.\n       C. Nineteen percent of them borrow money from friends and family.\n       D. They have higher installment loan debt than native-born Americans.\n\n    25. A. Collaborate with native-born Americans.              C. Keep their traditional values and old habits.\n       B. Borrow money from financial institutions.             D. Find employment in competitive businesses.\n\n    Part III                                 Reading Comprehension                                  ( 40 minutes)\n    Section A\n    Directions: In this section, there is a passage with ten blanks. You are required to select one word for each\n    blank from a list of choices given in a word bank following the passage. Read the passage through carefully\n    before making your choices. Each choice in the bank is identified by a letter. Please mark the corresponding\n    letter for each item on Answer Sheet 2 with a single line through the centre. You may not use any of the words\n    in the bank more than once.\n\n3                                                                                 https://zhenti.burningvocabulary.com/\n\n        You probably haven’t taken the time to think of all the work that went into creating the shirt on your\n    back. I mean, how hard it could be to create fabric and         26        it into a shirt shape. Don’t machines do all\n    that? Well, creating fabric from cotton, which is the most           27      clothing material, is actually a process\n    that involves a lot of water, 2,700 liters per shirt to be           28     . Take a look at the video below from\n    National Geographic for some more mind-blowing             29    about cotton clothing production.\n        Clean water is      30     becoming one of the most sought-after resources in the world. Given how\n    large the   31    and cotton industries are, they take up a lot of our fresh water demands across the world,\n    according to The Huffington Post. The video from National Geographic was created to spread                        32     of\n    how environmentally harmful cotton is. But the situation can be made better. Through better water\n    management and farming practices, water usage in cotton production can be cut down by                            33     40\n    percent.\n        Called “Better Cotton”, this environmentally conscious product will save millions of liters of water a\n    year simply from     34      the demands of cotton production. Cotton doesn’t have to go, since it is, after\n    all, one of the most useful cash crops across the globe. However, as water supplies                  35    , farmers and\n    consumers need to be more conscious of the effect that these products have on the environment as a\n    whole.\n\n                      A. abstracts                F. increasingly                   K. reducing\n                      B. abundant                 G. intense                        L. sew\n                      C. awareness                H. mend                           M. shrink\n                      D. conscience               I. nearly                         N. statistics\n                      E. exact                    J. reckoning                      O. textile\n\n    Section B\n    Directions: In this section, you are going to read a passage with ten statements attached to it. Each statement\n    contains information given in one of the paragraphs. Identify the paragraph from which the information is\n    derived. You may choose a paragraph more than once. Each paragraph is marked with a letter. Answer the\n    questions by marking the corresponding letter on Answer Sheet 2.\n\n                                                 The Spoken Web\n    A. We’re growing more used to chatting to our computers, phones and smart speakers through voice\n       assistants like Amazon’s Alexa, Apple’s Siri and Microsoft’s Cortana. Blind and partially sighted\n       people have been using text-to-speech converters for decades.\n\n    B. Out of these assistants, Siri is the most well-known. The assistant uses voice inquiries and a natural-\n       language user interface (界面) to answer questions. The software adapts to users’ individual language\n       usages, searches, and preferences, with continuing use.\n\n    C. Some think voice could soon take over from typing and clicking as the main way to interact online.\n\n4                                                                                          https://zhenti.burningvocabulary.com/\n\n       But what are the challenges of moving to “the spoken web”?\n\n    D. What use is written online content if you can’t read? That is the situation facing illiterate (不识字)\n       African farmers. They are often denied crucial information the web offers many others. With a\n       literacy rate in some parts of Africa at only 22.6%, farmers are often “underpaid for their produce\n       because they might be unaware of the prevailing prices,” says Francis Dittoh, a researcher behind Mr\n       Meteo, a speech-based weather information service.\n\n    E. “The most frequently heard complaint is about rainfall predictions,” says Mr Dittoh, who lives in\n       Tamale, northern Ghana. “They tell us the methods their forefathers used to predict the weather don’t\n       seem to work as well these days.” This is down to climate change, he believes. Yet knowing when it’s\n       going to rain is vital for farmers wanting to sow seeds, irrigate crops or take their animals out to the\n       fields to feed on grass.\n\n    F. Mr Dittoh says the idea of converting online weather reports into speech came from the farmers\n       themselves, after a workshop in the village of Guabuligah. “They came up with this,” he says. Mr\n       Meteo takes the online weather forecast, converts it to a short recording in the appropriate language\n       and makes it available on a basic phone. Farmers ring up to receive the information. The local\n       language Dagbani is spoken by 1.2 million people but is not served by any online translation\n       applications. The service was designed to be cheap and easy to run, says Mr Ditto. He plans to begin\n       field tests this month, working with Tamale’s Savanna Agricultural Research Institute.\n\n    G. The spoken web could also help the one-in-five adults in Europe and the US with poor reading skills.\n       But building the spoken web — web-to-voice and voice-to-web — isn’t straightforward. For software\n       to understand pizza is served at Italian restaurants is easy. To cover multiple domains and to be able to\n       have a conversation with users on every single topic is still a long way off.\n    H. So although many computer assistants can answer simple questions about the weather and play music\n       for us, anything resembling a wide-ranging human conversation is decades away. Artificial\n       intelligence just isn’t smart enough yet. Even turning your voice into text — automatic speech\n       recognition — is one of the hardest problems to solve, as there are as many ways to pronounce things\n       as there are people on the planet.\n\n    I. Siri has often been praised for its ability to interpret our casual language and deliver very specific and\n       accurate result, sometimes even providing additional information. But it is still somewhat restricted,\n       particularly when the language moved away from stiffer commands into more human interactions. In\n       one example, the phrase “Send a text to Jason, Clint, Sam, and Lee saying we’re having dinner at\n       Silver Cloud restaurant” was interpreted as sending a message to Jason only, containing the text “Clint\n       Sam and Lee saying we’re having dinner at Silver Cloud restaurant”. It has also been noted that Siri\n       lacks a proper editing function, as saying “Edit message to say: we’re at Silver Cloud restaurant and\n       you should come find us” generates “Clint Sam and Lee saying we’re having dinner at Silver Cloud\n       restaurant to say we’re at Silver Cloud restaurant and you should come find us”.\n\n    J. Using voice interaction feels far more intimate than surfing the net the old-fashioned way. This is\n       intentional as the informal tone of the assistant helps create an emotional attachment. But if something\n5                                                                                 https://zhenti.burningvocabulary.com/\n\n       speaks, it must also listen. Our phones are always near us and they are collecting data about us all the\n       time. This has already raised privacy concerns. The American Civil Liberties Union has stated that\n       digital assistants create a threat to privacy from hackers. Some people have other concerns. They\n       worry assistants will one day be used to deliver advertising directly to us.\n\n    K. But digital voices need more personality to make them popular. Robots are not yet witty, Siri is boring.\n       The benefits of using voice instead of tapping fingers obviously depend on the context. Doctors\n       completing online forms about their patients by speech, for example, can dictate 150 words a minute,\n       three times faster than typing on a keyboard. This enables them to spend less time on administration\n       and more time with patients.\n\n    L. Last year, speech recognition company Nuance helped a doctors’ surgery in Dukinfield, near\n       Manchester, set up a speech system for the practice’s six doctors. Now they can dictate notes on a\n       patient’s health condition and treatment and a smart assistant automatically enters the information into\n       the right fields on a web form. Previously, the doctors made voice recordings that were then\n       transcribed by secretaries — a process that was costly and likely to cause delays. The new system\n       means letters to patients now have more detail.\n\n    M. Using voice also makes sense when you’re doing other things with your hands. Think about when\n       you’re cooking, and you just want to know what the next step in the recipe is. Your hands are covered\n       with oil; you’re not going to get on the iPad, so it’s a lot more natural to talk. And speech obviously\n       makes sense when you’re driving. In the US, 29% of drivers admit they surf behind the wheel,\n       according to insurance firm State Farm. This is up from 13% in 2009. No wonder using mobile\n       phones while driving causes more crashes a year than drink driving, says the US National Safety\n       Council.\n\n    36. According to Francis Dittoh, their speech-based weather information service was meant to be\n       inexpensive and easy to use.\n    37. Using voice instead of typing enables doctors to spend more time taking care of patients.\n    38. It is extremely difficult to convert voice into text because of different pronunciations.\n    39. African farmers unable to read often don’t have access to important information conveyed online.\n    40. Some phone users worry advertisers will take advantage of voice assistants to send ads directly to\n       them.\n    41. The spoken web is helpful when one’s hands are occupied.\n    42. Some people believe online interaction would soon depend mainly on voice.\n    43. Setting up a spoken web is by no means an easy task.\n    44. Weather information is extremely important to farmers.\n    45. Some people are concerned about privacy because their phones are constantly collecting their\n       personal information.\n\n6                                                                                  https://zhenti.burningvocabulary.com/\n\n    Section C\n    Directions: There are 2 passages in this section. Each passage is followed by some questions or unfinished\n    statements. For each of them there are four choices marked A), B), C) and D). You should decide on the best\n    choice and mark the corresponding letter on Answer Sheet 2 with a single line through the centre.\n    Passage One\n    Questions 46 to 50 are based on the following passage.\n        The United States is facing a housing crisis: Affordable housing is inadequate, while luxury homes\n    abound (充裕), and homelessness remains a persistent problem. Despite this, popular culture and the\n    housing industry market happiness as living with both more space and more amenities (便利设施). Big\n    houses are advertized as a reward for hard work and diligence, turning housing from a basic necessity\n    into a luxury.\n        This is reflected in our homes. The average single-family home built in the United States before\n    1970 was less than 1,500 square feet in size. By 2016, the average size of a new, single-family home was\n    2,422 square feet. What’s more, homes built in the 2000s were more likely than earlier models to have\n    more of all types of spaces: bedrooms, bathrooms, living rooms, dining rooms, recreation rooms and\n    garages.\n        There are consequences of living big. As middle-class houses have grown larger, two things have\n    happened. First, large houses take time to maintain, so cleaners and other low-wage service workers are\n    required to keep these houses in order. Second, once-public spaces, where people from diverse\n    backgrounds used to come together, have increasingly become privatized, leading to a reduction in the\n    number of public facilities available to all, and a reduced quality of life for many. Take swimming pools.\n    While in 1950, only 2,500 U.S. families owned pools, by 1999 this number was 4 million. At the same\n    time, public municipal pools were often closed, leaving low-income people nowhere to swim.\n        The trend for bigger housing thus poses ethical questions. Should Americans accept a system in\n    which the middle and upper classes enjoy a luxurious lifestyle, using the low-wage labor of others? Are\n    we willing to accept a system in which an increase in amenities purchased by the affluent means a\n    reduction in amenities for the poor?\n        I believe neither is acceptable. We must change the way we think: living well does not need to mean\n    having more private spaces; instead, it could mean having more public spaces. A better goal than building\n    bigger houses for some is to create more publicly accessible spaces and amenities for all.\n\n    46. What are big houses promoted to be in the United States?\n       A. A luxury for the homeless.                           C. An abundant source of comforts.\n       B. A reward for industriousness.                        D. An absolute necessity for happiness.\n\n    47. What is one of the consequences of living big?\n       A. Many Americans’ quality of life has become lower.\n       B. People from diverse backgrounds no longer socialize.\n       C. People no longer have access to public swimming pools.\n       D. Many Americans’ private life has been negatively affected.\n\n7                                                                               https://zhenti.burningvocabulary.com/\n\n    48. What questions arise from living big?\n       A. Questions related to moral principles.                 C. Questions about what lifestyle to promote.\n       B. Questions having to do with labor cost.                D. Questions concerning housing development.\n\n    49. What kind of social system does the author think is unacceptable?\n       A. One in which the wealthy exploit the low-wage laborers building their houses.\n       B. One in which the rich purchase amenities at an increasingly unjustifiable price.\n       C. One in which the upper classes deprive the lower classes of affordable housing.\n       D. One in which the affluent enjoy a more comfortable life at the expense of the poor.\n    50. What does the author advocate for people to live well?\n       A. Finding ways to turn private spaces into public ones.\n       B. Building more houses affordable to those less affluent.\n       C. More public spaces created for everyone to enjoy.\n       D. All amenities made accessible to the rich and the poor alike.\n\n    Passage Two\n    Questions 51 to 55 are based on the following passage.\n        Most of us in the entrepreneurial community are blessed — or cursed — with higher-than-average\n    ambition. Ambitious people strongly desire accomplishments and are willing to take more risks and\n    spend more effort to get them.\n        Overall, this is a positive quality, especially for people trying to build their own businesses.\n    Apparently, if you’re more naturally driven to set goals, you are more likely to succeed.\n        Actually, this isn’t always the case. In fact, in some cases, extreme ambition may end up doing more\n    harm than good.\n        One major side effect of excessive ambition is the tendency to focus too determinedly on one\n    particular vision or end goal. This is problematic because it hinders your ability to adapt to new\n    circumstances, which is vital if you want to be a successful entrepreneur. If a new competitor emerges to\n    threaten your business, you may need to change direction, even if that means straying from your original\n    vision. If you have too much ambition, you’ll find this hard, if not impossible.\n        Few people are successful when they try to build their first brand. Unfortunately, for the most\n    ambitious entrepreneurs, a failure is seen as disastrous, and impossible to recover from.\n        It’s a clear departure from the intended plan toward the intended goal. For people with limited\n    ambition, however, failure is viewed as something closer to reality. Remember, failure is inevitable, and\n    every failure you survive is a learning experience.\n        Ambitious people tend to be more materialistically successful than their non-ambitious counterparts.\n    However, they’re only slightly happier than their less-ambitious counterparts, and tend to live\n    significantly shorter lives. This implies that even though ambitious people are more likely to achieve\n    conventional “success,” such success means nothing for their health and happiness — and if you don’t\n    have health and happiness. what else could possibly matter?\n8                                                                                https://zhenti.burningvocabulary.com/\n\n        Clearly, some amount of ambition is good for your motivation. Without any ambition, you wouldn’t\n    start your own business, set or achieve goals and get far in life. But an excess of ambition can also be\n    dangerous, putting you at risk of burnout, stubbornness and even a shorter life.\n\n    51. What does the author think of most entrepreneurs?\n       A. They are more willing to risk their own lives.\n       B. They are more ambitious than ordinary people.\n       C. They achieve greater nonconventional success.\n       D. They have more positive qualities than most of us.\n    52. What does the author imply by saying “this isn’t always the case” (Line 1, Para. 3)?\n       A. Ambitious people may not have a greater chance of success.\n       B. Ambitious people may not have more positive qualities.\n       C. Entrepreneurs’ ambition does as much good as harm.\n       D. Entrepreneurs are more naturally driven to success.\n\n    53. What does the author say is of extreme importance for one to become a successful entrepreneur?\n       A. Holding on to one’s original vision.\n       B. Being able to adapt to new situations.\n       C. Focusing determinedly on one particular goal.\n       D. Avoiding radical change in one’s career direction.\n\n    54. How do the most ambitious entrepreneurs regard failure in their endeavor?\n       A. It will awaken them to reality.                       C. It means the end of their career.\n       B. It is a lesson they have to learn.                    D. It will result in a slow recovery.\n\n    55. What does the author advise us to do concerning ambition?\n       A. Distinguish between conventional success and our life goal.\n       B. Follow the example of the most ambitious entrepreneurs.\n       C. Avoid taking unnecessary risks when starting a business.\n       D. Prioritize health and happiness over material success.\n\n    Part IV                                      Translation                                        ( 30 minutes)\n    Directions: For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You\n    should write your answer on Answer Sheet 2.\n\n         中国政府一直大力推行义务教育(compulsory education)，以使每个儿童都享有受教育的机会。\n    自 1986 年《义务教育法》生效以来，经过不懈努力，实现了在全国推行义务教育的目标。如今，\n    在中国，儿童年满六周岁开始上小学，从小学到初中一共接受九年义务教育。从 2008 年秋季学期\n    开始，义务教育阶段学生无需缴纳学费。随着一系列教育改革举措的实施，中国义务教育的质量\n    也有显著提高。\n\n9                                                                                https://zhenti.burningvocabulary.com/"}, "2023-06-02": {"title": "2023年6月四级真题(第2套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2023-06/02", "text": "                2023 年 6 月大学英语四级考试真题（第 2 套）\n\n    Part I                                      Writing                                      ( 30 minutes)\n    Directions: Suppose the student union of your university is organizing an online discussion on college\n    students doing community service. You are to write an essay on its benefits and the service you can\n    provide to the community. You will have 30 minutes for the task. You should write at least 120 words\n    but no more than 180 words.\n\n    Part II                              Listening Comprehension                             ( 25 minutes)\n    Section A\n    Directions: In this section, you will hear three news reports. At the end of each news report, you will\n    hear two or three questions. Both the news report and the questions will be spoken only once. After\n    you hear a question, you must choose the best answer from the four choices marked A), B), C) and D).\n    Then mark the corresponding letter on Answer Sheet 1 with a single line through the centre.\n\n    Questions 1 and 2 are based on the news report you have just heard.\n    1. A. She was involved in a conflict with bird lovers.\n       B. She was charged with mistreating animals.\n       C. She was on bad terms with her neighbors.\n       D. She was accused of violating a city law.\n\n    2. A. It will take time to solve the rat problem.\n       B. All wild animals should be well protected.\n       C. The woman was not to blame for the situation.\n       D. No one should go unpunished for violating laws.\n    Questions 3 an
