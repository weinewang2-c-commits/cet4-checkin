     “Many policy measures to control obesity(肥胖症）assume that people consciously and rationally choose what and how\nmuch they eat and therefore focus on providing information and more access to healthier foods,” note the two researchers.\n     “In contrast,” the researchers continue, “ many regulations that don’t assume people make rational choices have been\nsuccessfully applied to control alcohol, a substance—like food—of which immoderate consumption leads to serious health\nproblems. ’’\n     The research references studies of peopled behavior with food and alcohol and results of alcohol restrictions, and then lists\nfive regulations that the researchers think might be promising if applied to junk foods. Among them:\n      Density restrictions： licenses to sell alcohol aren’t handed out unplanned to all comers but are allotted (分配) based on the\nnumber of places in an area that already sell alcohol. These make alcohol less easy to get and reduce the number of psychological\ncues to drink.\n      Similarly, the researchers say, being presented with junk food stimulates our desire to eat it. So why not limit the density of\nfood outlets, particularly ones that sell food rich in empty calories? And why not limit sale of food in places that aren5t primarily\nfood stores?\n      Display and sales restrictions: California has a rule prohibiting alcohol displays near the cash registers in gas stations, and in\n\n                                                                  6\n\n                                          2015 年 6 月大学英语六级考试真题(三）\n\nmost places you can’t buy alcohol at drive-through facilities. At supermarkets, food companies pay to have their wares in places\nwhere they’re easily seen. One could remove junk food to the back of the store and ban them from the shelves at checkout lines.\nThe other measures include restricting portion sizes, taxing and prohibiting special price deals for junk foods, and placing\nwarning labels on the products.\n  56. What does the author say about junk food?\n      A)    People should be educated not to eat too much.\n      B)    It is widely consumed despite its ill reputation.\n      C)    Its temptation is too strong for people to resist.\n      D)    It causes more harm than is generally realized.\n57.What do the Rand researchers think of many of the policy measures to control obesity?\n     A) They should be implemented effectively.                    C) They are based on wrong assumptions.\n     B) They provide misleading information.                       D) They help people make rational choices.\n58.Why do policymakers of alcohol control place density restrictions?\n      A)    Few people are able to resist alcohol’s temptations.\n      B)    There are already too many stores selling alcohol.\n      C)    Drinking strong alcohol can cause social problems.\n      D)    Easy access leads to customers’ over-consumption.\n59.What is the purpose of California’s rule about alcohol display in gas stations?\n      A)    To effectively limit the density of alcohol outlets.\n      B)    To help drivers to give up the habit of drinking.\n      C)    To prevent possible traffic jams in nearby areas.\n      D)    To get alcohol out of drivers’ immediate sight.\n60.What is the general guideline the Rand researchers suggest about junk food control?\n      A)    Guiding people to make rational choices about food.\n      B)    Enhancing people’s awareness of their own health.\n      C)    Borrowing ideas from alcohol control measures.\n      D)    Resorting to economic, legal and psychological means.\n\nPassage Two\nQuestions 61 to 65 are based on the following passage.\n      Kodak’s decision to file for bankruptcy (破产）protection is a sad, though not unexpected, turning point for a leading\nAmerican corporation that pioneered consumer photography and dominated the film market for decades, but ultimately failed to\nadapt to the digital revolution.\n      Although many attribute Kodak’s downfall to “complacency ( 自满)”that explanation doesn’t acknowledge the lengths to\nwhich the company went to reinvent itself. Decades ago, Kodak anticipated that digital photography would overtake film—and in\nfact, Kodak invented the first digital camera in 1975—but in a fateful decision, the company chose to shelf its new discovery to\nfocus on its traditional film business.\n      It wasn’t that Kodak was blind to the future, said Rebecca Henderson, a professor at Harvard Business School, but rather\nthat it failed to execute on a strategy to confront it. By the time the company realized its mistake, it was too late.\n     Kodak is an example of a firm that was very much aware that they had to adapt, and spent a lot of money trying to do so, but\nultimately failed. Large companies have a difficult time switching to new markets because there is a temptation to put existing\nassets into the new businesses.\n     Although Kodak anticipated the inevitable rise of digital photography, its corporate(企业的）culture was too rooted in the\nsuccesses of the past for it to make the clean break necessary to fully embrace the future. They were a company stuck in time.\n\n                                                                   7\n\n                                        2015 年 6 月大学英语六级考试真题(三）\n\nTheir history was so important to them. Now their history has become a liability.\n     Kodak’s downfall over the last several decades was dramatic. In 1976, the company commanded 90% of the market for\nphotographic film and 85% of the market for cameras. But the 1980s brought new competition from Japanese film company Fuji\nPhoto, which undermined Kodak by offering lower prices for film and photo supplies. Kodak’s decision not to pursue the role of\nofficial film for the 1984 Los Angeles Olympics was a major miscalculation. The bid went instead to Fuji, which exploited its\nsponsorship to win a permanent foothold in the marketplace.\n61. What do we learn about Kodak?\n     A)    It went bankrupt all of a sudden.\n     B)    It is approaching its downfall.\n     C)    It initiated the digital revolution in the film industry.\n     D)    It is playing the dominant role in the film market.\n62. Why does the author mention Kodak’s invention of the first digital camera?\n     A)    To show its early attempt to reinvent itself.\n     B)    To show its effort to overcome complacency.\n     C)    To show its quick adaptation to the digital revolution.\n     D)    To show its will to compete with Japan’s Fuji Photo.\n63. Why do large companies have difficulty switching to new markets?\n     A)    They find it costly to give up their existing assets.\n     B)    They tend to be slow in confronting new challenges.\n     C)    They are unwilling to invest in new technology.\n     D)    They are deeply stuck in their glorious past.\n64. What does the author say Kodak’s history has become?\n     A) A burden.                  B) A mirror.                        C) A joke.                     D) A challenge.\n65. What was Kodak’s fatal mistake?\n    A)    Its blind faith in traditional photography.                  C) Its refusal to sponsor the 1984 Olympics.\n    B) Its failure to see Fuji Photo’s emergence.                      D) Its overconfidence in its corporate culture.\n\nPart IV                                                    Translation                                           (30 minutes)\nDirections： For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You should write your\n              answer on Answer Sheet 2.\n     在西方人心目中，和中国联系最为密切的基本食物是大米。长期以来，大米在中国人的饮食中占据很重要的地位，\n以至于有谚语说“巧妇难为无米之炊”。中国南方大多种植水稻，人们通常以大米为主食；而华北大部分地区因为过于\n寒冷或过于干燥,无法种植水稻，那里的主要作物是小麦。在中国，有些人用面粉做面包,但大多数人用面粉做馒头和面\n条。\n\n                                                                   8\n"}, "2015-12-01": {"title": "2015年12月四级真题(第1套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2015-12/01", "text": "                                        2015 年 12 月大学英语四级考试真题(一)\n\n2015 年 12 月大学英语四级考试真题（第 1 套)\nPart I                                                Writing                                              (30 minutes)\nDirections ： For this part, you are allowed 30 minutes to write an essay commenting on the saying “Listening is more\n                important than talking.’’ You can cite examples to illustrate the importance of paying attention to others1\n                opinions. You should write at least 120 words but no more than 180 words.\n\nPart Ⅱ                                                Listening Comprehension                                 (30 minutes)\nSection A\nDirections ： In this section, you will hear 8 short conversations and 2 long conversations. At the end of each conversation, one\n                or more questions will be asked about what was said. Both the conversation and the questions will be spoken only\n                once. After each question there will be a -pause. During the pause, you must read the four choices marked A), B),\n                C) and D), and decide which is the best answer. Then mark the corresponding letter on Answer Sheet 1 with a\n                single line through the centre.\n1.   A) They admire the courage of space explorers.\n     B)   They were going to watch a wonderful movie.\n     C)   They enjoyed the movie on space exploration.\n     D) They like doing scientific exploration very much.\n2.   A) In a school library.                                      C) In the office of a travel agency.\n     B)   At a gift shop.                                         D) At a graduation ceremony.\n3.   A) He used to work in the art gallery.                      C) He is not interested in any part-time jobs.\n     C)   He does not have a good memory.                        D) He declined a job offer from the art gallery.\n4.   A) He will be unable to attend the birthday party.\n     B) The woman should have informed him earlier.\n     C) He will go to the birthday party after the lecture.\n     D) Susan has been invited to give a lecture tomorrow.\n5.   A) Set a deadline for the staff to meet.                 C) Reward those having made good progress.\n     B) Assign more workers to the project.                   D) Encourage the staff to work in small groups.\n6.   A) Where she can leave her car.                          C) How far away the parking lot is.\n     B) The rate for parking in Lot C.                        D) The way to the visitors parking.\n7. A) He regrets missing the classes.                         C) He plans to take the fitness classes.\n     B) He has benefited from exercise.                       D) He is looking forward to a better life.\n8. A) How to select secretaries.                              C) The responsibilities of secretaries.\n     B) How to raise work efficiency.                         D) The secretaries in the man’s company.\nQuestions 9 to 11 are based on the conversation you have just heard.\n9.   A) It is used by more people than English.\n     B) It is more difficult to learn than English.\n     C) It will be as commonly used as English.\n     D) It will eventually become a world language.\n10. A)     Its popularity with the common people.                  C) The influence of the British Empire.\n      B) The effect of the Industrial Revolution.                D) Itsloan words from many languages.\n11. A) It has a growing number of newly coined words.\n\n                                                                  1\n\n                                        2015 年 12 月大学英语四级考试真题(一)\n\n      B) It includes a lot of words from other languages.\n      C) It is the largest among all languages in the world.\n      D) It can be easily picked up by overseas travellers.\n\nQuestions 12 to 15 are based on the conversation you have just heard.\n12. A)     To place an order.                                          C)To return some goods.\n     B)To apply for a job.                                             D)To make a complaint.\n13. A) He works on a part-time basis for the company.\n      B) He has not worked in the sales department for long.\n      C) He is not familiar with the exact details of the goods.\n      D) He has become somewhat impatient with the woman.\n14. A) It is not his responsibility.                                C) It depends on a number of factors.\n      B) It will be free for large orders.                          D) It costs &15 more for express delivery.\n15. A) Make inquiries with some other companies.\n      B) Report the information to her superior.\n      C) Pay a visit to the saleswoman in charge.\n      D) Ring back when she comes to a decision.\n\nSection B\nDirections： In this section, you will hear 3 short passages. At the end of each passage, you will hear some questions. Both the\n               passage and the questions will be spoken only once. After you hear a question, you must choose the best answer\n               from the four choices marked A), B), C), and D). Then mark the corresponding letter on Answer Sheet 1 with a\n               single line through the centre.\nPassage One\nQuestions 16 to 18 are based on the passage you have just heard.\n16, A) No one knows for sure when they came into being.\n     B) No one knows exactly where they were first made.\n      C) No one knows for what purpose they were invented.\n      D) No one knows what they will look like in the future.\n17. A) Measure the speed of wind.                             C) Pass on secret messages.\n      B) Give warnings of danger.                              D) Carry ropes across rivers.\n18. A) To find out the strength of silk for kites.             C) To prove that lightning is electricity.\n\n      B) To test the effects of the lightning rod.             D) To protect houses against lightning.\n\nPassage Two\nQuestions 19 to 22 are based on the passage you have just heard.\n19. A) She was born with a talent for languages.                    C) She can speak several languages.\n      B) She was trained to be an interpreter.                      D) She enjoys teaching languages.\n20. A) They want to learn as many foreign languages as possible.\n     B) They have an intense interest in cross-cultural interactions.\n     C) They acquire an immunity to culture shock.\n     D) They would like to live abroad permanently.\n21. A) She became an expert in horse racing.\n      B)   She learned to appreciate classical music.\n      C)   She was able to translate for a German sports judge.\n\n                                                                   2\n\n                                         2015 年 12 月大学英语四级考试真题(一)\n\n      D)   She got a chance to visit several European countries.\n22. A) Take part in a cooking competition.                         C) Teach vocabulary for food in English.\n      B)   Taste the beef and give her comment.                    D) Give cooking lessons on Western food.\n\nPassage Three\nQuestions 23 to 25 are based on the passage you have just heard.\n23. A) He had only a third-grade education.                       C) He often helped his mother do housework.\n      B)   He once threatened to kill his teacher.                D) He grew up in a poor single-parent family.\n24. A) Stupid.                     B) Active.         C) Brave.           D) Careless.\n25. A) Watch educational TV programs only.                        C) Help with housework.\n     B) Write two book reports a week.                         D) Keep a diary.\n\nSection C\nDirections： In this section, you will hear a passage three times. When the passage is read for the first time, you should listen\n                carefully for its general idea. When the passage is read for the second time, you are required to fill in the blanks\n                with the exact words you have just heard. Finally, when the passage is read for the third time, you should check\n                what you have written.\n      When you look up at the night sky, what do you see? There are other 26 bodies out there besides the moon and stars. One\nof the most 27 of these is a comet (彗星).\n      Comets were formed around the same time the Earth was formed. They are 28 ice and other frozen liquids and gases. 29\nthese “dirty snowballs” begin to orbit the sun, just as the planets do.\n      As a comet gets closer to the sun, some gases in it begin to unfreeze. They 30 dust particles from the comet to form a\nhuge cloud. As the comet gets even nearer to the sun, a solar wind blows the cloud behind the comet, thus forming its tail. The\ntail and the 31 fuzzy (模糊的）atmosphere around a comet are 32 that can help identify this 33 in the night sky.\n      In any given year, about a dozen known comets come close to the sun in their orbits. The average person can’t see them all,\nof course. Usually there is only one or two a year bright enough to be seen with the 34 eye. Comet Hale-Bopp, discovered in\n1995, was an unusually bright comet. Its orbit brought it 35 close to the Earth, within 122 million miles of it. But Hale-Bopp\ncame a long way on its earthly visit. It won’t be back for another four thousand years or so.\n\nPart Ⅲ                                               Reading Comprehension                                     (40 minutes)\nSection A\nDirections ： In this section, there is a passage with ten blanks. You are required to select one word for each blank from a list of\n                choices given in a word bank following the passage. Read the passage through carefully before making your\n                choices. Each choice in the bank is identified by a letter. Please mark the corresponding letter for each item on\n                Answer Sheet 2 with a single line through the centre. You may not use any of the words in the bank more than\n                once.\nQuestions 36 to 45 are based on the following passage.\n      Scholars of the information society are divided over whether social inequality decreases or increases in an\ninformation-based society. However, they generally agree with the idea that inequality in the information society is 36 different\nfrom that of an industrial society. As informatization progresses in society, the cause and structural nature of social inequality\nchanges as well.\n      It seems that the information society 37 the quantity of information available to the members of a society by\nrevolutionizing the ways of using and exchanging information. But such a view is a 38 analysis based on the quantity of\ninformation supplied by various forms of the mass media. A different 39 is possible when the actual amount of information 40\nby the user is taken into account. In fact, the more information 41 throughout the entire society, the wider the gap becomes\n\n                                                                  3\n\n                                           2015 年 12 月大学英语四级考试真题(一)\n\nbetween “information haves” and “information have-nots”, leading to digital divide.\n    According to recent studies, digital divide has been caused by three major 42 ：class, sex, and generation. In terms of class,\ndigital divide exists among different types of workers and between the upper and middle classes and the lower class. With 43 to\nsex, digital divide exists between men and women. The greatest gap, however, is between the Net-generation, 44 with personal\ncomputers and the Internet, and the older generation, 45 to an industrial society.\n                        A) accustomed                                         I) flows\n                         B) acquired                                          J) fundamentally\n                         C) assembly                                          K) interpretation\n                         D) attribute                                         L) passive -\n                        E) champions                                          M) regard\n                         F) elements                                          N) respectively\n                   G) expands                                                 O) superficial\n\n                   H) familiar\n\nSection B\nDirections ： In this section, you are going to read a passage with ten statements attached to it. Each statement contains\n               information given in one of the paragraphs. Identify the paragraph from which the information is derived. You\n               may choose a paragraph more than once. Each paragraph is marked' with a letter. Answer the questions by\n               marking the corresponding letter on Answer Sheet 2.\n                                                    Joy ： A Subject Schools Lack\n                                        Becoming educated should not require giving up pleasure.\nA) When Jonathan Swift proposed, in 1729, that the people of Ireland eat their children, he insisted it would solve three\n    problems at once： feed the hungry masses, reduce the population during a severe depression, and stimulate the restaurant\n    business. Even as a satire (讽刺), it seems disgusting and shocking in America with its child-centered culture. But actually,\n    the country is closer to his proposal than you might think.\nB) If you spend much time with educators and policy makers, you’ll hear a lot of the following words ：\n    “ standards,”“ results,”“ skills,”“ self-control,”“ accountability,” and so on. I have visited some of the newer supposedly\n    “effective” schools, where children shout slogans in order to learn self- control or must stand behind their desk when they\n    can’t sit still.\nC) A look at what goes on in most classrooms these days makes it abundantly clear that when people think about education,\n    they are not thinking about what it feels like to be a child, or what makes childhood an important and valuable stage of life\n    in its own right.\nD) I’m a mother of three, a teacher, and a developmental psychologist. So I’ve watched a lot of children—talking, playing,\n    arguing, eating, studying, and being young. Here’s what I’ve come to understand. The thing that sets children apart from\n    adults is not their ignorance, nor their lack of skills. It’s their enormous capacity for joy. Think of a 3-year-old lost in the\n    pleasures of finding out what he can and cannot sink in the bathtub, a 5-year-old beside herself with the thrill of putting\n    together strings of nonsensical words with her best friends, or an 11-year-old completely absorbed in a fascinating comic\n    strip. A child’s ability to become deeply absorbed in something, and derive intense pleasure from that absorption, is\n    something adults spend the rest of their lives trying to return to.\nE) A friend told me the following story. One day, when he went to get his 7-year-old son from soccer practice, his kid greeted\n    him with a downcast face and a sad voice. The coach had criticized him for not focusing on his soccer drills. The little boy\n    walked out of the school with his head and shoulders hanging down. He seemed wrapped in sadness. But just before he\n\n                                                                   4\n\n                                       2015 年 12 月大学英语四级考试真题(一)\n\n     reached the car door, he suddenly stopped, crouching (蹲伏) down to peer at something on the sidewalk. His face went\n     down lower and lower, and then, with complete joy he called out, “Dad. Come here. This is the strangest bug I’ve ever seen.\n     It has, like, a million legs. Look at this. It’s amazing. ” He looked up at his father, his features overflowing with energy and\n     delight. “ Can’t we stay here for just a minute? I want to find out what he does with all those legs. This is the coolest ever. ”\nF)   The traditional view of such moments is that they constitute a charming but irrelevant byproduct of youth—something to be\n     pushed aside to make room for more important qualities, like perseverance (坚持不懈）, obligation, and practicality. Yet\n     moments like this one are just the kind of intense absorption and pleasure adults spend the rest of their lives seeking. Human\n     lives are governed by the desire to experience joy. Becoming educated should not require giving up joy but rather lead to\n     finding joy in new kinds of things: reading novels instead of playing with small figures, conducting experiments instead of\n     sinking cups in the bathtub, and debating serious issues rather than stringing together nonsense words, for example. In some\n     cases, schools should help children find new, more grown-up ways of doing the same things that are constant sources of\n     joy： making art, making friends, making decisions.\nG) Building on a child’s ability to feel joy, rather than pushing it aside, wouldn’t be that hard. It would just require a shift in the\n     education world’s mindset（思维模式）. Instead of trying to get children to work hard, why not focus on getting them to take\n     pleasure in meaningful, productive activity, like making things, working with others, exploring ideas, and solving problems?\n     These focuses are not so different from the things in which they delight.\nH) Before you brush this argument aside as rubbish, or think of joy as an unaffordable luxury in a nation where there is awful\n     poverty, low academic achievement, and high dropout rates, think again. The more horrible the school circumstances, the\n     more important pleasure is to achieving any educational success.\nI)   Many of the assignments and rules teachers come up with, often because they are pressured by their administrators, treat\n     pleasure and joy as the enemies of competence and responsibility. The assumption is that children shouldn’t chat in the\n     classroom because it hinders hard work； instead, they should learn to delay gratification(快乐）so that they can pursue\n     abstract goals, like going to college.\nJ)   Not only is this a boring and awful way to treat children, it makes no sense educationally. Decades of research have shown\n     that in order to acquire skills and real knowledge in school, kids need to want to learn. You can force a child to stay in his or\n     her seat, fill out a worksheet, or practice division. But you can’t force the child to think carefully, enjoy books, digest\n     complex information, or develop a taste for learning. To make that happen, you have to help the child find pleasure in\n     learning—to see school as a source of joy.\nK) Adults tend to talk about learning as if it were medicine: unpleasant, but necessary and good for you. Why not instead think\n     of learning as if it were food—something so valuable to humans that they have evolved to experience it as a pleasure?\nL)   Joy should not be trained out of children or left for after-school programs. The more difficult a child’s life circumstances,\n     the more important it is for that child to find joy in his or her classroom. “Pleasure” is not a dirty word. And it doesn’t run\n     counter to the goals of public education. It is, in fact, the precondition.\n\n46. It will not be difficult to make learning a source of joy if educators change their way of thinking.\n47. What distinguishes children from adults is their strong ability to derive joy from what they are doing.\n48. Children in America are being treated with shocking cruelty.\n49. It is human nature to seek joy in life.\n50. Grown-ups are likely to think that learning to children is what medicine is to patients.\n51. Bad school conditions make it all the more important to turn learning into a joyful experience.\n52. Adults do not consider children’s feelings when it comes to education.\n53. Administrators seem to believe that only hard work will lead children to their educational goals.\n54. In the so-called “effective” schools, children are taught self-control under a set of strict rules.\n55. To make learning effective, educators have to ensure that children want to learn.\n\n                                                                  5\n\n                                        2015 年 12 月大学英语四级考试真题(一)\n\nSection C\nDirections： There are 2 passages in this section. Each passage is followed by some questions or unfinished statements. For each\n          of them there are four choices marked A), B), C) and D). You should decide on the best choice and mark the\n          corresponding letter on Answer Sheet 2 with a single line, through the centre.\nPassage One\nQuestions 56 to 60 are based on the following passage.\n     When it’s five o’clock, people leave their office. The length of the workday, for many workers, is defined by time. They\nleave when the clock tells them they’re done.\n     These days, the time is everywhere: not just on clocks or watches, but on cell-phones and computers. That may be a bad\nthing, particularly at work. New research shows that clock-based work schedules hinder morale (士气) and creativity.\n     Clock-timers organize their day by blocks of minutes and hours. For example：a meeting from 9 a. m. to 10 a. m. , research\nfrom 10 a. m. to noon, etc. On the other hand, task-timers have a list of things they want to accomplish. They work down the list,\neach task starts when the previous task is completed. It is said that all of us employ a mix of both these types of planning.\n     What, then, are the effects of thinking about time in these different ways? Does one make us more productive? Better at the\ntasks at hand? Happier? In experiments conducted by Tamar Avnet and Anne-Laure Sellier, they had participants organize\ndifferent activities—from project planning, holiday shopping, to yoga —by time or to-do list to measure how they performed\nunder “clock time vs “task time.” They found clock timers to be more efficient but less happy because they felt little control over\ntheir lives. Task timers are happier and more creative, but less productive. They tend to enjoy the moment when something good\nis happening, and seize opportunities that come up.\n     The researchers argue that task-based organizing tends to be undervalued and under-supported in business culture. Smart\ncompanies, they believe, will try to bake more task-based planning into their strategies.\n     This might be a small change to the way we view work and the office, but the researchers argue that it challenges a\nwidespread characteristic of the economy: work organized by dock time. While most people will still probably need, and be, to\nsome extent, clock-timers, task-based timing should be used when perfoming a job that requires more creativity. It’ll make those\ntasks easier, arid the task- doers will be happier.\n56. What does the author think of time displayed everywhere?\n     A)     It makes everybody time-conscious.\n     B)     It is a convenience for work and life.\n     C)     It may have a negative effect on creative work.\n     D)     It clearly indicates the fast pace of modem life.\n57. How do people usually go about their work according to the author?\n     A)     They combine clock-based and task-based planning.\n     B)     They give priority to the most urgent task on hand.\n     C)     They set a time limit for each specific task.\n     D)     They accomplish their tasks one by one.\n58. What did Tamar Avnet and Anne-Laure Sellier find in their experiments about clocks timers?\n   A) They seize opportunities as they come up.                       C) They have more control over their lives.\n   B) They always get their work done in time.                        D) They tend to be more productive.\n59. What do the researchers say about today’s business culture?\n     A)     It does not support the strategies adopted by smart companies.\n     B)     It does not attach enough importance to task-based practice.\n     C)     It places more emphasis on work efficiency than on workers5 lives.\n     D)     It aims to bring employees, potential and creativity into full play.\n60. What do the researchers suggest?\n\n                                                                  6\n\n                                         2015 年 12 月大学英语四级考试真题(一)\n\n      A)      Task-based timing is preferred for doing creative work.\n      B)      It is important to keep a balance between work and life.\n      C)      Performing creative jobs tends to make workers happier.\n      D)      A scientific standard should be adopted in job evaluation.\n\nPassage Two\nQuestions 61 to 65 are based on the following passage.\n      Martha Stewart was charged, tried and competed of a crime in 2004. As she neared the end of her prison sentence, a\nwell-known columnist wrote that she was “ paying her dues,” and that “ there is simply no reason for anyone to attempt to deny\nher right to start anew.”\n      Surely, the American ideal of second chances should not be reserved only for the rich and powerful. Unfortunately, many\nfederal and state laws impose post-conviction restrictions on a shockingly large number of Americans, who are prevented from\never fully paying their debt to society.\n      At least 65 million people in the United States have a criminal record. This can result in severe penalties that continue long\nafter punishment is completed.\n      Many of these penalties are imposed regardless of the seriousness of the offense or the person’s individual circumstances.\nLaws can restrict or ban voting, access to public housing, and professional and business licensing. They can affect a person’s\nability to get a job and qualification for benefits.\n      In all, more than 45, 000 laws and rules serve to exclude vast numbers of people from fully participating in American life.\n      Some laws make sense. No one advocates letting someone convicted of pedophilia（恋童癖）work in a school. But too\noften collateral(附随的）consequences bear no relation to public safety. Should a woman who possessed a small amount of\ndrugs years ago be permanently unable to be licensed as a nurse?\n      These laws are also counterproductive, since they make it harder for people with criminal records to find housing or land a\njob, two key factors that reduce backsliding.\n      A recent report makes several recommendations, including the abolition of most post-conviction penalties, except for those\nspecifically needed to protect public safety. Where the penalties are not a must, they should be imposed only if the facts of a case\nsupport it.\n      The point is not to excuse or forget the crime. Rather, it is to recognize that in America’s vast criminal justice system,\nsecond chances are crucial. It is in no one’s interest to keep a large segment of the population on the margins of society.\n61. What does the well-known columnist’s remark about Martha Stewart suggest?\n      A)      Her past record might stand in her way to a new life.\n      B)      Her business went bankrupt while she was in prison.\n      C)      Her release from prison has drawn little attention.\n      D)      Her prison sentence might have been extended.\n62. What do we learn from the second paragraph about many criminals in America?\n      A)      They backslide after serving their terms in prison.\n      B)      They are deprived of chances to turn over a new leaf.\n      C)      They receive severe penalties for committing minor offenses.\n      D)      They are convicted regardless of their individual circumstances.\n63. What are the consequences for many Americans with a criminal record?\n    A) They remain poor for the rest of their lives.                    C) They are marginalized in society.\n    B) They are deprived of all social benefits.                        D) They are deserted by their family.\n64. What does the author think of the post-conviction laws and rules?\n      A)      They help to maintain social stability.\n\n                                                                    7\n\n                                      2015 年 12 月大学英语四级考试真题(一)\n\n     B)    Some of them have long been outdated.\n     C)    They are hardly understood by the public.\n     D)    A lot of them have negative effects on society.\n65. What is the author’s main purpose in writing the passage?\n     A)    To create opportunities for criminals to reform themselves.\n     B)    To appeal for changes in America’s criminal justice system.\n     C)    To ensure that people with a criminal record live a decent life.\n     D)    To call people’s attention to prisoners’ conditions in America.\n\nPart IV                                                Translation                                      (30 minutes)\nDirections： For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You should write your\n              answer on Answer Sheet 2.\n     中国父母往往过于关注孩子的学习，以至于不要他们帮忙做家务。他们对孩子的首要要求就是努力学习，考得好，\n能上名牌大学。他们相信这是为孩子好，因为在中国这样竞争激烈的社会里，只有成绩好才能保证前途光明。中国父\n母还认为，如果孩子能在社会上取得大的成就，父母就会受到尊敬。因此，他们愿意牺牲自己的时间、爱好和兴趣，\n为孩子提供更好的条件。\n\n                                                                8\n"}, "2015-12-02": {"title": "2015年12月四级真题(第2套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2015-12/02", "text": "                                        2015 年 12 月大学英语四级考试真题(二)\n\n2015 年 12 月大学英语四级考试真题（第 2 套)\nPart I                                                    Writing                                          (30 minutes)\nDirections ： For this part, you are allowed 30 minutes to write an essay commenting on the saying “Learning is a daily\n                experience and a lifetime mission.” You can cite examples to illustrate the importance of lifelong learning.\n                You should write at least 120 words but no more than 180 words.\n\nPart II                                           Listening Comprehension                                  (30 minutes)\nSection A\nDirections ： In this section, you will hear 8 short conversations and 2 long conversations. At the end of each conversation, one\n                or more questions will be asked about what was said. Both the conversation and the questions will he spoken\n                only once. After each question there will be a pause. During the pause, you must read the four choices marked\n                A), B), C) and D), and decide which is the best answer. Then mark the corresponding letter on Answer Sheet 1\n                with a single line through the centre.\n1.   A) The agenda for the board of directors’ meeting.\n     B) The details of the meeting to be held next week.\n     C) The reason for the man’s absence from the meeting.\n     D) The time for the man’s visit to the woman’s company.\n2.   A) At a travel agency.                                    C) In a library.\n     B) At a department store.                                 D) In a post office.\n3.   A) He cannot hear the woman’s call.                       C) He cannot recall the phone number.\n     B) He cannot get through to New York.                      D) He cannot find a public phone nearby.\n4.   A) Watch a movie with the woman.                           C) Do some shopping with Jane.\n     B) Revise his thesis in the office.                        D) Discuss his thesis with Prof. Hudson.\n5.   A) He just cannot work properly without a watch.\n     B) He has no idea where he can buy a gold watch.\n     C) He still does not know where he left his watch.\n     D) He is not sure what went wrong with his watch.\n6.   A) He forgot all about what he said.                       C) He was sorry for being off sick last week.\n     B) He slipped and hurt his head.                           D) He thought the woman’s car had been sold.\n7.   A) She should try to catch an earlier bus.                 C) She is always making excuses for being late.\n     B) She is absent from his class too often.                 D) She should come up with a better excuse.\n8.   A) He is going to help the woman out.                      C) He is on his way to see a real estate agent.\n     B) He has to move out of the building soon.                D) He will stay with the woman’s brother.\nQuestions 9 to 11 are based on the conversation you have just heard.\n9. A) From the wanted column.                                   C) From a telephone directory.\n     B) From some of her friends.                               D) From a television commercial.\n10. A) She received full-time education abroad.                 C) She finished her secondary school.\n     B）She graduated from an open university.                   D) She studied in a vocational college.\n11. A) She is a shorthand-typist.                               C) She is a policewoman\n      B) She works as a tour guide.                             D) She teaches an evening class.\nQuestions 12 to 15 are based on the conversation you have just heard.\n12. A) It provides him with career opportunities.               C) It has been off and on for ten years.\n\n                                        2015 年 12 月大学英语四级考试真题(二)\n\n      B) It helps enlarge his customer network.                   D) It was interrupted for four years.\n13. A) Individualized service.                                   C) Home-made beer.\n      B) Traditional setting.                                     D) Social games.\n14. A) The quality of beer.                                      C) The owner’s attitude.\n      B) The atmosphere.                                          D) The right location.\n15. A) It is a rather tough job.                                  C) It helps old people kill time.\n      B) It is a profitable business.                             D) It makes retirees feel useful.\nSection B\nDirections ： In this section, you will hear 3 short passages. At the end of each passage, you will hear some questions. Both the\n                passage and the questions will be spoken only once. After you hear a question, you must choose the best answer\n                from the four choices marked A), B), C), and D). Then mark the corresponding letter on Answer Sheet 1 with a\n                single line through the centre.\nPassage One\nQuestions 16 to 18 are based on the passage you have just heard.\n16.    A) It is becoming increasingly popular.                      C)   It gives rise to serious social instability.\n      B) It helps the user to escape reality.                      D)    It hurts a person and those around them.\n17.    A) They use drugs just for fun.                             C)    They use drugs as medicine.\n       They take drugs to get high.                                D)    They keep drug use a secret.\n18.    A) It is quite common in entertainment circles.\n      B) It is the cause of various social problems.\n      C) It is hard to get rid of.\n      D) It is fatal to the user.\nPassage Two\nQuestions 19 to 22 are based on the passage you have just heard.\n19.      A) Taking up exercises after recovery.                    C) Finding new ways to cure heart disease.\n         B) Producing tasty healthy frozen food.                   D) Going on a diet upon leaving the hospital.\n20.     A) It was carefully tested with consumers.                 C) It was disapproved by many diet experts.\n         B) It was promoted by health organizations.               D) It was highly expected by the general public.\n21.     A) Competitive price.                                      C) Vigorous promotion.\n         B) Low expectations.                                      D) Unique ingredients.\n22.     A) It was suggested by the firm’s vice-president.\n         B) It matches the food’s dark green packaging.\n         C) It has a positive implication for consumers.\n         D) It tricks the elders into impulse purchasing.\nPassage Three\nQuestions 23 to 25 are based on the passage you have just heard.\n23. A) It is practiced in most of the states.                     C) It has drawn a lot of criticism from overseas.\n       B)   It will be abolished sooner or later.                 D) It has to be approved by the Supreme Court.\n24. A) Whether the practice should be allowed to continue in future.\n       B)   Whether there should be a minimum age limit for execution.\n       C)   What type of criminals should receive it.\n       D)    What effect it might have on youngsters.\n25. A)      The court sentenced him to life in prison for killing two friends.\n       B)   The governor changed his death sentence to life in prison.\n       C)   He was the first minor to be executed in South Carolina.\n\n                                       2015 年 12 月大学英语四级考试真题(二)\n\n      D)    He was sentenced to death for a crime he committed as a minor.\n\nSection C\nDirections ： In this section, you will hear a passage three times. When the passage is read for the first time, you should listen\n               carefully for its general idea. When the passage is read for the second time, you are required to fill in the blanks\n               with the exact words you have just heard. Finally, when the passage is read for the third time, you should check\n               what you have written.\n      Some people borrow money and “forget” to pay it back.\n      Large loans are seldom the issue; they are usually treated as business 26 , with the terms spelled out on paper. But many\nwomen suffer 27 over problems like Carol’s “My friend Ginny is always 28 cash,” she says. “I hate to recall how often I’ve\n‘loaned’ her a dollar or two for a drink or a movie. Each loan is so small I’d feel really cheap making a big deal out of it; still, I\ndo 29 the fact that she never pays me back.\n      Carol admits to being “too 30 or something” to demand repayment, but she has resolved to stop lending money to Ginny.\nThe last time she asked for five dollars to pay for her dry cleaning, I just told her I couldn’t 31 it.”\n      Another woman suggests a bolder 32 . “When somebody refuses to repay a loan, I 33 by requesting one m y s e l f , ”\ns h e says. “ ‘I left home without my wallet,’ I’ll say. ‘Can you lend me enough to cover lunch?’ Then, when the money is safely\nin hand, I am struck by a sudden 34 . ‘Why, this is exactly the amount I loaned you last week! How 35 ! Now you won’t have\nto repay me ! ’ ” She says it works like a charm.\nPartⅢ                                     Reading Comprehension                                               (40 minutes)\nSection A\nDirections.. In this section, there is a passage with ten blanks. You are required to $elect one word for each blank from a list of\n               choices given in a word bank following the passage. Read the passage through carefully before making your\n               choices. Each choice in the bank is identified by a letter. Please mark the corresponding letter for each item on\n               Answer Sheet 2 with a single line through the centre. You may not use any of the words in the bank more than\n               once.\nQuestions 36 to 45 are based on the following passage.\n     For many Americans, 2013 ended with an unusually bitter cold spell. Late November and December 36 early snow and\nbone-chilling temperatures in much of the country, part of a year when, for the first time in two 37 ,record-cold days will likely\nturn out to have outnumbered record-warm ones. But the U. S. was the exception ： November was the warmest ever 38 , and\ncurrent data indicates that 2013 is likely to have been the fourth hottest year on record.\n      Enjoy the snow now, because 39 are good that 2014 will be even hotter, perhaps the hottest year since records have\nbeen kept. That’s because, scientists are predicting, 2014 will be an El Nino year.\n      El Nino, Spanish for “the child”, 40 when surface ocean waters in the southern Pacific become abnormally warm. So\nlarge is the Pacific, covering 30% of the planet’s surface, that the 41 energy generated by its warming is enough to touch off\na series of weather changes around the world. El Ninos are 42 with abnormally dry conditions in Southeast Asia and Australia.\nThey can lead to extreme rain in parts of North and South America, even as southern Africa 43 dry weather. Marine life may be\naffected too： El Ninos can 44 the rising of the cold, nutrient-rich(营养丰富的）water that supports large fish 45 , and the\nunusually warm ocean temperatures can destroy coral （珊瑚）.\n\n                                       2015 年 12 月大学英语四级考试真题(二)\n\n                       A) additional                                                    I) logically\n                       B) associated                                                    J) occurs\n                         C) bore                                                     K) populations\n                        D) chances                                                      L) realize\n                    E) communicated                                                     M) reduce\n                        F) decades                                                       N) saw\n\n                  G) Experiences                         G                             O) Specific\n                  H) globally                            )\n\nSection B\nDirections ： In this section, you are going to read a passage with ten statements attached to it. Each statement contains\n              information given in one of the paragraphs. Identify the paragraph from which the information is derived. You\n              may choose a paragraph more than once. Each paragraph is marked with a letter. Answer the questions by marking\n              the corresponding letter on Answer Sheet 2.\n                                                        How to Eat Well\nA) Why do so many Americans eat tons of processed food, the stuff that is correctly called junk (垃圾）and should really carry\n     warning labels?\nB)   It’s not because fresh ingredients are hard to come by. Supermarkets offer more variety than ever, and there are over four\n     times as many farmers, markets in the U. S. as there were 20 years ago. Nor is it for lack of available information. There are\n     plenty of recipes （食谱）how-to videos and cooking classes available to anyone who has a computer, smartphone or\n     television. If anything, the information is overwhelming.\nC)   And yet we aren’t cooking. If you eat three meals a day and behave like most Americans, you probably get at least a third of\n     your daily calories (卡路里）outside the home. Nearly two thirds of us grab fast food once a week, and we get almost 25%\n     of our daily calories from snacks. So we’re eating out or taking in，and we don’t sit down—or we do, but we hurry.\nD)   Shouldn’t preparing—and consuming—food be a source of comfort, pride, health, well-being, relaxation, sociability?\n     Something that connects us to other humans? Why would we want to outsource （外包）this basic task, especially when\n     outsourcing it is so harmful?\nE) When I talk about cooking, I’m not talking about creating elaborate dinner parties or three-day science projects. I’m talking\n     about simple, easy, everyday meals. My mission is to encourage green hands and those lacking time or money to feed\n     themselves. That means we need modest, realistic expectations, and we need to teach people to cook food that’s good\n     enough to share with family and friends.\nF)   Perhaps a return to real cooking needn’t be far off. A recent Harris poll revealed that 79% of Americans say they enjoy\n     cooking and 30% “love it”; 14% admit to not enjoying kitchen work and just 7% won’t go near the stove at all. But this\n     doesn’t necessarily translate to real cooking, and the result of this survey shouldn’t surprise anyone : 52% of those 65 or\n     older cook at home five or more times per week; only a third of young people do.\nG) Back in the 1950s most of us grew up in households where Mom cooked virtually every night. The intention to put a\n     home-cooked meal on the table was pretty much universal. Most people couldn’t afford to do otherwise.\nH) Although frozen dinners were invented in the 40s, their popularity didn’t boom until televisions became popular a decade or\n     so later. Since then, packaged, pre-prepared meals have been what’s for dinner. The microwave and fast-food chains were\n     the biggest catalyst (催化剂）, but the big food companies—which want to sell anything except the raw ingredients that go\n     into cooking— made the home cook an endangered species.\nI)   Still, I find it strange that only a third of young people report preparing meals at home regularly. Isn’t this the same crowd\n     that rails against processed junk and champions craft cooking? And isn’t this the generation who say they’ve concerned\n     about their health and the well-being of the planet? If these are truly the values of many young people, then their behavior\n     doesn’t match their beliefs.\n\n                                                                 4\n\n                                          2015 年 12 月大学英语四级考试真题(二)\n\nJ)     There have been half-hearted but well-publicized efforts by some food companies to reduce calories in their processed\n       foods, but the Standard American Diet is still the polar opposite of the healthy, mostly plant-based diet that just about every\n       expert says we should be eating. Considering that the government’s standards are not nearly ambitious enough, the picture is\n       clear: by not cooking at home, we’re not eating the right things, and the consequences are hard to overstate.\nK) To help quantify （量化） costs of a poor diet, I recently tried to estimate this impact in terms of a most famous food, the\n       burger（汉堡包）. I concluded that the profit from burgers is more than offset （抵消） by the damage they cause in health\n       problems and environmental harm.\nL)     Cooking real food is the best defense—not to mention that any meal you’ve likely to eat at home contains about 200 fewer\n       calories than one you would eat in a restaurant.\nM) To those Americans for whom money is a concern, my advice is simple: Buy what you can afford, and cook it yourself. The\n       common prescription is to primarily shop the grocery store, since that’s where fresh produce, meat and seafood, and dairy\n       are. And to save money and still eat well you don’t need local, organic ingredients; all you need is real food. I’m not saying\n       local food isn’t better; it is. But there is plenty of decent food in the grocery stores.\nN) The other sections you should get to know are the frozen foods and the canned goods. Frozen produce is still produce;\n       canned tomatoes are still tomatoes. Just make sure you’re getting real food without tons of added salt or sugar. Ask yourself,\n       would Grandma consider this food? Does it look like something that might occur in nature? It’s pretty much common sense:\n       you want to buy food, not unidentifiable foodlike objects.\nO) You don’t have to hit the grocery store daily, nor do you need an abundance of skill. Since fewer than half of Americans say\n       they cook at an intermediate level and only 20% describe their cooking skills as advanced, the crisis is one of confidence.\n       And the only remedy for that is practice. There’s nothing mysterious about cooking the evening meal. You just have to do a\n       little thinking ahead and redefine what qualifies as dinner. Like any skill, cooking gets easier as you do it more; every time\n       you cook, you advance your level of skills. Someday you won’t even need recipes. My advice is that you not pay attention to\n       the number of steps and ingredients, because they can be deceiving.\nP)     Time, I realize, is the biggest obstacle to cooking for most people. You must adjust your priorities to find time to cook. For\n       instance, you can move a TV to the kitchen and watch your favorite shows while you’re standing at the sink. No one is\n       asking you to give up activities you like, but if you’re watching food shows on TV, try cooking instead.\n     46. Cooking benefits people in many ways and enables them to connect with one another.\n     47. Abundant information about cooking is available either online or on TV.\n     48. Young people do less cooking at home than the elderly these days.\n     49. Cooking skills can be improved with practice.\n     50. In the mid-20th century, most families ate dinner at home instead of eating out.\n     51. Even those short of time or money should be encouraged to cook for themselves and their family.\n     52. Eating food not cooked by ourselves can cause serious consequences.\n     53. To eat well and still save money, people should buy fresh food and cook it themselves.\n     54. We get a fairly large portion of calories from fast food and snacks.\n     55. The popularity of TV led to the popularity of frozen food.\n\nSection C\n     Directions： There are 2 passages in this section. Each passage is followed by some questions or unfinished statements. For\n                   each of them there are four choices marked A), B), C) and D). You should decide on the best choice and mark\n                   the corresponding letter on Answer Sheet 2 with a single line through the centre.\n     Passage One\n     Questions 56 to 60 are based on the following passage.\n          The wallet is heading for extinction. As a day-to-day essential ， it will die off with the generation who read print\n     newspapers. The kind of shopping—where you hand over notes and count out change in return—now happens only in the\n\n                                                                     5\n\n                                         2015 年 12 月大学英语四级考试真题(二)\n\n  most minor of our retail encounters, like buying a bar of chocolate or a pint of milk from a comer shop. At the shops where you\n  spend any real money, that money is increasingly abstracted. And this is more and more true, the higher up the scale you go. At\n  the most cutting-edge retail stores—Victoria Beckham on Dover Street, for instance—you don’t go and stand at any kind of\n  cash register when you decide to pay. The staff are equipped with iPads to take your payment while you relax on a sofa.\n          Which is nothing more or less than excellent service, if you have the money. But across society, the abstraction of the\n  idea of cash makes me uneasy. Maybe I’m just old-fashioned. But earning money isn’t quick or easy for most of us. Isn’t it a\n  bit weird that spending it should happen in half a blink (眨眼）of an eye? Doesn’t a wallet—that time-honoured Friday-night\n  feeling of pleasing, promising fatness—represent something that matters?\n          But I’ll leave the economics to the experts. What bothers me about the death of the wallet is the change it represents in\n  our physical environment. Everything about the look and feel of a wallet—the way the fastenings and materials wear and tear\n  and loosen with age, the plastic and paper and gold and silver, and handwritten phone numbers and printed cinema tickets—is\n  the very opposite of what our world is becoming. The opposite of a wallet is a smartphone or an iPad. The rounded edges, cool\n  glass，smooth and unknowable as a pebble (鹅卵石）. Instead of digging through pieces of paper and peering into comers, we\n  move our fingers left and right. No more counting out coins. Show your wallet, if you still have one. It may not be here much\n  longer.\n56. What is happening to the wallet?\n      A) It is disappearing.                                           C) It is becoming costly,\n      B) It is being fattened.                                         D) It is changing in style.\n57. How are business transactions done in big modem stores?\n     A)     Individually.                                              C) In the abstract.\n     B)     Electronically.                                            D) Via a cash register.\n58. What makes the author feel uncomfortable nowadays?\n     A)     Saving money is becoming a thing of the past.\n     B)     The pleasing Friday-night feeling is fading.\n     C)     Earning money is getting more difficult.\n     D)     Spending money is so fast and easy.\n58. Why does the author choose to write about what’s happening to the wallet?\n     A)     It represents a change in the modem world.\n     B)     It has something to do with everybody’s life.\n     C)     It marks the end of a time-honoured tradition.\n     D)      It is the concern of contemporary economists.\n60. What can we infer from the passage about the author?\n     A)      He is resistant to social changes.\n     B)      He is against technological progress.\n     C)      He feels reluctant to part with the traditional wallet.\n     D)      He feels insecure in the ever-changing modem world.\nPassage Two\nQuestions 61 to 65 are based on the following passage.\n     Everybody sleeps, but what people stay up late to catch—or wake up early in order not to miss— varies by culture.\n     From data collected, it seems the things that cause us to lose the most sleep, on average, are sporting events, time changes,\nand holidays.\n     Around the world, people changed sleep patterns thanks to the start or end of daylight savings time, Russians, for example,\nbegan to wake up about a half-hour later each day after President Vladimir Putin shifted the country permanently to “winter\ntime” starting on October 26.\n     Russia’s other late nights and early mornings generally correspond to public holidays. On New Year’s Eve, Russians have\n\n                                                                       6\n\n                                        2015 年 12 月大学英语四级考试真题(二)\n\nthe world’s latest bedtime，hitting the hay at around 3:30 a.m.\n  、Russians also get up an hour later on International Women’s Day, the day for treating and celebrating female relatives.\n     Similarly, Americans, late nights, late mornings, and longest sleeps fall on three-day weekends. Canada got the least sleep\nof the year the night it beat Sweden in the Olympic hockey （冰球）. The World Cup is also chiefly responsible for sleep\ndeprivation(剥夺）.The worst night for sleep in the U. K was the night of the England-Italy match on June 14. Brits stayed up a\nhalf-hour later to watch it, and then they woke up earlier than usual the next morning thanks to summer nights, the phenomenon\nin which the sun barely sets in northern countries in the summertime. That was nothing, though, compared to Germans, Italians,\nand the French, who stayed up around an hour and a half later on various days throughout the summer to watch the Cup.\n     It should be made clear that not everyone has a device to record their sleep patterns; in some of these nations, it’s likely that\nonly the richest people do. And people who elect to track their sleep may try to get more sleep than the average person. Even if\nthat’s the case, though, the above findings are still striking. If the most health-conscious among us have such deep swings in our\nshut-eye levels throughout the year, how much sleep are the rest of us losing?\n61. What does the author say about peopled sleeping habits?\n      A) They are culture-related.                                C) They change with the seasons.\n      B) They affect peopled health.                              D) They vary from person to person.\n62. What do we learn about the Russians regarding sleep?\n     A)    They don’t fall asleep until very late.                   C)     They get less sleep on public holidays.\n     B)    They don’t sleep much on weekends.                        D)     They sleep longer than people elsewhere.\n63. What is the major cause for Europeans’ loss of sleep?\n     A)    The daylight savings time.                                C)     The World Cup.\n     B)    The colorful night life.                                  D)     The summertime.\n64. What is the most probable reason for some rich people to use a device to record their sleep patterns?\n      A) They have trouble falling asleep.                                C) They are involved in a sleep research.\n      B) They want to get sufficient sleep.                               D) They want to go to bed on regular hours.\n65. What does .the author imply in the last paragraph?\n     A)    Sleeplessness does harm to peopled health.\n     B)    Few people really know the importance of sleep.\n     C)    It is important to study our sleep patterns.\n     D)    Average people probably sleep less than the rich.\n\nPart IV                                                 Translation                                       (30 minutes)\nDirections： For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You should write your\n              answer on Answer Sheet 2.\n     云南省的丽江古镇是中国著名的旅游目的地之一。那里的生活节奏比大多数中国城市都要缓慢。丽江到处都是美\n丽的自然风光，众多的少数民族同胞提供了各式各样、丰富多彩的文化让游客体验。历史上，丽江还以“爱之城”而\n闻名。当地人中流传着许多关于因爱而生、为爱而死的故事。如今，在中外游客 眼中，这个古镇被视为爱情和浪漫\n的天堂(paradise)。\n\n                                                                 7\n"}, "2015-12-03": {"title": "2015年12月四级真题(第3套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2015-12/03", "text": "                           2015 年 12 月大学英语四级考试真题(第 3 套)\n\nPart Ⅰ Writing ( 30 minutes)\nDirections: For this part, you are allowed 30 minutes to write an essay commenting on the saying\"\nNever go out there to see what happens, go out there to make things happen.\" You can cit examples to\nillustrate the importance of being participants rather than mere onlookers in life. You should write at\nleast 120 words but no more than 180 words.\n\nPart Ⅱ Listening Comprehension ( 30 minutes)\nSheet 1 with a single line through the centre.\n1 A. Children should be taught to be more careful.\n    B. Children shouldn't drink so much orange juice.\n    C. There is no need for the man to make such a fuss.\n    D. Timmy should learn to do things in the right way.\n2. A. Fitness training.              B. The new job offer.\n    C. Computer programming. D. Directorship of the club.\n3. A. He needs to buy a new sweater.\n    B. He has got to save on fuel bills.\n    C. The fuel price has skyrocketed.\n    D. The heating system doesn't work.\n4. A. Committing theft.              B. Taking pictures.\n    C. Window shopping.              D. Posing for the camera.\n5. A. She is taking some medicine.\n    B. She has not seen a doctor yet.\n    C. She does not trust the man's advice.\n    D. She has almost recovered from the cough.\n6. A. Pamela's report is not finished as scheduled.\n    B. Pamela has a habit of doing things in a hurry.\n    C. Pamela is not good at writing research papers.\n    D. Pamela's mistakes could have been avoided.\n7. A. In the left-luggage office.    B. At the hotel reception.\n    C. In a hotel room.              D. At an airport.\n8. A. She was an excellent student at college.\n    B. She works in the entertainment business.\n    C. She is fond of telling stories in her speech.\n    D. She is good at conveying her message.\nQuestions 9 to 11 are based on the conversation you have just heard.\n9. A. Arranging the woman's appointment with Mr. Romero.\n    B. Fixing the time for the designer's latest fashion show.\n    C. Talking about an important gathering on Tuesday.\n    D. Preparing for the filming on Monday morning.\n10.A. Her travel to Japan.\n    B. The awards ceremony.\n    C. The proper hairstyle for her new role.\n    D. When to start the make-up session.\n11.A. He is Mr. Romero's agent.\n    B. He is an entertainment journalist.\n    C. He is the woman's assistant.\n    D. He is a famous movie star.\n\nQuestions 12 to 15 are based on the conversation you have just heard.\n12.A. Make an appointment for an interview.\n    B. Send in an application letter.\n    C. Fill in an application form.\n    D. Make a brief self-introduction on the phone.\n13.A. Someone having a college degree in advertising.\n    B. Someone experienced in business management.\n    C. Someone ready to take on more responsibilities.\n    D. Someone willing to work beyond regular hours.\n14.A. Travel opportunities.             B. Handsome pay.\n    C. Prospects for promotion.         D. Flexible working hours.\n15.A. It depends on the working hours.\n    B. It is about 500 pounds a week.\n    C. It will be set by the Human Resources.\n    D. It is to be negotiated.\nSection B\nDirections..In this section, you will hear 3 short passages. At the end of each passage, you will hear\nsome questions. Both the passage and the questions will be spoken only once. After you hear a\nquestion, you must choose the best answer from the four choices marked A., B, C and D..Then mark\nthe corresponding letter on Answer Sheet 1 with a single line through the center.\nPassage One\nQuestions 16 to 19 are based on the passage you have just heard.\n16.A. To give customers a wider range of choices.\n    B. To make shoppers see as many items as possible.\n    C. To supply as many varieties of goods as it can.\n    D. To save space for more profitable products.\n17.A. On the top shelves.               B. On the bottom shelves.\n    C. On easily accessible shelves.    D. On clearly marked shelves.\n18.A. Many of them buy things on impulse.\n    B. A few of them are fathers with babies.\n    C. A majority of them are young couples.\n    D. Over 60% of them make shopping lists.\n19.A. Sales assistants promoting high margin goods.\n    B. Sales assistants following customers around.\n    C. Customers competing for good bargains.\n    D. Customers losing all sense of time.\nPassage Two\nQuestions 20 to 22 are based on the passage you have just heard.\n20.A. Teaching mathematics at a school.\n    B. Doing research in an institute.\n    C. Studying for a college degree.\n    D. Working in a hi-tech company\n21.A. He studied the designs of various clocks.\n    B. He did experiments on different materials.\n    C. He bought an alarm clock with a pig face.\n    D. He asked different people for their opinions.\n22.A. Its automatic mechanism.\n    B. Its manufacturing process.\n    C. Its way of waking people up.\n\n   D. Its funny-looking pig face.\nPassage Three\nQuestions 23 to 25 are based on the passage you have just heard.\n23.A. It is often caused by a change of circumstances.\n   B. It actually doesn't require any special treatment.\n   C. It usually appears all of a sudden.\n   D. It generally lasts for several years.\n24.A. They cannot mix well with others.\n   B. They irrationally annoy their friends.\n   C. They depend heavily on family members.\n   D. They blame others for ignoring their needs.\n25.A. They lack consistent support from peers.\n   B. They doubt their own popularity.\n  C. They were born psychologically weak.\n  D. They focus too much on themselves.\n\nPart Ⅲ Reading Comprehension(40 minutes)\nSection A\nDirections: In this section, there is a passage with ten blanks. You are required to select one word for\neach blank from a list of choices given, in a word bank following the passage. Read the passage\nthrough carefully before making your choices. Each. choice in the bank is identified by a letter. Please\nmark the corresponding letter for each item on Answer Sheet2 with a single line through the center.\nYou may not use any of the words in the bank more than once.\n\nQuestions 36 to 45 are based on the following passage.\n      Children do not think the way adults do. For most of the first year of life, if something is out of\nsight, it's out of mind. If you cover a baby's36toy with a piece of cloth, the baby thinks the toyhas\ndisappeared and stops looking for it. A 4-year-old may 37 that a sister has more fruit juice when it is\nonly the shapes of the glasses that differ, not the38 of juice.\n      Yet children are smart in their own way. Like good little scientists, children are always testing\ntheir child-sized39 about how things work. When your child throws her spoon on the floor for the sixth\ntime as you try to feed her, and you say, \"That's enough! I will not pick up your spoon again!\" the child\nwill 40 test your claim. Are you serious? Are you angry? What will happen if she throws the spoon\nagain? She is not doing this to drive you41; rather, she is learning that her desires and yours can differ,\nand that sometimes those42 are important and sometimes they are not.\n      How and why does children's thinking change? In the 1920s, Swiss psychologist Jean Piaget\nproposed that children's cognitive (认知的) abilities unfold 43, like the blooming of a flower, almost\nindependent of what else is44in their lives. Although many of his specific conclusions havebeen45 or\nmodified over the years, his ideas inspired thousands of studies by investigators all over the world.\n\nA. advocate       B. amount         C. confirmed          D. crazy          E. definite\nF. differences    G. favorite       H. happening          I. Immediately    J. Naturally\nK. Obtaining      L. Primarily      M. Protest            N. Rejected       O. theories\n\nSection B\nDirections: In this section, you are going to read a passage with, ten statements attached to it. Each\nstatement contains information given in one of the paragraphs. Identify the paragraph from which the\ninformation is derived. You may choose a paragraph more than once. Each paragraph is marked with a\nletter. Answer the questions by marking the corresponding letter on Answer Sheet 2.The Perfect Essay\n\n      A. Looking back on too many years of education, I can identify one truly impossible teacher. She\ncared about me, and my intellectual life, even when I didn't. Her expectations were high--impossibly\nso. She was an English teacher. She was also my mother.\n      B. When good students turn in an essay, they dream of their instructor returning it to them in\nexactly the same condition, save for a single word added in the margin of the final page : \"Flawless.\"\nThis dream came true for me one afternoon in the ninth grade. Of course, I had heard that genius could\nshow itself at an early age, so I was only slightly taken aback that I had achieved perfection at the\ntender age of 14.Obviously, I did what any professional writer would do; I hurried off to spread the\ngood news. I didn't get very far. The first person I told was my mother.\n      C. My mother, who is just shy of five feet tall, is normally incredibly soft-spoken, but on the rare\noccasion when she got angry, she was terrifying. I am not sure if she was more upset by my hubris(得\n意忘形) or by the fact that my English teacher had let my ego get so out of hand. In any event, my\nmother and her red pen showed me how deeply flawed a flawless essay could be. At the time, I am\nsure she thought she was teaching me about mechanics, transitions (过渡), structure, style and voice.\nBut what I learned, and what stuck with me through my time teaching writing at Harvard, was a deeper\nlesson about the nature of creative criticism.\n      D. First off, it hurts. Genuine criticism, the type that leaves a lasting mark on you as a writer, also\nleaves an existential imprint (印记) on you as a person. I have heard people say that a writer should\nnever take criticism personally. I say that we should never listen to these people.\n      E. Criticism, at its best, is deeply personal, and gets to the heart of why we write the way we do.\nThe intimate nature of genuine criticism implies something about who is able to give it, namely,\nsomeone who knows you well enough to show you how your mental life is getting in the way of good\nwriting. Conveniently, they are also the people who care enough to see you through this painful\nrealization. For me it took the form of my first, and I hope only, encounter with writer's block--I was\nnot able to produce anything for three years.\n      F. Franz Kafka once said: \"Writing is utter solitude (独处), the descent into the cold abyss (深渊)\nof oneself.\" My mother's criticism had shown me that Kafka is right about the cold abyss, and when\nyou make the introspective (内省的) descent that writing requires you are not always pleased by what\nyou find. But, in the years that followed, her sustained tutoring suggested that Kafka might be wrong\nabout the solitude. I was lucky enough to find a critic and teacher who was willing to make the journey\nof writing with me.\"It is a thing of no great difficulty,\" according to Plutarch, \"to raise objections\nagainst another man's speech, it is a very easy matter; but to produce a better in its place is a work\nextremely troublesome.\" I am sure I wrote essays in the later years of high school without my mother's\nguidance, but I can't recall them. What I remember, however, is how she took up the \"extremely\ntroublesome\" work of ongoing criticism.\n      G. There are two ways to interpret Plutarch when he suggests that a critic should be able to\nproduce \"a better in its place.\" In a straightforward sense, he could mean that a critic must be more\ntalented than the artist she critiques (评论).My mother was well covered on this count. But perhaps\n      Plutarch is suggesting something slightly different, something a bit closer to Marcus Cicero's\nclaim that one should \"criticize by creation, not by finding fault.\" Genuine criticism creates a precious\nopening for an author to become better on his own terms--a process that is often extremely painful, but\nalso almost always meaningful.\n      H. My mother said she would help me with my writing, but first I had to help myself. For each\nassignment, I was to write the best essay I could. Real criticism is not meant to find obvious mistakes,\nso if she found any--the type I could have found on my own--I had to start from scratch. From scratch.\nOnce the essay was \"flawless,\" she would take an evening to walk me through my errors. That was\nwhen true criticism, the type that changed me as a person, began.\n      I. She criticized me when I included little-known references and professional jargon (行话).She\n\nhadno patience for brilliant but irrelevant figures of speech.\"Writers can't bluff (虚张声势) their way\nthrough ignorance.\" That was news to me--I would need to freed another way to structure my daily\nexistence.\n     J. She trimmed back my flowery language, drew lines through my exclamation marks and argued\nfor the value of restraint in expression.\"John,\" she almost whispered. I leaned in to hear her: \"I can't\nhear you when you shout at me.\" So I stopped shouting and bluffing, and slowly my writing improved.\n     K. Somewhere along the way I set aside my hopes of writing that flawless essay. But perhaps I\nmissed something important in my mother's lessons about creativity and perfection. Perhaps the point\nof writing the flawless essay was not to give up, but to never willingly finish. Whit man repeatedly\nreworked \"Song of Myself' between 1855 and 1891.Repeatedly.We do our absolute best with a piece of\nwriting, and come as close as we can to the ideal. And, for the time being, we settle. In critique,\nhowever, we are forced to depart, to give up the perfection we thought we had achieved for the chance\nof being even a little bit better. This is the lesson I took from my mother: If perfection were possible, it\nwould not be motivating.\n\n46.The author was advised against the improper use of figures of speech.\n47.The author's mother taught him a valuable lesson by pointing out lots of flaws in his seemingly\nperfect essay.\n48.A writer should polish his writing repeatedly so as to get closer to perfection.\n49.Writers may experience periods of time in their life when they just can't produce anything.\n50.The author was not much surprised when his school teacher marked his essay as \"flawless\".\n51.Criticizing someone's speech
