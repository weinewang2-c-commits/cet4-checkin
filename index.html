d 4 are based on the news report you have just heard.\n    3. A. Communicate with astronauts in Mars Dune Alpha.\n       B. Work in an environment resembling Mars.\n       C. Build a Martian habitat in Houston.\n       D. Send in applications before Friday.\n    4. A. Ready-made food.                                   C. Food they grow.\n       B. Food that is organic.                              D. Potatoes mostly.\n    Questions 5 to 7 are based on the news report you have just heard.\n    5. A. He apologized for scratching an athlete’s gold medal.\n       B. He was asked to present a gold medal to Miu Goto.\n       C. He bit a softball player’s Olympic gold medal.\n       D. He attracted public attention at a media event.\n    6. A. Have another picture taken with the Olympic medalist.\n       B. Apologize to the International Olympic Committee.\n\n1                                                                            https://zhenti.burningvocabulary.com/\n\n       C. Get the damaged medal repaired.\n       D. Pay for the cost of a new medal.\n    7. A. Allow no one to touch them.                         C. Treat them as treasures.\n       B. See them as symbols of honor.                       D. Keep them in a safe place.\n\n    Section B\n    Directions: In this section, you will hear two long conversations. At the end of each conversation, you\n    will hear four questions. Both the conversation and the questions will be spoken only once. After you\n    hear a question, you must choose the best answer from the four choices marked A), B), C) and D).\n    Then mark the corresponding letter on Answer Sheet 1 with a single line through the centre.\n\n    Questions 8 to 11 are based on the conversation you have just heard.\n    8. A. She covered its screen with a plastic sheet.\n       B. She connected it with her smart phone.\n       C. She decorated it with colorful stickers.\n       D. She bought some new software for it.\n\n    9. A. It may not be simply blue.                          C. It is more harmful to young people.\n       B. It includes unnatural light.                        D. It induces people to fall asleep.\n\n    10. A. He has had much trouble falling asleep.\n       B. He has had some sort of health problems.\n       C. He has stayed up playing computer games.\n       D. He has been burdened with excessive work.\n    11. A. Exposure to blue light is the chief cause of obesity.\n       B. Sleep may be more important than people assumed.\n       C. Sleep may also be negatively affected by natural light.\n       D. Overuse of electronic devices may cause heart disease.\n    Questions 12 to 15 are based on the conversation you have just heard.\n    12. A. What they wanted to be when grown up.\n       B. What their favorite cartoon character was.\n       C. What they learned from computer games.\n       D. What they liked to do most after school.\n\n    13. A. A stock broker.                                    C. A mechanical engineer.\n       B. A pop singer.                                       D. A basketball player.\n\n    14. A. Ambitious.            B. Sensible.            C. Imaginative.                D. Practical.\n\n    15. A. Relax their strict control of their kids.\n       B. Help their kids understand themselves.\n       C. Impose their own dreams on their kids.\n       D. Dismiss their high expectations of their kids.\n\n2                                                                              https://zhenti.burningvocabulary.com/\n\n    Section C\n    Directions: In this section, you will hear three passages. At the end of each passage, you will hear\n    three or four questions. Both the passage and the questions will be spoken only once. After you hear a\n    question, you must choose the best answer from the four choices marked A), B), C) and D). Then\n    mark the corresponding letter on Answer Sheet 1 with a single line through the centre.\n\n    Questions 16 to 18 are based on the passage you have just heard.\n    16. A. Set up company branches.                             C. Introduce iPhones into its markets.\n       B. Improve its infrastructure.                           D. Promote Internet-ready phones.\n\n    17. A. They cater to Africans’ needs.                       C. They are more powerful and capable.\n       B. They are more expensive models.                       D. They boast the longest battery life.\n\n    18. A. A large touchscreen.                                 C. A voice-response device.\n       B. An old-school keypad.                                 D. A digitally-designed system.\n    Questions 19 to 21 are based on the passage you have just heard.\n    19. A. It ensured sustainable economic growth.\n       B. It was strongly opposed by manufacturers.\n       C. It was cheaper than using fossil fuel plastic.\n       D. It satisfied consumer demands on the whole.\n\n    20. A. The capacity to mass produce it.\n       B. The US federal government’s regulations.\n       C. A boom in market demand for clear plastic bottles.\n       D. A rapid increase in US petroleum chemical production.\n    21. A. Require companies to use 30% of new plastic.\n       B. Increase the supply of new plastic in the market.\n       C. Reduce the amount of plastic pollution in local areas.\n       D. Take measures to promote the use of recycled plastic.\n    Questions 22 to 25 are based on the passage you have just heard.\n    22. A. It studies dreams.                                   C. It is a hotel for business people.\n       B. It rents a place for nap-takers.                      D. It is a nap research institute.\n\n    23. A. To find out creative people’s work performance.\n       B. To see how many people can go without napping.\n       C. To understand the obvious importance of napping.\n       D. To feel how difficult it is to get his idea across.\n\n    24. A. They decline due to pointless meetings.\n       B. They depend on his ability to concentrate.\n       C. They enable him to enjoy a creative career.\n       D. They are affected by the overuse of social media.\n\n3                                                                               https://zhenti.burningvocabulary.com/\n\n    25. A. Some bosses associate napping with laziness.\n       B. Many office workers nap during work hours.\n       C. Some bosses can concentrate without napping.\n       D. Many of his friends daydream in the office.\n\n    Part III                              Reading Comprehension                                ( 40 minutes)\n    Section A\n    Directions: In this section, there is a passage with ten blanks. You are required to select one word for\n    each blank from a list of choices given in a word bank following the passage. Read the passage\n    through carefully before making your choices. Each choice in the bank is identified by a letter. Please\n    mark the corresponding letter for each item on Answer Sheet 2 with a single line through the centre.\n    You may not use any of the words in the bank more than once.\n\n           Whether you’re just having a down day or a down period, taking a walk can instantly lift your\n    mood, especially when you go outdoors. Not only can walking make you less depressed, but\n    according to a new study, depression sufferers who took a           26     walk showed just as much\n    improvement in their        27    as people taking medicine. In fact, 60-70 percent of the participants\n    in the study could no longer even be        28     as depressed.\n           Bone density may not be one of the most exciting health benefits of walking, but it’s an\n    important one. People with stronger bones avoid osteoporosis (骨质疏松症) and all the problems\n    that      29     with it, like breaks and other disabilities. And the best way to get strong, healthy\n    bones is by doing weight-bearing exercises like running, dancing and walking, according to a large\n    study. But as regards bones, it’s     30     use it or lose it: To keep your bones strong you have to\n    keep exercising. The researchers found that adults who walked regularly had better bone density\n    throughout their lives than their     31    friends.\n           Taking a walk can be great for        32        your head or blowing off some steam. It also\n    provides a great opportunity to       33     with friends and family, far away from electronics and\n    other      34    at home. Even better, you set a powerful example because when they see you                35\n    the benefits of walking, they’ll be encouraged to walk more, too.\n\n                      A. accompany              F. come                 K. inactive\n                      B. approved               G. daily                L. occurrences\n                      C. bond                   H. definitely           M. reaping\n                      D. classified             I. distractions         N. symptoms\n                      E. clearing               J. exclusively          O. typical\n\n4                                                                             https://zhenti.burningvocabulary.com/\n\n    Section B\n    Directions: In this section, you are going to read a passage with ten statements attached to it. Each\n    statement contains information given in one of the paragraphs. Identify the paragraph from which the\n    information is derived. You may choose a paragraph more than once. Each paragraph is marked with\n    a letter. Answer the questions by marking the corresponding letter on Answer Sheet 2.\n                         A Club Where Lions Dance and Traditions Take Root\n    A. The first thing you notice in the staircase to the fourth-floor studio on Canal Street in\n       Manhattan, New York, is the measured thumping (嘭嘭声) coming from behind a metal door.\n       Just beyond the entrance, large lion masks were twisting and turning to the drum-beat. On a\n       recent Friday evening, the teenagers made their way across the studio floor as they practiced\n       Chinese lion dancing.\n    B. “You want to play in a circle” Victor Fong, aged 24, told his students at the New York Chinese\n       Freemasons Athletic Club. “Take it slow and do it again.” The dance group, made up of 60\n       members, performs throughout the year but was now preparing for its biggest events Chinese\n       Lunar New Year celebrations, which will begin on Saturday and conclude on February 15.\n       Teenagers comprise about half of the group, many of whom began lion dancing at the age of\n       14. About 100 current and past members of the dance group — which has been performing\n       since 1956 — will be among the 220 groups marching through Chinatown in Manhattan for the\n       18th Lunar New Year Parade on February 5.\n\n    C. Mr. Fong has been involved in the organization since he was 15 and began teaching lion\n       dancing three years ago. But the club also acts as a recreation center and safe haven( 庇护所)\n       for teenagers, with video games readily available. As many as 20 students show up after school.\n       “The basic requirement for hanging out here is you have to learn how to lion dance,” Mr. Fong\n       said. While that is not a formal requirement for being a member, everyone finds a way to\n       participate in the Lunar New Year Parade, whether it’s by dancing, carrying a flag or beating a\n       drum.\n\n    D. Alvin Chau, aged 26, is an environmental consultant by day and a lion dancer on weekends.\n       He has been a club member for 10 years and joined because of an interest in lion dance.\n       “We’re a big family,” he said, shaking hands with other members as they walked through the\n       door. “You know everyone.”\n    E. It is believed that the lion dance began in the third century. Stories vary about how lion\n       dancing came to be, but most of them include a monster named Nian who would terrorize a\n       village. The villagers finally banded together and scared the beast away with firecrackers (爆竹)\n       and drums. While lions are not native to China, some versions of the story include the villagers\n       creating a monster of their own in the shape of a lion to fight off the beast.\n\n    F. Today, the dancers travel across Chinatown going from business to business to bring good luck\n       for the coming year. The new year — according to the Chinese lunar calendar — will begin on\n       Saturday and marks the Year of the Rooster (鸡年), which is thought to be a symbol of\n       positivity. “It’s almost like the dark night is ending and the sun is coming up,” said Ya Yung\n5                                                                           https://zhenti.burningvocabulary.com/\n\n       Teng, the digital collections coordinator for the Museum of Chinese in America. “It’s hopeful\n       that we’re going to have a new day.” Roosters and chickens are not particularly strong\n       creatures, Ms. Teng said, but they are numerous. “In a way,” she said, the rooster “stands for\n       ‘We the People.’ ”\n\n    G. The lion head and tail are operated by two people. As one person controls the head, a second\n       follows under a train of fabric representing the body. The dancers move in harmony as they\n       imitate the animal’s natural movements in the wild, including the aggressiveness of an attack. A\n       lion head figure weighs under 10 pounds and sits squarely on the dancer’s shoulders. Inside,\n       the dancer manipulates strings that open and close the lion’s eyes, shake its ears and open its\n       mouth to reveal a fire-orange tongue.\n\n    H. “A good lion dancer will imitate a living creature,” said Karlin Chan, aged 59, who heads the\n       athletic club’s community public relations. “I started lion dancing when I was a kid,” he said.\n       “Chinatown was much smaller then and it was a celebration with fireworks and firecrackers,\n       which added a lot of flavor and meaning to it.”\n    I. Mr. Chan buys a new lion head each year when he travels to China. A head costs about $1,500.\n       “If you want the good stuff, the quality, you have to see it for yourself,” he said. “I’ll inspect\n       the product before we put it in the container and ship it over.” Mr. Chan, who has been\n       involved with the club for nearly 50 years, said that passing the dance from one generation to\n       the next was vital. “You need to pass on the traditions and the culture, and this is a part of our\n       culture,” he said. “It’s a great way to promote cultural understanding and exchange; we\n       welcome that.”\n    J. For Sara Pore, aged 17, another club member, lion dance is more than just tradition; it provides\n       a creative outlet. “Lion dancing started 2,000 years ago — that’s incredible,” she said. “But\n       what makes you a competent lion dancer is that there’s a sense of imagination involved. Lion\n       dancing teaches competence in leadership because of this. You’re constantly forced to push\n       yourself past your limit.”\n\n    K. Back at rehearsal (排练), Justin Le, aged 18, tied a red ribbon around his waist to practice\n       jumping. The dancers use the ribbons to pull themselves up over their partners’ heads. The\n       room’s ceilings are too low to wear the lion heads for jumping practice, so once up on his\n       partner’s head, Mr. Le held out his arms as if in offering.\n\n    L. Mr. Le comes by the dance as a legacy (传承). “I was born into it,” Mr. Le said, noting that\n       his uncle and father were club members. “Growing up, I would always watch my family and\n       see the lion dance, and I slowly grew interested in it.” By the age of 14, he was fully enrolled\n       in the athletic club’s lion dance group. “I value my culture and tradition, being Chinese or\n       Asian-American. I have a lot of pride in that,” he said. “I want to contribute and give back to\n       the community.”\n\n6                                                                           https://zhenti.burningvocabulary.com/\n\n    36. The lion dancers perform from door to door to bring New Year wishes to business people.\n    37. The New York dance club also serves as a place for entertainment where youngsters can enjoy\n       themselves safely.\n    38. Lion dancers need to have a little imagination to perform well.\n    39. There are a number of different versions about the origin of the lion dance.\n    40. Some 50% of the members of a New York lion dance club are teenagers.\n    41. One club member says he feels proud of his cultural tradition.\n    42. Two dancers coordinate their movements, one manipulating the lion’s head and the other its\n       body.\n    43. One lion dancer compares their New York dance club to a family.\n    44. Lion dance should be handed down to future generations as part of Chinese culture.\n    45. One lion dancer learned how to perform from his elders.\n\n    Section C\n    Directions: There are 2 passages in this section. Each passage is followed by some questions or\n    unfinished statements. For each of them there are four choices marked A), B), C) and D). You should\n    decide on the best choice and mark the corresponding letter on Answer Sheet 2 with a single line\n    through the centre.\n\n    Passage One\n    Questions 46 to 50 are based on the following passage.\n        Team-building exercises have become popular for managers trying to increase organisational\n    and team harmony and productivity. Unfortunately many employees resent compulsory bonding and\n    often regard these exercises as a nuisance.\n        A paper published this week by University of Sydney researchers in Social Networks has\n    reported participants’ feelings about team-building interventions ( 干 预 ), revealing ethical\n    implications in forcing employees to take part.\n        “Many people see team building activities as a waste of time, so we decided to look in more\n    depth at what’s behind this,” said the paper’s lead researcher, Dr Peter Matous.\n        “Teams are formed, combined and restructured. Staff are relocated and office spaces redesigned.\n    All this is done with the aim of improving workplace efficiency, collaboration and cohesion. But\n    does any of this work?” said Dr Matous.\n        The study found that team-building exercises which focused on the sharing of and intervening\n    into personal attitudes and relationships between team members were considered too heavy-handed\n    and intrusive, although the researchers say some degree of openness and vulnerability is often\n    necessary to make deep, effective connections with colleagues.\n        “Some participants were against team-building exercises because they were implicitly\n    compulsory. They didn’t welcome management’s interest in their lives beyond their direct work\n    performance,” said Matous. “Many people don’t want to be forced into having fun or making\n\n7                                                                           https://zhenti.burningvocabulary.com/\n\n    friends, especially not on top of their busy jobs. They feel management is being too nosy or trying\n    to control their lives too much.”\n        In this study the researchers recommended a self-disclosure (表露) approach where participants\n    were guided through a series of questions that allowed them to increasingly disclose personal\n    information and values. The method is well-tested and has been shown to increase interpersonal\n    closeness. However, to be successful it must be voluntary.\n        The researchers said there are numerous schools of thought that propose differing\n    psychological methods for strengthening relationships. “With caution, many relational methods to\n    improve teams and organisations can be borrowed from other fields. The question is how to apply\n    them effectively to strengthen an entire collective, which is more than just the sum of individual\n    relationships,” said Dr Matous.\n    46. Why are many employees opposed to team-building exercises?\n        A. They consider such exercises annoying.\n        B. They deem these exercises counter-productive.\n        C. They see such exercises as harmful to harmony.\n        D. They find these exercises too demanding.\n\n    47. What did Dr Matous and his team do to find out whether team-building activities would\n       improve productivity?\n        A. They relocated team leaders and their offices.\n        B. They rearranged the staff and office spaces.\n        C. They redesigned the staff’s work schedules.\n        D. They reintroduced some cohesive activities.\n\n    48. What did the study by Matous’ team find about some team-building exercises?\n        A. They were intended to share personal attitudes and relationships.\n        B. They implicitly added to the vulnerability of team members.\n        C. They invariably strengthened connections among colleagues.\n        D. They were regarded as an intrusion into employees’ private lives.\n\n    49. How can the self-disclosure approach succeed in increasing interpersonal closeness?\n        A. By allowing participants freedom to express themselves.\n        B. By applying it to employees who volunteer to participate.\n        C. By arranging in proper order the questions participants face.\n        D. By guiding employees through a series of steps in team building.\n    50. What does Matous think of the various psychological methods borrowed from other fields for\n       strengthening relationships?\n        A. They must be used in combination for an entire collective.\n        B. They prioritise some psychological aspects over others.\n        C. They place too much stress on individual relationships.\n        D. They have to be applied cautiously to be effective.\n\n8                                                                          https://zhenti.burningvocabulary.com/\n\n    Passage Two\n    Questions 51 to 55 are based on the following passage.\n        There are close to 58,000 homeless people in Los Angeles county. That’s a shocking and\n    tragic number for a region that’s home to some of the richest people in the world. At last, the\n    problem became so acute — and so visible — that Los Angeles took extraordinary action. The\n    citizens of this county voted in November 2016 and again in March 2017 to raise their own taxes.\n    The purpose of such action is to fund an enormous multibillion-dollar 10-year program of housing\n    and social services for the homeless.\n        As a result, Los Angeles now has its best chance in decades to combat homelessness. This is\n    an opportunity that surely all can agree must not be wasted. It is neither desirable nor morally\n    acceptable nor practical for this county to tolerate the signs of deprivation more commonly\n    associated with the slums (贫民窟) of Rio de Janiero.\n        How did we get here? For as long as there are homeless people, there is a tendency to blame\n    the victims themselves for their condition — to see their failure to thrive as an issue of character,\n    of moral weakness, of laziness. But contrary to popular belief, the homeless in Los Angeles are not\n    mostly mentally ill or drug addicted or frightening, although a sizable minority meet some of those\n    descriptions. Today, a greater and greater proportion of people living on the streets are there\n    because of bad luck or a series of mistakes, or because the economy forgot them — they lost a\n    job or were evicted (逐出) or fled an abusive marriage just as the housing market was growing\n    increasingly unforgiving.\n        The challenges are enormous, even if everyone is pulling in the same direction. That reality\n    was driven home this month by a new Los Angeles Homeless Services Authority report showing\n    that the county’s homeless population is growing faster than the supply of new housing.\n        In the world’s richest nation, homelessness on this scale should be shameful and shocking. But\n    most Los Angeles residents are no longer either shocked or shamed. Increasingly, we are\n    uncomfortable, annoyed, disgusted, scared or unaware. Compassion (同情心) is being replaced by\n    resignation.\n\n    51. Why did the citizens of Los Angeles vote to raise their own taxes?\n        A. To combat the county’s homelessness.\n        B. To reform the county’s service system.\n        C. To fund the development of local infrastructure.\n        D. To narrow the gap between the rich and the poor.\n\n    52. What do people tend to believe about the homeless?\n        A. They seldom meet the descriptions of homelessness.\n        B. They are the victims of fast economic development.\n        C. They are responsible for their own condition.\n        D. They account for the majority of drug addicts.\n\n9                                                                            https://zhenti.burningvocabulary.com/\n\n     53. What is one of the causes for more and more people in Los Angeles to become homeless?\n         A. They find it increasingly difficult to afford a place to live.\n         B. The divorce rate in the county has been on a steady rise.\n         C. They have been compelled to take low-paying jobs.\n         D. The society fails to forgive them for their mistakes.\n\n     54. What do we learn from the new Los Angeles Homeless Services Authority report?\n         A. Supplying enough job opportunities for the homeless remains a challenge.\n         B. Everyone is pulling in the same direction to solve the homelessness problem.\n         C. The increase in new housing falls short of the demand of the growing homeless population.\n         D. Los Angeles’ homeless condition is deteriorating faster than many people predict.\n\n     55. How do most Los Angeles residents now feel about homelessness?\n         A. They are increasingly ashamed about its scale.\n         B. They find it no more scaring than it appears.\n         C. They are less and less indifferent to it.\n         D. They no longer find it shocking.\n\n     Part IV                              Translation                                        ( 30 minutes)\n     Directions: For this part, you are allowed 30 minutes to translate a passage from Chinese into\n     English. You should write your answer on Answer Sheet 2.\n         改革开放 40 多年以来，中国政府对高等教育越来越重视，高等教育已经进入稳步发展阶段。\n     高校学生总数已接近 4700 万人，位居世界第一。 随着我国经济的快速发展，人民生活水平不断\n     提高，越来越多的人渴望接受高等教育。我国高校的数量和学科专业持续增加，招生人数逐年上\n     升,教学质量也在不断改进，为更多年轻人创造了接受高等教育的机会。\n\n10                                                                           https://zhenti.burningvocabulary.com/"}, "2023-06-03": {"title": "2023年6月四级真题(第3套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2023-06/03", "text": "                  2023 年 6 月大学英语四级考试真题（第 3 套）\n\n    Part I                                            Writing                                              ( 30 minutes)\n    Directions: Suppose your university is conducting a survey to collect students’ opinions of online classes. You\n    are to write a response to the survey about their advantages and disadvantages, and what improvements can\n    be made. You will have 30 minutes for the task. You should write at least 120 words but no more than 180\n    words.\n\n    Part II                                Listening Comprehension                                         ( 25 minutes)\n    提示：2023 年 6 月全国只考两套听力，故本套未重复显示。\n\n    Part III                               Reading Comprehension                                          ( 40 minutes)\n    Section A\n    Directions: In this section, there is a passage with ten blanks. You are required to select one word for each\n    blank from a list of choices given in a word bank following the passage. Read the passage through carefully\n    before making your choices. Each choice in the bank is identified by a letter. Please mark the corresponding\n    letter for each item on Answer Sheet 2 with a single line through the centre. You may not use any of the words\n    in the bank more than once.\n\n        Morocco is responding to increasing energy demands by setting up one of the largest solar plants in\n    the world.\n        The Noor solar power station is         26        in the city of Ouarzazate and, once completed, will generate\n    580 million watts of electricity. The World Bank estimates it will serve 1.1 million people. It’s              27     to\n    be completed soon.\n        Morocco’s current energy comes               28      from imports. The nation hopes to get 50 percent of its\n    energy from renewable sources by 2030. With demand for energy                 29    at an annual rate of 7 percent,\n    the new solar plant could be a    30    part of that goal.\n        “This makes Morocco a big          31        in the field of solar energy in the Arab region and the African\n    continent. It could also be a forerunner for many other countries in the world that                 32     on foreign\n    imports of energy,” said Ali Hajji, a solar energy specialist and engineering professor.\n        Experts believe that the Middle East and North Africa have huge                33    for solar energy projects.\n    This is partly because of adequate sunlight and partly because technology has become more                      34     in\n    the region.\n        “The last few years have seen a realization of             35    how competitive solar technologies can be,”\n    said Michael Taylor, a senior analyst at the International Renewable Energy Agency.\n\n1                                                                                       https://zhenti.burningvocabulary.com/\n\n                      A. affordable               F. insist                 K. perhaps\n                      B. ancestor                 G. just                   L. pioneer\n                      C. crucial                  H. located                M. potential\n                      D. depend                   I. mostly                 N. rising\n                      E. initial                  J. operating              O. scheduled\n\n    Section B\n    Directions: In this section, you are going to read a passage with ten statements attached to it. Each statement\n    contains information given in one of the paragraphs. Identify the paragraph from which the information is\n    derived. You may choose a paragraph more than once. Each paragraph is marked with a letter. Answer the\n    questions by marking the corresponding letter on Answer Sheet 2.\n\n                        New Formula One Chief Hopes to Grab Americans’ Attention\n    A. For the past four decades, the leader of Formula One car racing, one of the biggest annual sporting\n       series in the world, was Bernie Ecclestone, a former motorcycle parts dealer who built it into an\n       international presence essentially on his own.\n\n    B. A skilled backroom operator who speaks without a filter, Ecclestone said often that in his opinion, the\n       sport was at its best when he was allowed to act as “a dictator.”\n\n    C. Yet now the dictator is gone. After an American company, Liberty Media, acquired the Formula One\n       competition recently, Chase Carey — a former executive with Fox Broadcasting Company and\n       DirecTV who by his own admission is not a fierce racing fan — was named to replace Ecclestone and\n       to try to renovate the organization’s management, reach and ambition.\n\n    D. Among the goals, Carey said in an interview on Tuesday, is one that just about every global sport\n       seems interested in chasing: increasing interest in the United States. “People have said we’re going to\n       ‘Americanize’ it,” Carey said. “And we’re not going to do that totally. But realistically, there are some\n       elements of Americanization that the sport could use.”\n\n    E. While Formula One commands enormous audiences throughout much of the world, many American\n       sports fans know it as that other motorsport, the one that is not Nascar (纳斯卡车赛). Formula One\n       teams race far more technologically advanced vehicles around tracks all over the world — in\n       magnificent events in places like Malaysia, Monaco, Singapore and the United Arab Emirates, and on\n       tradition-rich tracks like Silverstone in England and Monza in Italy too.\n    F. The series has an annual race in Austin, Texas. But within “a few years,” Carey said, he plans to bring\n       another to a destination American city, like New York, Los Angeles, Miami or Las Vegas. Carey’s\n       ambitious plan is two-fold: first, change the business model of Formula One, which he said was a\n       “one-man show” under Ecclestone that had a largely narrow vision when it came to negotiating\n       partnership deals; and second, alter the way fans experience the sport, both in person and remotely, so\n       that connections between the audience and people within the series are easier to make.\n\n2                                                                                  https://zhenti.burningvocabulary.com/\n\n    G. Increased digital access for fans, a more behind-the-scenes experience for broadcast viewers and\n       innovation in areas like virtual reality — what is it like to speed around a track inside a Ferrari? — are\n       among the possibilities. “The sport has clearly been underserved,” Carey said. “It doesn’t do anything\n       digitally. There’s no marketing. It doesn’t tell any stories. The goal in this is to make the fans connect\n       to the live experience as much as possible, and the tools you have to do that, we’re not using at all.”\n\n    H. The larger question, though, is a familiar one: Is there room for Formula One in the ever-crowded\n       sports landscape of the United States? Opinions vary, particularly because viewing habits among\n       consumers continue to evolve. John Bloom, a professor at Shippensburg University who has studied\n       American sports history, said the biggest challenge for any sport trying to increase its presence in the\n       United States was framing itself in a way that had lasting appeal. “Sports generally become popular in\n       some way because they establish a narrative,” Bloom said. “When I think of motorsports in the U.S.,\n       what we all think of is Nascar, and the narrative of Nascar is sort of rural, white, working-class\n       Americans, mostly in the South, connecting with the atmosphere of those races. That’s the narrative.\n       When I think of the narrative of Formula One, it’s a very different kind of audience.”\n\n    I. That difference, Carey said, is significant. While some might immediately link Formula One to\n       Nascar in terms of American growth, Carey said Formula One’s brand research had indicated there\n       was very little crossover; rather, Formula One fans generally cite other so-called elite events, like\n       Wimbledon or the Ryder Cup, as competitions they enjoy. “Other than they’re both cars, the Nascar\n       fan base is a very different fan base,” Carey said. “It’s a very regional fan base. Formula One is a\n       global, famous brand of stars. These are machines that shock and awe you.”\n\n    J. Carey’s background is in deal making and innovation. At Fox Broadcasting Company, he was a top\n       advisor for years, known for his skill in helping to lead the launch of company into sports, as well as\n       the start of Fox News Channel. After going to DirecTV, he positioned the satellite provider as a\n       mainstream option in millions of households.\n\n    K. Now, after Liberty Media paid $4.4 billion to acquire Formula One, he is charged with making the\n       investment pay off. “I think they can build Formula One in the U.S.,” said Patrick Crakes, an\n       executive at InVivo Media Group who spent 25 years at Fox Broadcasting Company before leaving in\n       2016 as a senior manager at Fox Sports. “People don’t work on their cars anymore. They don’t want\n       that connection anymore. It’s about technology and pushing the limits. It’s about speed, danger and\n       risk. And Formula One has that more than any other racing series.”\n\n    L. That is what hooked Carey, and he said he thought his experience was not unusual. He recalled\n       attending Formula One’s Monaco race last year and being overwhelmed by the ceremony leading up\n       to the event, the way the race charmed the city for days ahead of the start. In his mind it felt like a\n       Super Bowl (超级碗橄榄球赛).\n    M. Then, on race day, he watched as the cars rocketed out of a tunnel and went screaming toward a tight\n       turn with the city’s harbor and the Mediterranean Sea in the background framing the scene. He was\n       fascinated. “You can’t help but be awed,” he said, “and I think that feeling can be translated to the\n       viewer.”\n\n3                                                                                https://zhenti.burningvocabulary.com/\n\n    N. He added: “The broader sport is a little too inward-looking, and we need to be more open. In some\n       ways, I’m glad to be coming from the outside. The guys who are in the sport forever are sitting there\n       saying: ‘We can’t do that. We can’ t do that because it’s never been done that way.’ ”\n\n    36. Chase Carey believes greater use should be made of digital technology to make Formula One more\n       accessible to its fans.\n    37. Chase Carey was deeply impressed by the ceremony preceding last year’s Monaco race.\n    38. One of Chase Carey’s goals is to make Formula One more appealing to Americans.\n    39. A former motorbike parts dealer led Formula One for the past forty years.\n    40. Chase Carey thought the audience of Formula One could be made to share his feeling about the race.\n    41. Chase Carey used to serve as a top advisor for a major broadcasting company.\n    42. Chase Carey intends to make connections easier between the audience and the Formula One racers.\n    43. The new leader of Formula One admitted he was not super interested in car racing.\n    44. People’s opinions differ as to whether Formula One can be promoted in the U.S.\n    45. Compared with other racing series, Formula One focuses more on speed and involves more danger.\n\n    Section C\n    Directions: There are 2 passages in this section. Each passage is followed by some questions or unfinished\n    statements. For each of them there are four choices marked A), B), C) and D). You should decide on the best\n    choice and mark the corresponding letter on Answer Sheet 2 with a single line through the centre.\n\n    Passage One\n    Questions 46 to 50 are based on the following passage.\n        Supermarkets have long been suffering as one of the thinnest-margined businesses in existence and\n    one of the least-looked-forward-to places to work or visit. For more than a decade, they have been under\n    attack from e-commerce giants, blamed for making Americans fat, and accused of contributing to climate\n    change.\n        Supermarkets can technically be defined as giants housing 15,000 to 60,000 different products. The\n    revolutionary idea of a self-service grocery, where people could hunt and gather food from aisles rather\n    than asking a clerk to fetch items from behind a counter, first came about in America. There is some\n    debate about which was the very first, but over the years a consensus has built around King Kullen\n    Supermarket, founded in New York in 1930.\n        For some 300 years, Americans had fed themselves from small stores and public markets. Shopping\n    for food involved mud, noisy chickens, clouds of flies, nasty smells, bargaining, and getting short-\n    changed. The supermarket imitated the Fordist factory, with its emphasis on efficiency and\n    standardization, and reimagined it as a place to buy food. Supermarkets may not feel cutting-edge now,\n    but they were a revolution in distribution at the time. They were such strange marvels that, on her first\n    official state visit to the United States in 1957, Queen Elizabeth II insisted on an impromptu (即兴的)\n    tour of a suburban-Maryland Giant Food.\n        The typical supermarket layout has barely changed over the past 90 years. Most stores open with\n\n4                                                                               https://zhenti.burningvocabulary.com/\n\n    flowers, fruit and vegetables at the front as a breath of freshness to arouse our appetite. Meanwhile, they\n    keep the milk, eggs, and other daily basics all the way back so you’ll travel through as much of the store\n    as possible, and be tempted along the way.\n        In the early days, as the supermarket multiplied, so did our suspicion of it. We have long feared that\n    this “revolution in distribution” uses corporate black magic on our appetite. The book The Hidden\n    Persuaders, published in 1957, warned that supermarkets were putting women in a “hypnoidal trance (催\n    眠恍惚状态),” causing them to wander aisles bumping into boxes and “picking things off shelves at\n    random.”\n\n    46. What problem have supermarkets been facing?\n        A. They are actually on the way to bankruptcy.\n        B. They have been losing customers and profits.\n        C. They are forced to use e-commerce strategies.\n        D. They have difficulty adapting to climate change.\n\n    47. What does the passage say about the idea of a self-service grocery?\n        A. It was put forward by King Kullen.\n        B. It originated in the United States.\n        C. It has been under constant debate.\n        D. It proves revolutionary even today.\n\n    48. What did supermarkets do by adopting the Fordist factory approach?\n        A. They modernized traditional groceries in many ways.\n        B. They introduced cutting-edge layout of their stores.\n        C. They improved the quality of the food they sold.\n        D. They revolutionized the distribution of goods.\n\n    49. What is the typical supermarket layout intended to do?\n        A. Arouse customers’ appetite to buy flowers, fruit and vegetables.\n        B. Provide customers easy access to items they want to buy.\n        C. Induce customers to make more unplanned purchases.\n        D. Enable customers to have a more enjoyable shopping experience.\n\n    50. What have people long feared about supermarkets?\n        A. They use tricky strategies to promote their business.\n        B. They are going to replace the local groceries entirely.\n        C. They apply corporate black magic to the goods on display.\n        D. They take advantage of the weaknesses of women shoppers.\n\n5                                                                               https://zhenti.burningvocabulary.com/\n\n    Passage Two\n    Questions 51 to 55 are based on the following passage.\n\n        The traditional school year, with three months of vacation every summer, was first implemented\n    when America was an agricultural society and the summer months were needed for farm work. Since\n    then, we’ve completely changed as a nation. Students no longer spend summers farming, but they aren’t\n    in school, either. The average American student receives 13 weeks off from school each calendar year —\n    with about 11 of those during the summer. Few other countries have more than seven weeks off in a\n    school calendar.\n        With the US lagging behind countries in academics, it’s time to consider year-round schooling. One\n    benefit of this change is that students will not fall victim to the “summer slide,” or the well-documented\n    phenomenon where students forget some of the knowledge they have acquired when too much time is\n    taken off from school. Decades of research shows that it can take from 8 to 13 weeks at the beginning of\n    every school year for students to get back to where they were before the summer holiday.\n        But year-round schooling isn’t just about academics. Teachers and students experience a closer\n    relationship in year-round schools than they do in traditional schools and, in the absence of any long-term\n    break, students do not feel detached from the school environment. These closer bonds and greater\n    attachment pay off. Research shows that students in year-round schools are more self-confident and feel\n    more positive about their schooling experience.\n        But don’t kids need time to relax? Some childhood development experts believe that time off from\n    school is vital to healthy development as kids are not designed to spend so much of their time inside\n    classrooms and the summer break provides a perfect opportunity to get outside. The problem with this\n    argument is that most children aren’t playing outside or even spending time with other kids. While some\n    children visit summer camps, most stay at home, watching TV or playing games on electronic devices,\n    which hardly benefits them.\n        The US has changed from a farming economy to a knowledge- and innovation-based economy, so it\n    makes sense for the school year to change as well.\n\n    51. Why did America’s traditional school year have a three-month summer vacation?\n        A. Students needed to help with farm work.\n        B. Students needed time to learn necessary farming skills.\n        C. The agricultural society then attached less importance to academics.\n        D. America lagged behind other countries in making a scientific school calendar.\n\n    52. What benefit will year-round schooling bring students in addition to improving their learning?\n        A. It will help them get back to where their lessons started.\n        B. It will enable them to absorb what they have learned.\n        C. It will familiarize them with the school environment.\n        D. It will strengthen their relationship with teachers.\n\n6                                                                                 https://zhenti.burningvocabulary.com/\n\n    53. What do some childhood development experts believe about the long summer vacation?\n        A. It meets students’ need to study on their own.\n        B. It enables students to learn about the outside world.\n        C. It satisfies students’ desire to stay longer at home.\n        D. It contributes to students healthy growth.\n\n    54. What is the argument against the experts’ idea of a long summer vacation?\n        A. It does little good to most students.\n        B. It benefits few students playing outside.\n        C. It leads students to neglect their studies.\n        D. It makes students addicted to computer games.\n\n    55. What does the author think of the traditional school year in the US today?\n        A. Well-grounded.            B. Culture-bound.             C. Outdated.      D. Welcomed.\n\n    Part IV                                     Translation                                          ( 30 minutes)\n\n    Directions: For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You\n    should write your answer on Answer Sheet 2.\n\n         中国越来越重视终身教育，发展继续教育是构建终身教育体系的有效途径。高校作为人才培\n    养的基地，拥有先进的教学理念和优越的教学资源，理应成为继续教育的办学主体。因此，近年\n    来许多高校适应社会需求，加强与用人单位沟通，努力探索一条符合中国国情的继续教育发展新\n    路，以使继续教育在国家发展战略中发挥更大的作用。\n\n7                                                                                 https://zhenti.burningvocabulary.com/"}, "2026-06-02": {"title": "2026年6月四级真题(第2套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2026-06/02", "text": "                      2026 年 6 月大学英语四级考试真题（第 2 套）\n\n    Part I                                                 Writing                                             (30 minutes)\n    Directions: Suppose you are invited to put forward a proposal to the university on how to make students’ campus life\n    easier. You are now to write an essay to make your proposal. You will have 30 minutes to write the essay. You should\n    write at least 120 words but not more than 180 words.\n\n    Part II                                       Listening Comprehension                                      (25 minutes)\n    Section A\n    Directions: In this section, you will hear three news reports. At the end of each news report, you will hear two or three\n    questions. Both the news report and the questions will be spoken only once. After you hear a question, you must choose\n    the best answer from the four choices marked A, B, C and D. Then mark the corresponding letter on Answer Sheet 1\n    with a single line through the centre.\n    Questions 1 and 2 are based on the news report you have just heard.\n    1. A. She was born months after the end of World War Ⅰ.\n       B. She has been living in her house throughout her life.\n       C. She suffered a great deal during the Second World War.\n       D. She is a 102-year-old woman living in Somerset Village.\n    2. A. She has been persuaded by the estate agent.                 C. She is leaving Glastonbury Village.\n       B. She needs the money badly for her health.                   D. She is moving to a nursing home.\n    Questions 3 and 4 are based on the news report you have just heard.\n    3. A. The navy’s timely arrival.                                  C. The word HELP written on the boat.\n       B. His rich sailing experience.                                D. His use of a mirror to send a signal.\n    4. A. He lost all consciousness.                                  C. He was too distressed to pick himself up.\n       B. He was in good condition.                                   D. He entirely abandoned himself to despair.\n    Questions 5 to 7 are based on the news report you have just heard.\n    5. A. Their efforts to provide social services have been ignored.\n       B. They have been criticized by the Denver school board.\n       C. They have taken various steps to get more funding.\n       D. Their enrollment has been on a noticeable decline.\n    6. A. Approve criteria for closing schools with decreased funding.\n       B. Enroll 3,000 fewer elementary and middle school students.\n       C. Decide which elementary and middle schools to close.\n       D. Alter its per-pupil funding policy on a rational basis.\n    7. A. To enable the district to remain competitive.               C. To keep the district free of debt.\n       B. To avoid a negative impact on its economy.                  D. To obtain the expected funding.\n\n    Section B\n    Directions: In this section, you will hear two long conversations. At the end of each conversation, you will hear four\n    questions. Both the conversation and the questions will be spoken only once. After you hear a question, you must\n    choose the best answer from the four choices marked A, B, C and D. Then mark the corresponding letter on Answer\n    Sheet 1 with a single line through the centre.\n1                                                                                              https://zhenti.burningvocabulary.cn\n\n    Questions 8 to 11 are based on the conversation you have just heard.\n    8. A. To book tickets for a musical.                              C. To pay for her afternoon flight to London.\n       B. To enquire about the price of cats.                         D. To have her personal computer repaired.\n    9. A. He frequents the Lion Theatre.                              C. He is a computer science expert.\n       B. He knows how to sell things well.                           D. He is away on a business trip.\n    10. A. They are sold at a discount.                               C. They are no longer available.\n       B. They are in low demand.                                     D. They are not too expensive.\n    11. A. Heights.                      B. Circus.                   C. Wild animals.                D. Dark nights.\n    Questions 12 to 15 are based on the conversation you have just heard.\n    12. A. He finds it bothersome to reply.                           C. He hasn’t got the time to text back.\n       B. He has switched off his phone.                              D. He doesn’t know how to respond.\n    13. A. His lack of sufficient sleep at night.                     C. His excessive use of the mobile phone.\n       B. His addiction to mobile phone games.                        D. His high frequency of surfing the net.\n    14. A. Shopping online and paying for his purchases.              C. Exploring whatever content to his liking.\n       B. Communicating with friends on social media.                 D. Sharing and posting pictures and videos.\n    15. A. She prefers chatting with others online to meeting them.\n       B. There are few physical stores near where she lives.\n       C. Ordering meals online is a great convenience to her.\n       D. She needs to talk with her friends and family far away.\n\n    Section C\n    Directions: In this section, you will hear three passages. At the end of each passage, you will hear three or four\n    questions. Both the passage and the questions will be spoken only once. After you hear a question, you must choose the\n    best answer from the four choices marked A, B, C and D. Then mark the corresponding letter on Answer Sheet 1 with a\n    single line through the centre.\n    Questions 16 to 18 are based on the passage you have just heard.\n    16. A. It is now narrowing.                                       C. It has remained huge.\n       B. It keeps increasing.                                        D. It will soon disappear.\n    17. A. It is fluctuating between 5% – 7%.                         C. It is faster for those who stay in their jobs.\n       B. It is slowing down for everyone.                            D. It is inadequate for dealing with inflation.\n    18. A. Booming.                      B. Stabilizing.              C. Struggling.                  D. Cooling.\n    Questions 19 to 21 are based on the passage you have just heard.\n    19. A. They have smaller amounts of nutrients than unprocessed diets.\n       B. Their contribution to calorie consumption is hard to determine.\n       C. They account for nearly half of the average American diet.\n       D. Their low price and convenience negatively impact health.\n    20. A. A strong desire to overeat.\n       B. A lack of nutrients like fiber.\n       C. A higher risk of cancer and obesity.\n       D. A greater intake of sugar and salt.\n    21. A. Eat more quickly.                                          C. Chew thoroughly.\n       B. Feel full sooner.                                           D. Swallow bit by bit.\n\n2                                                                                              https://zhenti.burningvocabulary.cn\n\n    Questions 22 to 25 are based on the passage you have just heard.\n    22. A. By attributing them to current cultural influences.\n         B. By attributing them to conservative thinking.\n         C. In terms of new genetic findings.\n         D. In terms of personal preferences.\n    23. A. Sharing with women the chores they see necessary.\n         B. Dividing housework that is demanding for women.\n         C. Performing household tasks that they enjoy.\n         D. Doing tasks that are physically challenging.\n    24. A. The large within-group differences.                           C. The researchers’ subjective biases.\n         B. The great similarities across groups.                        D. The noticeable overgeneralizations.\n    25. A. They seem to be universal.                                    C. They shape one’s role in society.\n         B. They impact people’s whole life.                             D. They appear at an early age.\n\n    Part III                                       Reading Comprehension                                      (40 minutes)\n    Section A\n    Directions: In this section, there is a passage with ten blanks. You are required to select one word for each blank from\n    a list of choices given in a word bank following the passage. Read the passage through carefully before making your\n    choices. Each choice in the bank is identified by a letter. Please mark the corresponding letter for each item on Answer\n    Sheet 2 with a single line through the centre. You may not use any of the words in the bank more than once.\n          It may sound surprising, but people who are supersensitive to coffee’s bitter taste actually drink more of it, a\n    new study finds.\n          This sensitivity isn’t    26     a matter of taste, either, but rather is influenced by a person’s genetic makeup,\n    the researchers said in the study.\n          “You’d expect that people who are particularly sensitive to the bitter taste of caffeine would drink less coffee,”\n    said study senior researcher Marilyn Cornelis. “The        27    results of our study suggest coffee consumers acquire\n    a taste for or an ability to detect the bitterness of caffeine due to the learned positive         28       brought out by\n    caffeine.”\n          Put another way, people who have a         29    ability to taste the bitterness of coffee learn to associate “good\n    things with it,” Cornelis said. This finding is surprising, given that bitterness often serves as a warning mechanism\n    to    30     people to spit out harmful substances, the scientists said.\n          Researchers conducted the study to understand how genetics influences people’s             31     of tea, coffee and\n    alcohol which tend to taste bitter, said lead study researcher Jue Sheng Ong.\n          “While all bitter flavors may seem the same, we           32     the bitterness of Brussels sprouts (抱子甘蓝),\n    quinine (奎宁) and caffeine         33    ,” Ong told Live Science. “The degree to which we find these flavors bitter is,\n    in part, determined by your genes.”\n          People with the genes to taste the bitterness of green vegetables are more likely to prefer tea to coffee.\n    In    34     , people who were more sensitive to quinine’s bitter flavors and those found in green vegetables tended\n    to    35     coffee.\n\n3                                                                                               https://zhenti.burningvocabulary.cn\n\n                          A. addition                 F. convince                K. prospect\n                          B. approximately            G. heightened              L. reinforcement\n                          C. avoid                    H. omission                M. separately\n                          D. consumption              I. opposite                N. simply\n                          E. converted                J. perceive                O. targeted\n\n    Section B\n    Directions: In this section, you are going to read a passage with ten statements attached to it. Each statement contains\n    information given in one of the paragraphs. Identify the paragraph from which the information is derived. You may\n    choose a paragraph more than once. Each paragraph is marked with a letter. Answer the questions by marking the\n    corresponding letter on Answer Sheet 2.\n                                                   Exercise and Dementia\n    A. If this doesn’t encourage you to squeeze in a workout today, nothing will: a new study from Sweden shows that\n       women who were highly fit in mid-life were nearly 90% less likely to get dementia (失智) decades later.\n    B. After initial exercise tests in middle age, researchers followed the women for 44 years. Both groups lived just\n       as long, but those who could ride an exercise bike at a fast rate for 6 minutes in the initial test had a much lower\n       risk of dementia later on than those who couldn’t complete the workout.\n    C. The study, published Wednesday in the journal Neurology, couldn’t prove that exercise prevented dementia,\n       and the findings aren’t a surprise — it’s long been known there’s a correlation between exercise and decreased\n       dementia risk — but the results were particularly dramatic. About 5% of the women with the highest peak\n       workload — those who were able to bike the hardest over those 6 minutes — developed dementia, compared\n       to 25% of those with medium fitness and 45% who weren’t fit enough to finish the test, the study found.\n       Overall, women who were highly fit compared to those who were moderately fit decreased their risk of\n       dementia by 88%. The few highly fit women who did develop dementia became symptomatic at age 90 on\n       average, 11 years later than the moderately fit.\n    D. “I’m very surprised that the finding was so strong,” said Ingmar Skoog, the paper’s senior author and a\n       psychiatry (精神病学) professor at the University of Gothenburg in Sweden. “It really shows the importance\n       of exercise.”\n    E. Dementia, as defined in medical dictionaries, is a broad term that describes a loss of thinking ability, memory,\n       attention, logical reasoning, and other mental abilities. These changes are severe enough to interfere with\n       social or occupational functioning. Dementia isn’t a disease. Instead, it’s a group of symptoms caused by other\n       conditions. It happens when the parts of your brain used for learning, memory, decision making, and language\n       are damaged or diseased. About 5% – 8% of adults over age 65 have some form of dementia. This percentage\n       doubles every 5 years after 65. As many as half of people in their 80s have some dementia.\n    F. Dementia is not temporary confusion or forgetfulness that might result from an infection that heals without\n       treatment. It can also come from an underlying (潜在的) illness or side effects of medications. Dementia\n       typically gets worse over time. People with dementia have problems with thinking and remembering that affect\n       their ability to manage their daily life.\n    G. Dementia is typically associated with declines in cognitive function. Yet researchers have found an association\n       between dementia and declines in hearing and other basic sensory functions.\n    H. Though the study mentioned above was fairly small (only 191 women took the initial fitness test, which means\n       it’s hard to maintain statistical significance while breaking the group down into subcategories of more or less\n       fit), it does give us hope that dementia can be prevented or delayed through exercise in one’s middle age.\n4                                                                                              https://zhenti.burningvocabulary.cn\n\n    I. Alzheimer’s (阿尔茨海默病) and other dementias are believed to begin 15 – 20 years before symptoms even\n       appear, so it makes sense that exercising in mid-life would affect the risk, Skoog said. Exercise alone is not\n       likely to prevent Alzheimer’s, but the study shows people are not helpless in the face of one of the most feared,\n       costliest and common diseases of old age, he added. And the same activities that help prevent Alzheimer’s —\n       including avoiding smoking, getting adequate exercise and sleep and eating a healthy diet — also prevent heart\n       disease, he said, making them even more worthwhile. “You can do something yourself to decrease your odds,”\n       Skoog said.\n    J. Maintaining a healthy lifestyle in mid-life, decades before disease sets in, makes sense, said David Knopman,\n       a fellow of the American Academy of Neurology, who was not involved in the study. “I suspect it’s a dose,”\n       said Knopman, also associate director of the Alzheimer’s Disease Research Center at Mayo Clinic in\n       Rochester, Minnesota. “Starting in late life is better than not starting at all, but starting in mid-life seems to\n       offer a larger benefit.”\n    K. Although it is not entirely clear why exercise helps put off or prevent Alzheimer’s, Knopman said it’s likely\n       that exercise maintains good blood flow to the brain. “When the brain is healthier from a vascular (血管的)\n       point of view, it can absorb more Alzheimer’s pathogen (病原体) before people become symptomatic,” he said.\n    L. The message isn’t that everyone needs to run marathons in middle age, Knopman said, but a healthy lifestyle\n       pays off.\n    M. This type of study can’t say exactly what kind of exercise is best, or how much is needed — only a study that\n       has a placebo (安慰剂) group and tracks people going forward can do that, said Keith Fargo, director of\n       scientific programs and outreach at the non-profit Alzheimer’s Association. “The literature has not yet settled\n       on an amount or type of exercise that is going to be key, although the bulk of literature has suggested that\n       aerobic (有氧的) exercise is what you need to be doing,” he said. That doesn’t mean you have to compete in\n       marathons but “more than a 10-min dog walk” would be a good idea, Fargo said.\n    N. Several lifestyle studies are getting underway soon, including one backed by the Alzheimer’s Association\n       called the U.S. POINTER study, which will offer at-risk adults, ages 60 – 79, a series of lifestyle interventions\n       (干预) to see if they impact Alzheimer’s risk. That and other Alzheimer’s-related studies are always looking\n       for volunteers to participate, he said.\n    O. In the next three to five years, these studies should allow researchers to provide clearer recommendations for\n       exercise and other lifestyle modifications that might reduce Alzheimer’s risk, such as sleep, diet and social\n       activities, Fargo said. But it’s already quite clear that exercising at any point in life is better for your brain than\n       not exercising at all, Fargo added.\n    P. “If you don’t want to have dementia when you’re 80, the time to start getting fit is now,” he said. “It may not\n       necessarily give you a longer life, but there’s a compelling body of work that it will give you more good years.”\n    36. It is typical for dementia to worsen with the passage of time.\n    37. According to Knopman, the study gives the message that a healthy lifestyle is beneficial, but not that all the\n       middle-aged need heavy exercise.\n    38. The results of a new study will encourage middle-aged women to find time exercising however busy they are.\n    39. Hopefully, one can postpone or prevent dementia by exercising in their mid-life.\n    40. In a few years, researchers should be able to offer clearer advice on exercise and other lifestyle changes for\n       reducing the incidence of Alzheimer’s.\n    41. Dementia refers to a loss of multiple mental abilities such as memory and logical reasoning.\n    42. One researcher believes that exercise may keep the brain well supplied with blood.\n\n5                                                                                               https://zhenti.burningvocabulary.cn\n\n    43. Medical literature has not concluded as to what exercise or how much exercise is crucial, although it generally\n       agrees that people should do aerobic exercise.\n    44. It has long been common knowledge that exercise correlates with reduced risk of dementia.\n    45. Activities helpful in the prevention of Alzheimer’s also prevent heart disease.\n\n    Section C\n    Directions: There are 2 passages in this section. Each passage is followed by some questions or unfinished statements.\n    For each of them there are four choices marked A, B, C and D. You should decide on the best choice and mark the\n    corresponding letter on Answer Sheet 2 with a single line through the centre.\n    Passage One\n    Questions 46 to 50 are based on the following passage.\n         People who systematically underestimate themselves and their own performance suffer from the so-called\n    Impostor Phenomenon. They think that any success is due to external circumstances or just luck and chance.\n    Those people live in constant fear that their “deception” will be exposed.\n         It is common for people to question their abilities now and again. A healthy amount of reflection and self-\n    doubt can protect a person from acting impulsively. However, there are people who are permanently plagued by a\n    massive amount of self-doubt despite delivering a good performance. They think that all of their successes are not\n    a product of their skill or hard work, instead they attribute their own successes to external circumstances, for\n    example, to luck and chance, or believe that their performance is massively overestimated by others. Failures, on\n    the other hand, are always internalised as the result of their own shortcomings.\n         Psychologists from Martin Luther University Halle-Wittenberg examined the topic for the first time under\n    real-life conditions. Seventy-six participants completed a range of intelligence tests and received positive\n    feedback on them, regardless of their actual performance. They were then asked why they think they did so well.\n         The study showed two things: First, the self-reported degree of Impostor Phenomenon is not related to actual\n    measured intelligence or performance. Secondly, the test supported the assumption that people with a tendency to\n    exhibit the Impostor Phenomenon devalue their objectively measured performance and attribute positive results to\n    external causes such as luck and chance, but not to their own abilities. These results are also completely unrelated\n    to age and gender.\n         A permanent underestimation of one’s own abilities is often accompanied by the fear that this supposed\n    intellectual deception will be exposed sooner or later and that they will pay the price for this. The Impostor\n    Phenomenon was first described in 1978 by U.S. psychologists Pauline Clance and Suzanne Imes. They observed\n    that there is a particularly high number of successful women who do not think they are very intelligent. The\n    Impostor Phenomenon is not defined as a mental illness. However, people who suffer from it show a higher\n    vulnerability to depression.\n    46. What do we learn from the passage about people who suffer from the so-called Impostor Phenomenon?\n       A. They systematically underestimate their chance of success.\n       B. They tend to attribute their achievements to good fortune.\n       C. They seem to live in constant fear of being deceived.\n       D. They generally rely on luck and chance for success.\n\n6                                                                                           https://zhenti.burningvocabulary.cn\n\n    47. What do people with a healthy amount of reflection and self-doubt tend to do?\n       A. Credit all their successes to hard work.\n       B. Strive hard to perfect their skills.\n       C. Refrain from acting on impulse.\n       D. Deliver a better performance.\n    48. What do Impostor Phenomenon sufferers often do according to psychologists from Martin Luther University\n       Halle-Wittenberg?\n       A. Attribute their accomplishments to others.\n       B. Deny their actual measured intelligence.\n       C. Claim to have confidence in their own abilities.\n       D. Mark down their objectively rated performance.\n    49. What happens when a person permanently underestimates their own abilities?\n       A. They will focus their attention on external factors.\n       B. They will be fearful of potential consequences.\n       C. They will count on good fortune for success.\n       D. They will keep improving their own skills.\n    50. What did U.S. psychologists Pauline Clance and Suzanne Imes say about Impostor Phenomenon sufferers?\n       A. They are more liable to have depression.\n       B. They seldom realise their potential fully.\n       C. They will develop mental illnesses.\n       D. They will pay higher prices one day.\n\n    Passage Two\n    Questions 51 to 55 are based on the following passage.\n         Music is a universal language. In every culture and country, you will find music. It is vitally important across\n    the globe and has the potential to bring people together in peace and harmony. One of my favorite experiences in\n    music is seeing musicians from different cultures come together and perform as a group. When each culture brings\n    its own unique qualities to the group, an entirely new sound is achieved. This can create extraordinary results.\n    People can communicate with each other using music as the common language.\n         One common musical thread between cultures is known as the pentatonic scale. It is astonishing how many\n    cultures share this tool in approaching music. The pentatonic scale consists of five notes; “penta-” meaning 5, and\n    “tonic” meaning tone or note. This scale can be found in music everywhere including that of Native Americans,\n    Africans, and Asians. It is also found in popular music, blues, jazz, and rock. Using this five-note scale, musicians\n    from around the globe have a medium through which they can relate, communicate, perform, and ultimately\n    understand each other.\n         Music is tied to specific perceptual ( 感 知 的 ), mental, and emotional faculties, including language (all\n    societies put words to their songs), motor control (people in all societies dance), sound analysis (all musical\n    systems have a distinct pitch and quality, and aesthetics (美感) (their tunes and rhythms are balanced between\n    repetitiveness and chaos.\n\n7                                                                                           https://zhenti.burningvocabulary.cn\n\n         There is no known society that existed without music. Although each culture has their own specific style and\n    approach to music, you will find that the purposes behind music are very similar across the board. Music\n    essentially serves to express or change emotions. It can cheer you up, sadden you, anger you or excite you. Music\n    is often ceremonial: used in religion, ceremony, and celebration. Music can simply be recreational: entertaining,\n    joyful and fun. Any way you have used music, it is almost certain that every other culture has used music in the\n    very same way. And that is something that bonds all of us. We all share a deep love for music and it has the power\n    to unite us.\n    51. In what way is music important?\n        A. It is able to create novel and extraordinary emotions.\n        B. It has the power to unite people throughout the world.\n        C. It allows different cultural groups to sing in harmony.\n        D. It is the only language favored by all peoples of the world.\n    52. Why does the author like to see musicians from different cultures perform together?\n        A. Their musical experience can be compared.\n        B. A novel language can be created.\n        C. Their unique skills can be displayed.\n        D. Fantastic results can be achieved.\n    53. What does the passage say about the pentatonic scale?\n        A. It is present in music all around the world.\n        B. It is helpful in understanding music.\n        C. It is the basis for musicians’ creation.\n        D. It is a medium for ordinary people to relate.\n    54. What is the fundamental role of music in people’s life?\n        A. To bring them together.\n        B. To show their identity.\n        C. To express their emotions.\n        D. To keep them entertained.\n    55. In what aspect is music similar throughout the world?\n        A. The way people respond to it.\n        B. The role it plays in society.\n        C. The joy it brings to people.\n        D. The way it is made use of.\n\n    Part IV                                                Translation                                    (30 minutes)\n    Directions: For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You should\n    write your answer on Answer Sheet 2.\n\n         餐桌礼仪 (dining etiquette) 是中华传统文化的重要组成部分，蕴含着热情有礼的待客之道。为了招待\n    客人，主人会根据客人的口味和喜好准备丰富精致的菜肴。就餐座位的安排非常讲究，主人坐在正对大门\n    的位置，在主人身边就座的是最重要的客人。进餐时，主人会不时地为客人添酒加菜。这种独特的餐桌礼\n    仪已延续了数千年，对促进和谐的人际交往起到了重要作用。\n\n8                                                                                         https://zhenti.burningvocabulary.cn"}, "2026-06-03": {"title": "2026年6月四级真题(第3套)", "url": "https://zhenti.burningvocabulary.cn/cet4/2026-06/03", "text": "                    2026 年 6 月大学英语四级考试真题（第 3 套）\n\n    Part I                                                Writing                                              (30 minutes)\n    Directions: Suppose it is proposed that university students should be required to participate in at least one research\n    project. You are now to write a response by stating what you think of the proposal in terms of its necessity and\n    practicality. You will have 30 minutes to write the response. You should write at least 120 words but not more than\n    180 words.\n\n    Part II              Listening Comprehension (25 minutes)\n    提示：2026 年 6 月四级全国只考两套听力，本套听力内容与第一、二套相同，故本套未重复显示。\n\n    Part III                                    Reading Comprehension                                    (40 minutes)\n    Section A\n    Directions: In this section, there is a passage with ten blanks. You are required to select one word for each blank\n    from a list of choices given in a word bank following the passage. Read the passage through carefully before making\n    your choices. Each choice in the bank is identified by a letter. Please mark the corresponding letter for each item on\n    Answer Sheet 2 with a single line through the centre. You may not use any of the words in the bank more than once.\n         Junk-food lovers who try to cut back on fries or chocolate may experience symptoms similar to drug\n    withdrawal, a new study suggests.\n         Researchers found that people attempting to cut down on eating highly processed foods experience some\n    of the same    26       and psychological symptoms — such as mood swings, anxiety, headaches and poor sleep\n    — as those    27    smoking cigarettes or using drugs, according to the study.\n         The new study        28    the first evidence that these withdrawal-like symptoms can occur when people cut\n    down on highly processed foods, said lead study author Erica Schulte.\n         Based on the participants’ self-reported symptoms, withdrawal symptoms were                    29      more intense\n    between the second and fifth days after attempting to reduce junk-food consumption, which                  30     the time\n    span people live through during drug withdrawal.\n         The idea that food may be addictive after “heavy” use by some individuals is a              31      subject, Schulte\n    said. Although prior studies in animals and humans have shown some biological and behavioral similarities\n    between substance-use disorders and addictive-like consumption of highly processed foods, no studies have\n    looked at whether reducing junk food can         32    withdrawal symptoms in people, she noted. Raising                 33\n    that people may experience irritability ( 烦 躁 ) or headaches when cutting down on junk food can help\n    individuals    34       coping strategies in advance, Schulte noted. The findings may also            35      light on the\n    barriers people face when changing eating habits — barriers that may play a role in people dropping out of\n    treatments, she said.\n                            A.
