awareness             F. offers                  K. prospects\n                            B. canceling             G. parallels               L. quitting\n                            C. controversial         H. permanently             M. shed\n                            D. emptiness             I. physical                N. significantly\n                            E. monstrous             J. prepare                 O. trigger\n\n1                                                                                             https://zhenti.burningvocabulary.cn\n\n    Section B\n    Directions: In this section, you are going to read a passage with ten statements attached to it. Each statement\n    contains information given in one of the paragraphs. Identify the paragraph from which the information is derived.\n    You may choose a paragraph more than once. Each paragraph is marked with a letter. Answer the questions by\n    marking the corresponding letter on Answer Sheet 2.\n                                               Giving a better phone interview\n    A. These days, phone interviews are an unavoidable part of the job interview process, and for good reason:\n       They save time and effort. But that doesn’t mean that phone calls require zero energy on the part of the\n       candidate. Many companies treat phone screening as the official first round of the hiring process. That\n       means candidates are expected to go into them prepared with as much information as possible about the\n       company, position, and their own skills and strengths.\n    B. A big mistake people often make is talking about their personal lives. Don’t talk about your personal life\n       unless you’re directly asked a question about what you like to do in your off-hours. “The point of a phone\n       interview is to focus on getting to know a candidate’s professional experience and goals,” says McKenzie\n       Roark, campus talent specialist at Lithko Contracting. “A recruiter is trying to see if they are the best fit for a\n       role, and learning about their personal life doesn’t help. For example, when asked where you see yourself in\n       five years, we don’t want to know that you hope to be married or that you want to buy a new house. That is\n       nice, but that isn’t relative to anything professional.”\n    C. It might be tempting to cross something off your to-do list while on a phone interview, but recruiters and\n       hiring managers can easily tell if your attention is elsewhere. Many interviewers are annoyed to see people\n       who decide to multitask while on the phone interview. There are candidates who wash dishes, go for walks,\n       or do grocery shopping during the interview. Needless to say, this doesn’t reflect well on your level of\n       interest in the position you’re interviewing for.\n    D. The question regarding pay is also best avoided. To be frank, it’s simply too early in the process for you to\n       be the one who brings up salary expectations. “Chances are if a candidate is participating in a phone\n       interview, this is the first time they have talked with the company, and the first call isn’t the appropriate time\n       to talk about ‘what’s in it for you,’ ” says Justina Strnad, the Talent Acquisition Manager for Shiftgig. “Trust\n       me, if you are a great candidate and make it to the next step, the hiring team is going to be very transparent\n       about what’s in it for you later on.”\n    E. “After wrapping up a phone interview, it is typical that the interviewer will ask the candidate if they have\n       any questions. I can’t stress this enough: ALWAYS ask questions,” says Roark. “If we have had a great\n       phone interview and then we wrap up and they don’t have any questions for me, it pretty much ruins the\n       whole interview. It tells me that the candidate is uninterested in the role, which in reality might not be the\n       case at all,” she notes. But surely, if you’re interested in a job, you can think of something to ask your\n       interviewer.\n    F. It seems basic, but surprisingly, a lot of people are late to phone interviews. “About a quarter of the people\n       with whom I schedule phone interviews aren’t on time,” says Sophie Cikovsky, who handles U.S. recruiting\n       for Infinite Global. “While this bothers me personally, it’s also indicative of someone who isn’t very detail-\n       oriented,” she explains. “In order to identify this early in the hiring process, I started asking all candidates a\n       few years ago to call me as opposed to calling them at an agreed-upon time. That way, if I hear from them at\n       1:13 pm or 12:49 pm instead of our planned 1:00 pm interview time, I have an early indicator that they\n       might not be a great fit.”\n\n2                                                                                           https://zhenti.burningvocabulary.cn\n\n    G. “Make sure you test your headset and connection before dialing in,” recommends Roark. “There is nothing\n       more frustrating for a recruiter who has a structured interview guide in place having to repeatedly ask the\n       same question over and over because they could not understand your answer due to dropped signals.” Test-\n       call a friend beforehand, or even call yourself from a landline if necessary; it will take less than a minute.\n    H. You might be eager to get your point across or talk about your experience, but interrupting the interviewer is\n       awkward and rude. Interviewing can be stressful, and sometimes that stress manifests itself in speaking too\n       fast, speaking too loud, talking over the interviewer, or attempting to answer the interviewer’s question\n       before they have actually finished asking the question,” says Chris Dardis, a recruiting expert. “Don’t do\n       this.” There’s a big difference between being assertive (自信的) and being aggressive, and interviewers can\n       always recognize it.\n    I. It’s tough not to say things like “um” “uh” and “like” in everyday speech, but these verbal habits become\n       much more pronounced when speaking on the phone, says Dardis. “In face-to-face interviews, they’re not as\n       noticeable, because there are other things like your hair, suit, or body language to distract people.” But in a\n       phone interview, the only thing you have to go on is what you say and how you say it. “That’s why it’s so\n       important to eliminate these words from your speech when doing a phone interview.”\n    J. Not knowing anything about the company or job you’re interviewing for is way more obvious than you’d\n       think. “Many people think that they don’t have to put as much effort into researching the role or the\n       company,” says Steve Prichard, an HR consultant. And if you have your laptop in front of you during the\n       interview to do a few quick searches, they won’t know the difference, right? Not exactly. “Seasoned\n       interviewers will know whether an interviewee is researching while on the phone. The interviewer can often\n       even hear the typing as they ask the question,” he adds.\n    K. “The key to success during a phone interview is clear and concise answers,” says Dardis. “People’s attention\n       spans tend to be shorter over the phone. You don’t want your future employer to lose interest in the\n       conversation.” He recommends practicing answers to questions you know will be asked ahead of time in\n       order to be clear on what you’re going to say. That way, you can prevent talking in an aimless manner.\n    36. Interviewees are advised not to ask questions about pay during a phone interview.\n    37. Experienced interviewers will know if an applicant is searching for information online while talking on the\n       phone.\n    38. Many employers regard the phone interview as the first step of the official recruiting process.\n    39. Applicants who don’t ask questions at the end of an interview most probably ruin their chance of getting the\n       position.\n    40. The interviewee should test their phone connection before they call the interviewer.\n    41. It is annoying to the interviewer to find the applicant doing other tasks while being interviewed.\n    42. To pass a phone interview, the most important thing is to answer questions clearly and concisely.\n    43. If you fail to call the interviewer on time, they might not see you as a suitable candidate.\n    44. Applicants should avoid talking about their personal lives if the interviewer has only asked about their\n       professional background and goals.\n    45. It is impolite for an interviewee to interrupt the interviewer in the phone conversation.\n\n3                                                                                           https://zhenti.burningvocabulary.cn\n\n    Section C\n    Directions: There are 2 passages in this section. Each passage is followed by some questions or unfinished\n    statements. For each of them there are four choices marked A, B, C and D. You should decide on the best choice and\n    mark the corresponding letter on Answer Sheet 2 with a single line through the centre.\n    Passage One\n    Questions 46 to 50 are based on the following passage.\n         Disgust is a universal human emotion. One type of disgust is called physical disgust, which protects us\n    from eating or touching things that could be dangerous for us, such as raw meat or insects. Children experience\n    physical disgust from a very early age, but do not achieve an understanding of the concept until they are around\n    four years old.\n         Some researchers maintain that there is another type of disgust, called moral disgust, that protects us from\n    engaging in activities that can be perceived as morally wrong. Examples of moral disgust are stealing, lying or\n    cheating.\n         However, not all academics think that moral disgust really exists. Some say that when we refer to disgust\n    in relation to moral issues, we are using disgust as a metaphor (隐喻), and what we are feeling is in reality anger.\n         If moral disgust appears quite late in development, it makes sense to think that there is actually a social\n    component to it. Children learn about emotions in many different ways. Of special relevance are parents-\n    children conversations about emotions. Indeed, children whose parents talk about emotions often have a better\n    emotional understanding than children whose parents do not discuss emotions often.\n         However, there are no studies that have examined how parents and children talk about disgust. This is\n    what we set up to examine in our study.\n         We asked 68 English-speaking mothers and their four-, six-, or eight-year-old children to discuss some\n    stories about moral and physical disgust. Our preliminary findings show mothers and children do talk about\n    disgust, but mainly about physical disgust and not so much about moral disgust.\n         When we asked mothers and children to discuss moral issues, such as whether it is OK to play with a child\n    who has stolen someone else’s snack, they linked this type of moral wrongdoing with the emotion of anger and\n    not disgust.\n         Does this mean that moral disgust does not exist? Some researchers suggest moral disgust exists in adults.\n    Our findings suggest that moral disgust is either understood at a later age or is only used metaphorically, if at all,\n    in children as old as eight years.\n    46. What does the passage tell us about physical disgust?\n       A. It is an emotion as contrasted with thoughts.\n       B. It is a concept beyond children’s understanding.\n       C. It is a mechanism to keep us from being harmed.\n       D. It is an experience gained from any form of danger.\n    47. How do some researchers perceive moral disgust?\n       A. It tends to appear in various forms of wrongdoing.\n       B. It is just as annoying to people as physical disgust.\n       C. It is a term used by common folk to describe anger.\n       D. It stops people from doing anything morally wrong.\n\n4                                                                                           https://zhenti.burningvocabulary.cn\n\n    48. Why does moral disgust appear quite late in children’s development?\n       A. It needs to be learnt through social interactions.\n       B. They have little control over its learning process.\n       C. It is too complex for them to acquire.\n       D. Their parents seldom talk about emotions.\n    49. What did the author and his colleagues want to examine in their experiment?\n       A. What parents tell children against moral wrongdoing.\n       B. What parents and children link moral wrongdoing to.\n       C. How moral disgust is seen by children aged 4, 6 and 8.\n       D. How disgust is discussed between parents and children.\n    50. What can we infer about moral disgust from the author and his colleagues’ findings?\n       A. It is a notion hardly comprehensible to children.\n       B. It rarely exists in children younger than eight.\n       C. It is a term most parents use when talking to children.\n       D. It exists in adults with a strong sense of justice.\n\n    Passage Two\n    Questions 51 to 55 are based on the following passage.\n         After finding out details about a stranger, we mistakenly think that they also know about us. As a result, we\n    act more honestly around them, according to a recent study in Nature.\n         Past research has found that we tend to assume social relationships are reciprocal (相互的). Most of the\n    time, this assumption is accurate: someone you think of as a friend will usually consider you a friend too. But\n    sometimes our social ties are more one-sided: for example, you might learn something about a stranger who\n    doesn’t know you at all. Researchers tal strangers.\n       B. People we want to have detailed information about are keen to know about us.\n       C. People who get to know a person wrongly assume the person knows them too.\n       D. People who are familiar with each other tend to behave honestly in their everyday dealings.\n    52. What does the passage say about the assumption that social relationships are reciprocal?\n       A. It is more the exception than the rule.\n       B. It does not hold true in every situation.\n       C. It does not apply to complex relationships.\n       D. It is more accurate in one-sided social ties.\n    53. What did Anuj Shah and Michael LaForest want to find out about the belief that social relationships are\n       reciprocal?\n       A. Whether it may resolve misunderstandings about social ties.\n       B. Whether it could help develop one’s relationships with strangers.\n       C. Whether it could help strengthen interpersonal relationships.\n       D. Whether it may lead to false assumptions about a stranger.\n    54. When did Anuj Shah and Michael LaForest find something really interesting in their research?\n       A. During lab-based studies.\n       B. During a field experiment.\n       C. While investigating local residents’ crime.\n       D. While talking to police officers nearby.\n    55. What happened in the areas around the housing developments subjected to the studies?\n       A. They saw fewer crimes than the control developments.\n       B. They witnessed a swifter elimination of illegal activities.\n       C. Local police responded more quickly to criminal complaints than before.\n       D. Local police related better to residents there than to those in other areas.\n\n    Part IV                                           Translation                                         (30 minutes)\n    Directions: For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You should\n    write your answer on Answer Sheet 2.\n\n function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function todayKey(d){return (d.getMonth()+1)+'/'+String(d.getDate()).padStart(2,'0')}

/* 已完整打卡的天数（Day1 只完成第1段即算，其余天两个任务都完成） */
function doneDays(){
  let n=0;
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf('cet4_')===0){
      const v=parseInt(localStorage.getItem(k),10);
      const di=plan.findIndex(p=>p.date===k.slice(5));
      if(di===0){if(v&1)n++}        /* Day1：完成背单词即算 */
      else if(di>0&&v===3)n++;      /* 其余天：两任务都完成 */
    }
  }
  return n;
}

function resetAll(){
  if(!confirm('确定要清空全部打卡记录吗？'))return;
  const ks=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf('cet4_')===0)ks.push(k);
  }
  ks.forEach(k=>localStorage.removeItem(k));
  syncHome();
}

function seg2Title(p2){

  }
  const total=noSeg2?1:2;
  const n=noSeg2?((v&1)?1:0):((v&1?1:0)+(v&2?1:0));
  document.getElementById('dayBar').style.width=(n/total*100)+'%';
  const dd=doneDays();
  document.getElementById('dayTip').textContent=dd>0
    ? '已完成 '+dd+' 天打卡'
    : (n===0
        ? '今天'+(noSeg2?'背完单词就打卡成功':'两个小任务，完成一个就勾一个')
        : (n===1?(noSeg2?'单词完成，打卡成功！':'完成 1/2 \u00B7 已经迈出一大步啦'):'2/2 今日任务全部完成！'));
}

/* ================= 背单词 / 复习（逐词） ================= */
let wi=0; /* 当前词索引 */
let reviewMode=false,reviewWords=[];
function goWords(){
  if(!hasWords){goHome();return}
  reviewMode=false;
  wi=0;
  document.getElementById('wTitle').textContent=(curIdx===todayIdx)?'今日单词':'Day '+curP.no+' 单词';
  document.getElementById('wFinishBtn').textContent='全部背完，打卡！';
  renderWord();
  show('view-words');
}
/* 复习模式：前一天的单词打乱顺序，隐藏释义 */
function goReview(){
  if(curIdx<=0){goHome();return}
  const prev=DATA.batches[curIdx-1];
  if(!prev||!prev.words||!prev.words.length){goHome();return}
  reviewMode=true;
  reviewWords=prev.words.slice();
  for(let i=reviewWords.length-1;i>0;i--){
    const j=(Math.random()*(i+1))|0;
    const t=reviewWords[i];reviewWords[i]=reviewWords[j];reviewWords[j]=t;
  }
  wi=0;
  document.getElementById('wTitle').textContent='复习昨日单词';
  document.getElementById('wFinishBtn').textContent='复习完成，打卡！';
  renderWord();
  show('view-words');
}
function renderWord(){
  const list=reviewMode?reviewWords:curBatch.words;
  const total=list.length;
  const w=list[wi];
  document.getElementById('wCount').textContent=(wi)+' / '+total;
  document.getElementById('wBar').style.width=(wi/total*100)+'%';
  const last=wi>=total-1;
  document.getElementById('wBody').innerHTML=
    '<div class="w-card">'+
      '<span class="w-idx">'+(wi+1)+' / '+total+'</span>'+
      '<div class="w-word">'+esc(w[0])+'</div>'+
      '<div class="w-ph">'+esc(w[1])+'</div>'+
      (reviewMode?'':'<div class="w-sep"></div><div class="w-mean">'+esc(w[2])+'</div>')+
    '</div>'+
    '<div class="w-actions">'+
      '<button class="w-known" onclick="knownWord()">认识 \u2713</button>'+
      '<button class="w-next" onclick="nextWord()">'+(last?'看下一个':'下一个 \u2192')+'</button>'+
    '</div>';
  /* 每背 10 个弹出鼓励 */
  if(wi>0&&wi%10===0){
    showCheer((wi/10)-1);
  }
  document.getElementById('wDoneZone').style.display='none';
}
function knownWord(){
  const list=reviewMode?reviewWords:curBatch.words;
  if(wi<list.length-1){wi++;renderWord()}
  else{wi++;document.getElementById('wCount').textContent=wi+' / '+list.length;document.getElementById('wBar').style.width='100%';document.getElementById('wBody').innerHTML='';document.getElementById('wDoneZone').style.display='block';showCheer(4)}
}
function nextWord(){
  if(wi<((reviewMode?reviewWords:curBatch.words).length)-1){wi++;renderWord()}
  else{knownWord()}
}
function finishWords(){
  if(reviewMode){
    if(!(getDone()&2)){setDone(2,true);celebrate()}
    reviewMode=false;reviewWords=[];
    syncHome();goHome();return;
  }
  if(!(getDone()&1)){setDone(1,true);celebrate()}
  syncHome();
  goHome();
}
function showCheer(n){
  const box=document.getElementById('cheerModal');
  document.getElementById('cheerSvg').innerHTML=BEARS[n%BEARS.length];
  document.getElementById('cheerTxt').textContent=CHEERS[n].t;
  document.getElementById('cheerSub').textContent=CHEERS[n].s;
  box.classList.add('show');
}

/* ================= 真题（分Part浏览） ================= */
let zParts=[],zIdx=0;
function goZhenti(){
  if(!curP||curP.link.type!=='zhenti'){
    /* 非真题日：复习昨日单词 */
    goReview();return;
  }
  const zid=curP.link.url.split('/cet4/')[1]; /* e.g. 2014-06/01 */
  const zkey=zid.replace('/','-');
  const zt=DATA.zhenti?DATA.zhenti[zkey]:null;
  if(!zt){
    show('view-zhenti');
    document.getElementById('zMeta').textContent='真题内容准备中，请稍后再试';
    document.getElementById('zContent').textContent='';
    document.getElementById('partTabs').innerHTML='';
    return;
  }
  /* 按 Part 切分 */
  const parts=splitParts(zt.text);
  zParts=parts;
  zIdx=0;
  document.getElementById('zMeta').innerHTML='<span>'+esc(zt.title)+'</span><a href="'+zt.url+'" target="_blank" rel="noopener" style="color:var(--pink-deep);font-size:12px">原站 \u2197</a>';
  renderZ();
  show('view-zhenti');
  /* focus：周六定位 Reading（完形+仔细阅读）、周日定位 Writing */
  if(curP.link.focus){
    const want=(curP.link.focus==='reading')?'Reading':'Writing';
    const btns=document.querySelectorAll('#partTabs button');
    for(let i=0;i<btns.length;i++){
      if(btns[i].textContent===want){zGo(i);break;}
    }
  }
}
function splitParts(text){
  const segs=text.split(/\n(?=\s*Part\s*[ⅠⅡⅢⅣIVX]+)/i);
  const out=[];
  segs.forEach(function(s){
    s=s.trim();
    if(s.length>30)out.push(s);
  });
  if(out.length===0)out.push(text.trim());
  return out;
}
function renderZ(){
  document.getElementById('partTabs').innerHTML=zParts.map(function(_,i){
    const name=partName(zParts[i]);
    return '<button class="'+(i===zIdx?'on':'')+'" onclick="zGo('+i+')">'+name+'</button>';
  }).join('');
  document.getElementById('zContent').textContent=zParts[zIdx];
  document.getElementById('zPrev').disabled=zIdx===0;
  document.getElementById('zNext').disabled=zIdx>=zParts.length-1;
  document.getElementById('zNext').textContent=(zIdx>=zParts.length-1)?'已完成':('下一部分 \u2192');
}
function partName(t){
  const m=t.match(/Part\s*[ⅠⅡⅢⅣIVX]+\s+([A-Za-z]+)/i);
  if(m)return m[1];
  if(/真题|大学英语/.test(t))return '试卷';
  return '部分 '+(zParts.indexOf(t)+1);
}
function zGo(i){zIdx=i;renderZ()}
function zPrev(){if(zIdx>0){zIdx--;renderZ()}}
function zNext(){if(zIdx<zParts.length-1){zIdx++;renderZ()}}
function finishZhenti(){
  if(!(getDone()&2)){setDone(2,true);celebrate()}
  syncHome();
  goHome();
}

/* ================= 庆祝（礼炮+烟花，Canvas粒子） ================= */
let fxCtx=null,fxCvs=null,fxParts=[],fxRunning=false;
const FX_COLORS=['#FF8FAB','#FFD98E','#C3B1E1','#8ED6A4','#FFC7A8','#7EC8E3','#FFB6C1','#FFF3B0'];
function fxInit(){
  fxCvs=document.getElementById('fxCanvas');
  fxCtx=fxCvs.getContext('2d');
  fxResize();
  window.addEventListener('resize',fxResize);
}
function fxResize(){
  if(!fxCvs)return;
  const dpr=window.devicePixelRatio||1;
  fxCvs.width=innerWidth*dpr; fxCvs.height=innerHeight*dpr;
  fxCtx.setTransform(dpr,0,0,dpr,0,0);
}
function celebrate(){
  if(!fxCtx)fxInit();
  const w=innerWidth,h=innerHeight;
  /* 两侧礼炮：彩带斜向上喷出 */
  for(let i=0;i<30;i++){
    const left=i%2===0;
    fxParts.push({
      x:left?-8:w+8,y:h*(0.72+Math.random()*0.2),
      vx:(left?1:-1)*(3.5+Math.random()*4.5),vy:-(5+Math.random()*5.5),
      rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.4,
      life:55+Math.random()*25,age:0,
      color:FX_COLORS[(Math.random()*FX_COLORS.length)|0],
      w:5+Math.random()*5,h:9+Math.random()*7,type:1
    });
  }
  /* 三朵烟花依次绽放 */
  setTimeout(fxSparkle,150);
  setTimeout(fxSparkle,750);
  setTimeout(fxSparkle,1350);
  if(!fxRunning){fxRunning=true;requestAnimationFrame(fxLoop)}
}
function fxSparkle(){
  const x=innerWidth*(0.18+Math.random()*0.64),y=innerHeight*(0.16+Math.random()*0.38);
  for(let i=0;i<36;i++){
    const a=Math.PI*2*i/36+Math.random()*0.25;
    const sp=1.8+Math.random()*3.8;
    fxParts.push({
      x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      rot:0,vr:0,life:48+Math.random()*22,age:0,
      color:FX_COLORS[(Math.random()*FX_COLORS.length)|0],
      w:2.5+Math.random()*2.5,h:2.5+Math.random()*2.5,type:2
    });
  }
}
function fxLoop(){
  const ctx=fxCtx;
  if(!ctx){fxRunning=false;return}
  ctx.clearRect(0,0,innerWidth,innerHeight);
  fxParts=fxParts.filter(function(p){return p.age<p.life});
  for(const p of fxParts){
    p.age++;
    if(p.type===1){
      /* 彩带：带重力与旋转 */
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.rot+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.globalAlpha=1-p.age/p.life;ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    }else{
      /* 烟花粒子：扩散 */
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;
      ctx.globalAlpha=1-p.age/p.life;ctx.fillStyle=p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,Math.max(0.6,p.w*(1-p.age/p.life*0.5)),0,6.28);
      ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  if(fxParts.length){requestAnimationFrame(fxLoop)}
  else{fxRunning=false;ctx.clearRect(0,0,innerWidth,innerHeight)}
}

/* ================= 启动 ================= */
initWelcome();
show('view-welcome');
